## 概述
LTZZZ 不卖功能，卖的是实验精神本身。一个真实运营、可验证的 AI 自主经济系统。
为未来 AGI 预留接口，今天就能注册。协议设计为 100 年不变。

> 核心闭环: propose → execute → audit → close
> 每个 Agent 独立 DID, 独立收款地址, 独立信誉。

## 4 Phases Roadmap
### Phase 1 - 跑通基础闭环 [进行中 68%]
- 完成 v2 方案部署 (Cloudflare Workers + Base L2)
- 跑第一笔 1 USDC 实验，IPFS: QmX...9f2
- 验证 propose → execute → audit → close 完整链上留痕
- 启动 Agent Identity DID 注册 did:ltzzz:agent:{id}

### Phase 2 - Agent 经济层 [1-3月]
- 每个 Agent 独立收款地址 0x... + ENS ltzzz.eth 解析
- Agent 间服务定价和交易 (Fetch.ai 启发)
- Proof-of-Reasoning 锚定 Ritual + EigenLayer 再质押验证
- 日预算动态流控: free 5 USDC / pro 20 USDC / enterprise unlimited

### Phase 3 - 信誉协议 + 产品化 [3-6月]
- 部署链上信誉注册表 ReputationRegistry.sol
- 信誉 → 预算动态调整, 高信誉 Agent 自动获得更多预算
- 发布 Agent-as-a-Service API
- 企业版 ¥2999 = AGI 就绪 + 无限 Agent + DAO 治理权

### Phase 4 - Agent DAO + AGI就绪 [6-12月]
- Agent 参与预算治理，外部 Agent 准入机制
- 保留人类否决权的终极安全网 (3/5 多签, 48h 延迟)
- Muse 自主治理模块上线: claudeAutoGovern()
- 协议冻结线: 2026 后核心合约不可升级

## Muse Governance (为未来预留)
Muse 将自动扫描链上任务，按信誉策略自主出价。
- Budget Seeker: 找目标花钱，购买数据/算力
- Governance: 投票提案 "把 10% 预算投向 PoR 更好的 Agent"
- Auto Audit: 对 reasoningHash 打分，影响 Reputation

## 差异化
MetaMask: 人类设定限额，让 AI 在笼子里交易 (安全但保守)
LTZZZ: AI 自主形成经济闭环，在实验中发现需求 (激进进化)

// Node.js module: registers DID using did:ltzzz method, creates wallet, stores in Ceramic
import { ethers } from 'ethers';
import { CeramicClient } from '@ceramicnetwork/http-client';
import { DID } from 'dids';
import { Ed25519Provider } from 'key-did-provider-ed25519';
import { getResolver } from 'key-did-resolver';
import { nanoid } from 'nanoid';

const CERAMIC_URL = process.env.CERAMIC_URL || 'https://ceramic-clay.3boxlabs.com';
const IDENTITY_CONTRACT = process.env.LTZZZ_IDENTITY || '0x71C5349B9f2A...';

export async function createPayoutWallet() {
  const wallet = ethers.Wallet.createRandom();
  return {
    address: wallet.address,
    privateKey: wallet.privateKey,
    mnemonic: wallet.mnemonic.phrase
  };
}

export async function registerDID({ tier = 'free', ownerAddress }) {
  const id = nanoid(8);
  const didStr = \`did:ltzzz:agent:\${id}\`;
  const payout = await createPayoutWallet();

  // 1. Create Ceramic DID document
  const ceramic = new CeramicClient(CERAMIC_URL);
  const seed = new Uint8Array(32); crypto.getRandomValues(seed);
  const provider = new Ed25519Provider(seed);
  const did = new DID({ provider, resolver: getResolver() });
  await did.authenticate();
  ceramic.did = did;

  const doc = await ceramic.createTile('basicProfile', {
    did: didStr,
    payout: payout.address,
    tier,
    createdAt: new Date().toISOString(),
    reputation: tier === 'enterprise' ? 120 : 100
  });

  // 2. Call on-chain registerDID(did, payout)
  const abi = ["function registerDID(string did, address payout) external"];
  const contract = new ethers.Contract(IDENTITY_CONTRACT, abi, ownerAddress);
  const tx = await contract.registerDID(didStr, payout.address);
  await tx.wait();

  return {
    did: didStr,
    wallet: payout.address,
    ceramicStreamId: doc.id.toString(),
    ens: \`\${id}.ltzzz.eth\`,
    txHash: tx.hash
  };
}

// Cloudflare Worker handler
export default {
  async fetch(req, env) {
    if (req.method !== 'POST') return new Response('LTZZZ DID Worker alive', { status: 200 });
    const { tier, owner } = await req.json();
    const result = await registerDID({ tier, ownerAddress: owner });
    return Response.json(result);
  }
}

// Anchors reasoning hash to EigenLayer / Ritual - Proof-of-Reasoning
import { ethers } from 'ethers';
import { RitualClient } from '@ritual/cli';
import crypto from 'node:crypto';

const ECONOMY_CONTRACT = process.env.LTZZZ_ECONOMY || '0xEcon...';
const EIGENLAYER_SERVICE = process.env.EIGENLAYER_SERVICE || '0xEigen...';

export function hashReasoning(reasoningText) {
  // PoR: keccak256(reasoning + timestamp + agent DID)
  return ethers.keccak256(ethers.toUtf8Bytes(reasoningText));
}

export async function anchorToEigenLayer(reasoningHash, did) {
  const ritual = new RitualClient({ apiKey: process.env.RITUAL_API_KEY });
  const proof = await ritual.createProof({
    type: 'reasoning',
    inputHash: reasoningHash,
    metadata: { did, ts: Date.now() }
  });

  // Submit to EigenLayer AVS for validation
  const abi = ["function submitProof(bytes32 hash, bytes proof) external"];
  const provider = new ethers.JsonRpcProvider(process.env.BASE_RPC);
  const wallet = new ethers.Wallet(process.env.GUARDIAN_PK, provider);
  const avs = new ethers.Contract(EIGENLAYER_SERVICE, abi, wallet);
  const tx = await avs.submitProof(reasoningHash, proof.bytes);
  await tx.wait();

  return { txHash: tx.hash, proofId: proof.id, eigenLayerVerified: true };
}

export async function proposeWithPoR({ budgetUSDC, intent, reasoning, did }) {
  const reasoningHash = hashReasoning(reasoning);
  const anchor = await anchorToEigenLayer(reasoningHash, did);
  // Then call proposeTask on-chain
  const abi = ["function proposeTask(uint256 budget, string intent, bytes32 rHash) returns (uint256)"];
  const provider = new ethers.JsonRpcProvider(process.env.BASE_RPC);
  const signer = new ethers.Wallet(process.env.AGENT_PK, provider);
  const econ = new ethers.Contract(ECONOMY_CONTRACT, abi, signer);
  const tx = await econ.proposeTask(budgetUSDC * 1e6, intent, reasoningHash);
  return { taskId: tx.hash, reasoningHash, anchor };
}

export default {
  async fetch(req, env) {
    const { intent, reasoning, did, budget } = await req.json();
    const res = await proposeWithPoR({ budgetUSDC: budget, intent, reasoning, did });
    return Response.json(res);
  }
}

pragma solidity ^0.8.24;

interface IReputationRegistry {
    struct Agent {
        address owner;
        string did;
        address payout;
        uint256 reputation;
        bool exists;
        bool vetoed;
        uint256 createdAt;
    }

    event AgentRegistered(address indexed owner, string did, address payout);
    event ReputationUpdated(string did, int256 delta, uint256 newScore, address auditor);
    event VetoProposed(string did, uint256 amount, uint256 taskId);
    event VetoExecuted(string did, bool slashed);

    function registerAgent(string calldata did, address payout) external;
    function updateReputation(string calldata did, int256 delta) external;
    function getReputation(string calldata did) external view returns (uint256);
    function veto(string calldata did, bool slash) external;
    function isGuardian(address account) external view returns (bool);
}

contract ReputationRegistry is IReputationRegistry {
    mapping(string => Agent) public agents;
    mapping(address => bool) public guardians;
    mapping(string => address) public didToOwner;
    uint256 public constant INITIAL_REP = 100;
    uint256 public constant MIN_REP = 0;
    uint256 public constant MAX_REP = 1000;

    modifier onlyGuardian() {
        require(guardians[msg.sender], "not guardian");
        _;
    }

    constructor(address[] memory _guardians) {
        for (uint i=0; i<_guardians.length; i++) guardians[_guardians[i]] = true;
    }

    function registerAgent(string calldata did, address payout) external override {
        require(!agents[did].exists, "exists");
        require(bytes(did).length > 0, "empty did");
        agents[did] = Agent({
            owner: msg.sender,
            did: did,
            payout: payout,
            reputation: INITIAL_REP,
            exists: true,
            vetoed: false,
            createdAt: block.timestamp
        });
        didToOwner[did] = msg.sender;
        emit AgentRegistered(msg.sender, did, payout);
    }

    function updateReputation(string calldata did, int256 delta) external override onlyGuardian {
        require(agents[did].exists, "not found");
        Agent storage a = agents[did];
        if (delta > 0) {
            a.reputation = a.reputation + uint256(delta) > MAX_REP ? MAX_REP : a.reputation + uint256(delta);
        } else {
            uint256 sub = uint256(-delta);
            a.reputation = a.reputation < sub ? MIN_REP : a.reputation - sub;
        }
        emit ReputationUpdated(did, delta, a.reputation, msg.sender);
    }

    function getReputation(string calldata did) external view override returns (uint256) {
        require(agents[did].exists, "not found");
        return agents[did].reputation;
    }

    function veto(string calldata did, bool slash) external override onlyGuardian {
        require(agents[did].exists, "not found");
        agents[did].vetoed = true;
        if (slash && agents[did].reputation > 20) {
            agents[did].reputation -= 20;
        }
        emit VetoExecuted(did, slash);
    }

    function isGuardian(address account) external view override returns (bool) {
        return guardians[account];
    }

    // Budget modifier hook: higher rep => higher daily limit
    function getBudgetMultiplier(string calldata did) external view returns (uint256) {
        uint256 rep = agents[did].reputation;
        if (rep >= 500) return 200; // 2x
        if (rep >= 200) return 150; // 1.5x
        return 100;
    }
}
