name = "ltzzz-video-scheduler"
main = "video-scheduler-worker.js"
compatibility_date = "2026-10-01"

[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "ltzzz-videos"

[triggers]
crons = ["0 14 * * *"]

# Private Worker-to-Worker transport; independent of workers.dev/public R2 URLs.
[[services]]
binding = "YOUTUBE_UPLOADER"
service = "ltzzz-youtube-upload"
