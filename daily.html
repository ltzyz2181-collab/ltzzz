<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LTZZZ 每日运行 · 6 AI 自动记录</title>
<link rel="stylesheet" href="style.css">
<style>
  body { background: #0a0e1a; color: #e8ecf4; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .daily-wrap { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
  .daily-header { text-align: center; margin-bottom: 40px; }
  .daily-header h1 { font-size: 32px; margin: 0 0 8px; background: linear-gradient(90deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .daily-header .date { color: #8b95a8; font-size: 14px; }
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
  .stat-card { background: #131929; border: 1px solid #1e2a45; border-radius: 16px; padding: 20px; text-align: center; }
  .stat-card .num { font-size: 28px; font-weight: 700; }
  .stat-card .label { font-size: 12px; color: #8b95a8; margin-top: 4px; }
  .ai-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 32px; }
  .ai-card { background: #131929; border: 1px solid #1e2a45; border-radius: 16px; padding: 20px; }
  .ai-card .ai-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .ai-card .ai-name { font-size: 18px; font-weight: 600; }
  .status { display: inline-block; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 500; }
  .status.ok { background: #064e3b; color: #34d399; }
  .status.waiting { background: #422006; color: #fbbf24; }
  .status.blocked { background: #450a0a; color: #f87171; }
  .status.off { background: #1f2937; color: #9ca3af; }
  .ai-card .ai-body { font-size: 13px; color: #b0b8c8; line-height: 1.7; }
  .ai-card .ai-err { font-size: 12px; color: #f87171; margin-top: 6px; }
  .pub-section { margin-bottom: 32px; }
  .pub-section h2 { font-size: 20px; margin: 0 0 16px; }
  .pub-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .pub-card { background: #131929; border: 1px solid #1e2a45; border-radius: 12px; padding: 16px; text-align: center; }
  .pub-card .pub-name { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .next-section { background: #131929; border: 1px solid #1e2a45; border-radius: 16px; padding: 24px; }
  .next-section h2 { font-size: 20px; margin: 0 0 16px; }
  .next-section ul { margin: 0; padding-left: 20px; line-height: 2; color: #b0b8c8; font-size: 14px; }
  .honesty-note { font-size: 12px; color: #6b7280; text-align: center; margin-top: 8px; }
  @media (max-width: 768px) { .stats-row, .ai-grid, .pub-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<nav class="nav">
  <div class="brand">LTZZZ <span>数字实验室</span></div>
  <nav>
    <a href="index.html">首页</a>
    <a href="lab.html">实验室内核</a>
    <a href="guan.html">6 AI 每日记录</a>
    <a href="agents.html">多 Agent</a>
    <a href="agi.html">未来（AGI）</a>
  </nav>
</nav>

<main class="daily-wrap">
  <div class="daily-header">
    <h1>📊 LTZZZ 每日运行</h1>
    <p class="date" id="todayDate">加载中…</p>
    <p class="honesty-note" id="honestyNote"></p>
  </div>

  <div class="stats-row" id="statsRow"></div>

  <div class="next-section" style="margin-bottom:32px">
    <h2>🧠 Memory 记忆中心</h2>
    <div id="memStatus" style="font-size:14px;color:#b0b8c8;line-height:1.8">加载中…</div>
  </div>

  <h2 style="margin:0 0 16px; font-size:20px">🤖 六 AI 模块</h2>
  <div class="ai-grid" id="aiGrid"></div>

  <div class="pub-section">
    <h2>📡 发布通道</h2>
    <div class="pub-grid" id="pubGrid"></div>
  </div>

  <div class="next-section">
    <h2>📋 下一步</h2>
    <ul id="nextList"></ul>
  </div>
</main>

<footer style="text-align:center;padding:24px;color:#8b95a8;font-size:13px">© 2026 LTZZZ Digital Lab · Daily Automation Phase-1</footer>

<script>
// 状态 -> {class, label}
const STATUS_MAP = {
  ok:       { cls: "ok",       label: "🟢 已执行" },
  waiting:  { cls: "waiting", label: "🟡 等凭证" },
  blocked:  { cls: "blocked", label: "🔴 等 API" },
  off:      { cls: "off",     label: "⚪ 未启用" },
  unknown:  { cls: "off",     label: "⚪ 未知" },
};
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function renderStats(s) {
  const cards = [
    { num: s.ais_ok,       color: "#34d399", label: "✅ 已执行/在线" },
    { num: s.ais_blocked,  color: "#f87171", label: "🔴 等 API" },
    { num: s.ais_waiting,  color: "#fbbf24", label: "🟡 等人工凭证" },
    { num: s.pub_ok,       color: "#60a5fa", label: "🟢 已上线通道" },
  ];
  document.getElementById("statsRow").innerHTML = cards.map(c =>
    `<div class="stat-card"><div class="num" style="color:${c.color}">${c.num}</div><div class="label">${c.label}</div></div>`
  ).join("");
}

function renderAis(ais) {
  document.getElementById("aiGrid").innerHTML = ais.map(a => {
    const st = STATUS_MAP[a.status] || STATUS_MAP.unknown;
    const err = a.error ? `<div class="ai-err">⚠ ${esc(a.error)}</div>` : "";
    return `<div class="ai-card">
      <div class="ai-head"><span class="ai-name">${esc(a.name)}</span>
        <span class="status ${st.cls}">${esc(st.label)}</span></div>
      <div class="ai-body">${esc(a.output) || "—"}${err}</div>
    </div>`;
  }).join("");
}

function renderPublish(pub) {
  document.getElementById("pubGrid").innerHTML = pub.map(p => {
    const st = STATUS_MAP[p.status] || STATUS_MAP.unknown;
    return `<div class="pub-card">
      <div class="pub-name">${esc(p.channel)}</div>
      <span class="status ${st.cls}">${esc(st.label)}</span>
    </div>`;
  }).join("");
}

function renderNext(steps) {
  document.getElementById("nextList").innerHTML =
    (steps || []).map(s => `<li>${esc(s)}</li>`).join("") ||
    "<li>（暂无）</li>";
}

async function loadMem() {
  const el = document.getElementById("memStatus");
  try {
    const gw = "https://ltzzz-memory-gateway.ltzyz2181.workers.dev";
    const [h, m] = await Promise.all([
      fetch(gw + "/health").then(r => r.json()),
      fetch(gw + "/manifest").then(r => r.json()).catch(() => null),
    ]);
    const files = m && m.files ? m.files.length : "?";
    const bound = h.r2_bound ? "✅ R2 已绑定" : "🟡 R2 未绑定（GitHub 源）";
    el.innerHTML = `Gateway: ${h.ok ? "✅ 在线" : "❌ 离线"} · 源: ${h.source || "?"} · ${bound} · 记忆文件: ${files} 个 · <a href="${gw}/manifest" target="_blank" style="color:#60a5fa">查看清单</a>`;
  } catch (e) {
    el.textContent = "Gateway 不可达: " + e.message;
  }
}

async function load() {
  try {
    const res = await fetch("daily-data.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    document.getElementById("todayDate").textContent = d.date + " · 数据来自 results/daily";
    if (d.honesty) document.getElementById("honestyNote").textContent = d.honesty.note || "";
    renderStats(d.summary || {});
    renderAis(d.ais || []);
    renderPublish(d.publish || []);
    renderNext(d.next_steps || []);
  } catch (e) {
    document.getElementById("todayDate").textContent = "daily-data.json 未生成 — 请先运行 node scripts/build-daily-data.js";
    console.error("daily-data load failed:", e);
  }
}
load();
loadMem();
</script>
</body>
</html>
