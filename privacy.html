<h1>LTZZZ 隐私政策</h1>
<p>生效日期：2026-09-21</p>
<h2>1. 收集的信息</h2>
<p>在用户通过 TikTok 授权后，本应用仅收集完成发布功能所必需的信息：用户的 open_id、显示名称、头像，以及发布视频所需的 access_token（服务端加密存储）。</p>
<h2>2. 信息使用</h2>
<p>收集的信息仅用于：完成用户主动发起的视频发布、展示连接状态。不会用于广告，不会出售给第三方。</p>
<h2>3. 数据存储</h2>
<p>access_token 存储在服务端 KV 中，不放在浏览器本地。用户随时可在 TikTok 账号设置中撤销授权。</p>
<h2>4. 联系方式</h2>
<p>隐私问题请联系 ltzyz2181@gmail.com。</p>
