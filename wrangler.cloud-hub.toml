name = "ltzzz-cloud-hub"
main = "ltzzz-cloud-hub-worker.js"
compatibility_date = "2026-10-20"

# 复用现有 KV 命名空间；cloud-hub 使用 task:/video: 前缀，与 youtube-upload 的 yt: 键不冲突。
[[kv_namespaces]]
binding = "KV"
id = "63c6bb670cfc42b18b4d232605d5bcad"

# Free 账户 cron 触发器已达 5 个上限，本 Worker 不挂 cron；
# 定时排空由 video-scheduler 自身 cron 负责，本网关提供 /video/submit 与 /video/status。
