name = "ltzzz-wep3"
main = "wep3-worker.js"
compatibility_date = "2026-09-30"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "PAY_KV"
id = "63c6bb670cfc42b18b4d232605d5bcad"

[vars]
SINGLE_CAP = "5"

[[durable_objects.bindings]]
name = "MARKET"
class_name = "MarketRuntimeV3"

[[migrations]]
tag = "market-v1"
new_sqlite_classes = ["Market"]

# Preserve the existing namespace/storage; do not create a fresh financial book.
[[migrations]]
tag = "market-v2"
renamed_classes = [{ from = "Market", to = "MarketRuntimeV2" }]

# Receipt-sensor runtime rollover: rename preserves the same namespace and book.
[[migrations]]
tag = "market-v3-receipt-sensor"
renamed_classes = [{ from = "MarketRuntimeV2", to = "MarketRuntimeV3" }]
