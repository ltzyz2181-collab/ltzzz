name = "ltzzz-wep3"
main = "wep3-worker.js"
compatibility_date = "2026-09-30"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "PAY_KV"
id = "63c6bb670cfc42b18b4d232605d5bcad"

[vars]
SINGLE_CAP = "5"
# First deploy is read-only. Set to 1 only after the documented KV cutover checks.
LEGACY_KV_FROZEN = "0"

[[durable_objects.bindings]]
name = "MARKET"
class_name = "MarketRuntimeV3"

[[durable_objects.bindings]]
name = "WEP3_LEDGER"
class_name = "Wep3Ledger"

[[migrations]]
tag = "market-v1"
new_sqlite_classes = ["Market"]

# Preserve the existing namespace/storage; do not create a fresh financial book.
[[migrations]]
tag = "market-v2"
renamed_classes = [{ from = "Market", to = "MarketRuntimeV2" }]

# Forward-only rename: preserve the same SQLite object IDs, book and signed intents.
[[migrations]]
tag = "market-v3"
renamed_classes = [{ from = "MarketRuntimeV2", to = "MarketRuntimeV3" }]

[[migrations]]
tag = "wep3-ledger-v1"
new_sqlite_classes = ["Wep3Ledger"]
