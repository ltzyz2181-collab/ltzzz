name: AGI Econ Subnet Cycle (ledger mode)

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

concurrency:
  group: agi-econ-subnet
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests
        run: node --test scripts/tests/agi-econ.test.mjs
      - name: Run cycle (ledger only; optional DeepSeek for deliverable)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/agi-econ/run-cycle.mjs
      - name: Commit results
        run: |
          git config user.name "ltzzz-bot"
          git config user.email "ltzzz-bot@users.noreply.github.com"
          git add data/agi-econ results/agi-econ
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore(agi-econ): ledger cycle $(date -u +%F)"
          git pull --rebase && git push
