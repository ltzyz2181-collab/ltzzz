name: AGI Econ Subnet Cycle (ledger mode)

on:
  schedule:
    - cron: "40 3 * * *"
    - cron: "40 9 * * *" # same-day idempotent fallback
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/agi-econ/**', 'scripts/tests/agi-econ*.mjs', '.github/workflows/agi-econ-subnet.yml']

concurrency:
  group: agi-econ-subnet
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests
        run: |
          mkdir -p work
          node --test --test-reporter=tap scripts/tests/agi-econ.test.mjs scripts/tests/agi-econ-recovery.test.mjs scripts/tests/agi-econ-action.test.mjs scripts/tests/agi-econ-probation.test.mjs scripts/tests/agi-econ-stage.test.mjs scripts/tests/agi-econ-replay.test.mjs > work/action-tests.tap
          cat work/action-tests.tap
      - name: Persist owner role withdrawal and code acceptance
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import {Subnet} from './scripts/agi-econ/subnet.mjs';
          const s=new Subnet(process.cwd());s.save();fs.mkdirSync('results/agi-econ',{recursive:true});
          const tap=fs.readFileSync('work/action-tests.tap','utf8');const count=Number(tap.match(/^# pass (\d+)$/m)?.[1]||0);if(!count||!/^# fail 0$/m.test(tap))throw Error('test result missing or failed');
          fs.writeFileSync('results/agi-econ/code-acceptance-'+process.env.GITHUB_RUN_ID+'.json',JSON.stringify({at:new Date().toISOString(),source_commit:process.env.GITHUB_SHA,run_id:process.env.GITHUB_RUN_ID,tests_passed:count,claude_status:s.state.agents['did:ltzzz:claude']?.status||'not_registered',new_role_seed_allowed:false,push_model_calls:0,real_wage_paid:false,tx_hash:null},null,2));
          JS
      - name: Run cycle (ledger only; real worker models + independent model audit + settlement gate)
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-ai-hire]')
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          LTZZZ_AGENT_TOKEN: ${{ secrets.LTZZZ_AGENT_TOKEN }}
          MOONSHOT_API_KEY_CN: ${{ secrets.MOONSHOT_API_KEY_CN }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY || secrets.ARK_API_KEY }}
          DOUBAO_MODEL: ${{ vars.DOUBAO_MODEL }}
          DOUBAO_BASE_URL: ${{ vars.DOUBAO_BASE_URL || secrets.DOUBAO_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: node scripts/agi-econ/run-cycle.mjs
      - name: Reputation patrol (offline; no model calls)
        if: always()
        run: node scripts/agi-econ/patrol.mjs
      - name: Commit results
        if: always()
        run: |
          git config user.name "ltzzz-bot"
          git config user.email "ltzzz-bot@users.noreply.github.com"
          git add data/agi-econ results/agi-econ
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore(agi-econ): ledger cycle $(date -u +%F)"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
