name: AGI Econ Subnet Cycle (ledger mode)

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/agi-econ/**', 'scripts/tests/agi-econ*.mjs', '.github/workflows/agi-econ-subnet.yml']

concurrency:
  group: agi-econ-subnet
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests
        run: node --test scripts/tests/agi-econ.test.mjs scripts/tests/agi-econ-recovery.test.mjs
      - name: Persist owner role withdrawal and code acceptance
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import {Subnet} from './scripts/agi-econ/subnet.mjs';
          const s=new Subnet(process.cwd());s.save();fs.mkdirSync('results/agi-econ',{recursive:true});
          fs.writeFileSync('results/agi-econ/code-acceptance-'+process.env.GITHUB_RUN_ID+'.json',JSON.stringify({at:new Date().toISOString(),source_commit:process.env.GITHUB_SHA,run_id:process.env.GITHUB_RUN_ID,tests_passed:13,claude_status:s.state.agents['did:ltzzz:claude']?.status||'not_registered',new_role_seed_allowed:false,push_model_calls:0,real_wage_paid:false,tx_hash:null},null,2));
          JS
      - name: Run cycle (ledger only; real worker models + independent model audit + settlement gate)
        if: github.event_name != 'push'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MOONSHOT_API_KEY_CN: ${{ secrets.MOONSHOT_API_KEY_CN }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          DOUBAO_MODEL: ${{ secrets.DOUBAO_MODEL }}
        run: node scripts/agi-econ/run-cycle.mjs
      - name: Commit results
        run: |
          git config user.name "ltzzz-bot"
          git config user.email "ltzzz-bot@users.noreply.github.com"
          git add data/agi-econ results/agi-econ
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore(agi-econ): ledger cycle $(date -u +%F)"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
