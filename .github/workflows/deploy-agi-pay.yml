name: Deploy LTZZZ AGI Pay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agi-pay-worker.js'
      - 'wrangler.agi-pay.toml'
      - '.github/workflows/deploy-agi-pay.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject LTZZZ_AGENT_TOKEN
        run: printf '%s' "$LTZZZ_AGENT_TOKEN" | npx wrangler secret put LTZZZ_AGENT_TOKEN --name ltzzz-agi-pay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LTZZZ_AGENT_TOKEN: ${{ secrets.LTZZZ_AGENT_TOKEN }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.agi-pay.toml
