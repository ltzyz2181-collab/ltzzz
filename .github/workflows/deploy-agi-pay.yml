name: Deploy LTZZZ AGI Pay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agi-pay-worker.js'
      - 'wrangler.agi-pay.toml'
      - '.github/workflows/deploy-agi-pay.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.agi-pay.toml
