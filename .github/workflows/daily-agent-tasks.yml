name: Daily Agent Tasks

# 说明（2026-10-08 总控修复）：
# 1) 原 cron '0 0 * * *' 名义北京 08:00，但实测实际生成于 12:03/12:51/12:18
#    —— GitHub 免费档 cron 高延迟 + 本仓 write 工作流串行排队所致。
#    改为双档触发：主跑 UTC 22:00（北京 06:00，提前量）+ 兜底 UTC 06:00（北京 14:00）。
#    谁先跑成谁产出；脚本按日期幂等，重复跑不覆盖已存在的当日结果。
# 2) 原并发组 ltzzz-main-writes 与 patrol/memory/pages 抢锁，导致日课被无限期推后。
#    日课改用独立并发组，避免被其他写工作流阻塞。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-agent-tasks.yml'
      - 'scripts/run-daily-tasks.mjs'
      - 'scripts/daily-task-board.mjs'
      - 'scripts/lib/daily-task-board.mjs'
      - 'scripts/lib/daily-board-lineage.mjs'
      - 'scripts/lib/daily-independent-review.mjs'
      - 'scripts/lib/daily-channels.mjs'
      - 'scripts/call-qwen.mjs'
      - 'scripts/lib/qwen-config.mjs'
      - 'scripts/tests/daily-independent-review.test.mjs'
      - 'scripts/tests/daily-task-board.test.mjs'
      - 'scripts/tests/daily-board-lineage.test.mjs'
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = 北京 06:00（主跑，提前量）
    - cron: '0 6 * * *'    # UTC 06:00 = 北京 14:00（兜底）
  workflow_dispatch:      # 支持手动触发
  workflow_run:
    workflows: ['Deploy and control LTZZZ Pulse']
    types: [completed]
    branches: [main]

permissions:
  contents: write         # 允许把 data/ 结果 commit 回仓库

concurrency:
  group: ltzzz-daily-agent-tasks   # 独立锁，不与 patrol/memory 抢
  cancel-in-progress: false

jobs:
  run-tasks:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test execution, delivery, and economic status classification
        run: node scripts/check-core-memory.mjs && node --test scripts/tests/task-outcome.test.mjs scripts/tests/delivery-integrity.test.mjs scripts/tests/core-memory-integrity.test.mjs scripts/tests/external-return-dispatch.test.mjs scripts/tests/external-report.test.mjs scripts/tests/daily-task-board.test.mjs scripts/tests/daily-independent-review.test.mjs scripts/tests/daily-board-lineage.test.mjs scripts/tests/daily-assignment.test.mjs scripts/tests/daily-assignment-handover.test.mjs scripts/tests/pulse-tasks.test.mjs scripts/tests/ans-task-review.test.mjs

      - name: Preflight — 当日是否已产出（幂等）
        id: preflight
        run: |
          D=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          echo "today=$D" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment verification only; no model calls or task mutations"
          elif [ -f "data/results/$D.json" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::data/results/$D.json 已存在，跳过（幂等）"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::data/results/$D.json 缺失，执行日课"
          fi

      - name: Reserve daily calls and verify live task claims
        if: steps.preflight.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DAILY_DATE: ${{ steps.preflight.outputs.today }}
        run: node scripts/daily-task-board.mjs prepare

      - name: Persist reservations before any paid generation
        if: steps.preflight.outputs.skip == 'false'
        run: |
          git config user.name "ltzzz-bot"
          git config user.email "bot@ltzzz.com"
          git add knowledge/results/daily-board/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Reserve daily task calls before generation"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

      - name: Run daily tasks
        if: steps.preflight.outputs.skip == 'false'
        env:
          DAILY_DATE: ${{ steps.preflight.outputs.today }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY || secrets.ARK_API_KEY }}
          DOUBAO_USE_PROXY: 'true'
          LTZZZ_AGENT_TOKEN: ${{ secrets.LTZZZ_AGENT_TOKEN }}
          DOUBAO_BASE_URL: ${{ vars.DOUBAO_BASE_URL || secrets.DOUBAO_BASE_URL }}
          DOUBAO_MODEL: ${{ vars.DOUBAO_MODEL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          NODE_OPTIONS: --dns-result-order=ipv4first
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY || secrets.QWEN_API_KEY }}
          DASHSCOPE_MODEL: ${{ vars.DASHSCOPE_MODEL || vars.QWEN_MODEL || 'qwen-plus' }}
          DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL || vars.QWEN_BASE_URL }}
        run: node scripts/run-daily-tasks.mjs

      - name: Commit results
        if: always() && steps.preflight.outputs.skip == 'false'
        run: |
          git config user.name "ltzzz-bot"
          git config user.email "bot@ltzzz.com"
          git add data/
          if [ -d knowledge/results/daily-board ]; then git add knowledge/results/daily-board/; fi
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "daily agent tasks $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

      - name: Reconcile committed deliveries without model calls
        if: success() && github.event_name != 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DAILY_DATE: ${{ steps.preflight.outputs.today }}
        run: node scripts/daily-task-board.mjs sync

      - name: Persist submission verification
        if: always()
        run: |
          if [ ! -d knowledge/results/daily-board ]; then exit 0; fi
          git config user.name "ltzzz-bot"
          git config user.email "bot@ltzzz.com"
          git add knowledge/results/daily-board/
          if [ -f "data/results/${{ steps.preflight.outputs.today }}.json" ]; then git add "data/results/${{ steps.preflight.outputs.today }}.json"; fi
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Daily board delivery verification (pending review, unpaid)"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

      - name: Preserve recovery artifacts if persistence fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-board-${{ github.run_id }}-${{ github.run_attempt }}
          path: knowledge/results/daily-board/
          if-no-files-found: ignore

      - name: Postflight — 产出校验
        if: steps.preflight.outputs.skip == 'false'
        run: |
          D="${{ steps.preflight.outputs.today }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment verification only; no model calls or task mutations"
          elif [ -f "data/results/$D.json" ]; then
            echo "::notice::OK 已产出 data/results/$D.json ($(stat -c%s "data/results/$D.json") bytes)"
          else
            echo "::error::FAIL 日课未产出 data/results/$D.json —— 这是活性告警，需总控介入"
            exit 1
          fi
