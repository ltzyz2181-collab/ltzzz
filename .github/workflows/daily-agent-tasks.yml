name: Daily Agent Tasks

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 00:00 = 北京时间 08:00
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write         # 允许把 data/ 结果 commit 回仓库

jobs:
  run-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run daily tasks
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/run-daily-tasks.mjs

      - name: Commit results
        run: |
          git config user.name "ltzzz-bot"
          git config user.email "bot@ltzzz.com"
          git add data/
          git commit -m "daily agent tasks $(date +%Y-%m-%d)" || echo "no changes"
          git push
