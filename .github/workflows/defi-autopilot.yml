name: DeFi pilot automated chain data
on:
  schedule:
    - cron: '40 3 * * *'
  push:
    branches: [main]
    paths: ['scripts/defi-autopilot.mjs', '.github/workflows/defi-autopilot.yml']
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: ltzzz-defi-autopilot, cancel-in-progress: false}
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save ethers@6.17.0
      - name: Observe quarantined legacy Vault (no signing)
        env:
          LTZZZ_BASE_RPC: ${{ vars.LTZZZ_BASE_RPC }}
        run: |
          node scripts/defi-autopilot.mjs
          node scripts/audit-legacy-vault.mjs
      - name: Save all chain observations and transaction status
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/defi/ knowledge/results/security/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'DeFi automated pilot actual chain data'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
