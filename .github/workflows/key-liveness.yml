name: Key Liveness Probe (AI seats)
# Reuse existing daily-generation receipts; no paid pings to disabled providers.
# External Qianwen receives files, never credentials.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/key-liveness.yml','scripts/run-credentialed-audit.mjs','scripts/lib/credentialed-audit.mjs']
  pull_request:
    paths: ['.github/workflows/key-liveness.yml','scripts/run-credentialed-audit.mjs','scripts/lib/credentialed-audit.mjs','scripts/tests/audit-evidence.test.mjs']
  workflow_run:
    workflows: ['Daily Agent Tasks','Bounded Doubao daily recovery','Deploy coded agent identity and Kimi quality profile']
    types: [completed]
    branches: [main]
permissions: {contents: read}
concurrency: {group: ltzzz-credentialed-audit, cancel-in-progress: false}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/tests/audit-evidence.test.mjs scripts/tests/external-report.test.mjs
  audit:
    needs: test
    if: github.event_name != 'pull_request'
    permissions: {contents: write}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify committed real generation and credential gates without new model calls
        env:
          LTZZZ_AGENT_TOKEN: ${{ secrets.LTZZZ_AGENT_TOKEN }}
        run: node scripts/run-credentialed-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credentialed-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: knowledge/results/credentialed-audit/
          retention-days: 30
      - name: Preserve auditable receipts
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/credentialed-audit/
          git diff --staged --quiet && exit 0
          git commit -m 'Credentialed Actions audit: real generation receipts and zero-generation auth checks'
          node tools/push-receipt-commit.mjs
