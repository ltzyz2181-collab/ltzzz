name: Key Liveness Probe (AI seats)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1'   # 每周一 UTC 01:30 = 北京周一 09:30（owner确认每周）

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe each AI seat key
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MOONSHOT_API_KEY_CN: ${{ secrets.MOONSHOT_API_KEY_CN }}
          MOONSHOT_API_KEY_INTL: ${{ secrets.MOONSHOT_API_KEY_INTL || secrets.MOONSHOT_API_KEY_ }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
        run: |
          mkdir -p knowledge/results
          OUT="knowledge/results/key-liveness-$(date -u +%Y-%m-%d).json"
          echo "[" > "$OUT"
          echo '  {"seat":"gpt","status":"disabled_by_owner","http":null},' >> "$OUT"
          probe() {
            local name="$1"; local url="$2"; local key="$3"; local auth="$4"; local body="$5"
            local code resp timeout=30 status
            [[ "$name" == kimi_* ]] && timeout=300
            if [ -z "$key" ]; then
              echo "  {\"seat\":\"$name\",\"status\":\"no_secret\",\"http\":null}," >> "$OUT"
              echo "$name: NO_SECRET"; return
            fi
            if [ "$auth" = "x-api-key" ]; then
              resp=$(curl -s -m "$timeout" -w "\n%{http_code}" -X POST "$url" \
                -H "Content-Type: application/json" \
                -H "x-api-key: $key" \
                -H "anthropic-version: 2023-06-01" \
                -d "$body" 2>/dev/null) || true
            else
              resp=$(curl -s -m "$timeout" -w "\n%{http_code}" -X POST "$url" \
                -H "Content-Type: application/json" \
                -H "$auth: Bearer $key" \
                -d "$body" 2>/dev/null) || true
            fi
            code=$(echo "$resp" | tail -1)
            status="http_$code"
            if [ "$code" = "000" ] || ! [[ "$code" =~ ^[1-5][0-9][0-9]$ ]]; then code=null; status=network_or_timeout; fi
            echo "  {\"seat\":\"$name\",\"status\":\"$status\",\"http\":$code}," >> "$OUT"
            echo "$name -> HTTP $code"
          }
          probe "deepseek"  "https://api.deepseek.com/chat/completions"     "$DEEPSEEK_API_KEY"  "Authorization" '{"model":"deepseek-chat","messages":[{"role":"user","content":"ping"}],"max_tokens":5}'
          probe "grok"      "https://api.x.ai/v1/chat/completions"          "$XAI_API_KEY"       "Authorization" '{"model":"grok-4-fast","messages":[{"role":"user","content":"ping"}],"max_tokens":5}'
          probe "kimi_cn" "https://api.moonshot.cn/v1/chat/completions" "$MOONSHOT_API_KEY_CN" "Authorization" '{"model":"kimi-k2.6","messages":[{"role":"user","content":"Reply OK only"}],"max_tokens":256,"temperature":1}'
          probe "kimi_intl" "https://api.moonshot.ai/v1/chat/completions" "$MOONSHOT_API_KEY_INTL" "Authorization" '{"model":"kimi-k2.6","messages":[{"role":"user","content":"Reply OK only"}],"max_tokens":256,"temperature":1}'
          echo "  {\"seat\":\"_end\",\"status\":\"done\"}" >> "$OUT"
          echo "]" >> "$OUT"
          echo "----- result -----"
          cat "$OUT"

      - name: Commit probe result
        run: |
          git config user.name "ltzzz-xai-bot"
          git config user.email "bot@ltzzz.local"
          git add knowledge/results/key-liveness-*.json || true
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "chore(probe): AI seat key liveness $(date -u +%Y-%m-%d)"
          git push
