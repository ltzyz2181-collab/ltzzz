name: Deploy Claude seat metadata (no models)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['workers/claude-seat/**','wrangler.claude-seat.toml','identity/agent-card.js','identity/seat-registry.json','scripts/bind-claude-seat-domain.mjs','.github/workflows/deploy-claude-seat.yml']
permissions: {contents: write}
concurrency: {group: claude-seat-metadata-deploy, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/tests/seat-registry.test.mjs
      - name: Deploy read-only metadata worker; no inference or wallet credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy -c wrangler.claude-seat.toml
      - name: Bind only new Claude domain if current token permits
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/bind-claude-seat-domain.mjs
      - name: Preserve domain result without keys
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/identity/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Claude metadata domain actual binding or blocker'
          node tools/push-receipt-commit.mjs
