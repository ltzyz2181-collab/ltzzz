name: Linear Board Export
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'
permissions: {contents: write}
concurrency: {group: linear-board-export, cancel-in-progress: false}
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Contract tests before touching the real board
        run: node --test scripts/tests/linear-read.test.mjs scripts/tests/linear-seat-probe.test.mjs scripts/tests/linear-board-export.test.mjs
      - name: Read-only board export (no Linear writes)
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node scripts/linear-board-export.mjs
      - name: Commit snapshot
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add ops/dispatch/inbox/gpt/linear-board-latest.json
          if git diff --staged --quiet; then echo "no_change"; exit 0; fi
          git commit -m "chore(linear): 只读看板导出 $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1