name: Memory OS State

on:
  schedule:
    - cron: "50 23 * * *"   # UTC 23:50 = CST 07:50 before GPT slot
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ltzzz-memory/**'
      - 'lab/MEMORY.md'
      - 'lab/DECISIONS.md'
      - 'lab/tasks.md'
      - 'tools/build-memory-state.mjs'

permissions:
  contents: write

concurrency:
  group: memory-os-state
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build STATE snapshot
        run: node tools/build-memory-state.mjs
      - name: Commit STATE
        run: |
          git config user.name "ltzzz-memory-engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory/state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(memory): refresh OS STATE snapshot"
          git pull --rebase origin main || true
          git push origin HEAD:main
      - name: Optional R2 upload
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_BUCKET:-}" ]; then
            echo "R2 not configured — GitHub STATE still published."
            exit 0
          fi
          pip install -q awscli
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          ENDPOINT="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync memory/state "s3://${R2_BUCKET}/memory/state" --endpoint-url "$ENDPOINT"
          aws s3 sync ltzzz-memory "s3://${R2_BUCKET}/ltzzz-memory" --endpoint-url "$ENDPOINT" --exclude "*" --include "*.md" --include "*.json"
