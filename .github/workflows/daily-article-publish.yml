name: DeepSeek daily WeChat article (Douyin and Channels paused)

on:
  schedule:
    - cron: "20 11 * * *"   # 19:20 CST，早于 wechat worker 20:00 CST 建草稿
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD (CST), default today"
        required: false

concurrency:
  group: daily-article
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 300
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate + publish
        env:
          ARTICLE_DATE: ${{ github.event.inputs.date }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publish-daily-article.mjs
      - name: Commit artifacts
        run: |
          git config user.name "ltzzz-bot"
          git config user.email "ltzzz-bot@users.noreply.github.com"
          git add content/daily-articles results/publishing
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "content: daily memory article $(date -u +%F)"
          git pull --rebase && git push
