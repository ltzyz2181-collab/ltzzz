name: Inspect team wallet and cloud video queue (no publication)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ops/dispatch/TEAM-MEDIA-READINESS-20261020.json','scripts/inspect-team-media.mjs','.github/workflows/team-media-readiness.yml']
  pull_request:
    paths: ['scripts/lib/article-sources.mjs','scripts/publish-daily-article.mjs','wechat-article-eligibility.js','video-scheduler-worker.js','scripts/inspect-team-media.mjs','.github/workflows/team-media-readiness.yml']
permissions: {contents: read}
concurrency: {group: team-media-readiness, cancel-in-progress: false}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check scripts/inspect-team-media.mjs && node --test scripts/tests/article-sources.test.mjs scripts/tests/wechat-publishing.test.mjs scripts/tests/video-scheduler.test.mjs scripts/tests/video-queue-client.test.mjs
  inspect:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read actual queue, cloud cron, prior publication and two Base RPCs
        env:
          LTZZZ_AGENT_TOKEN: ${{ secrets.LTZZZ_AGENT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/inspect-team-media.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-media-${{ github.run_id }}
          path: knowledge/results/team-ops/
      - name: Commit public readback evidence, no secrets
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/team-ops/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Team wallet and cloud media readback without publication or transfer'
          node tools/push-receipt-commit.mjs
