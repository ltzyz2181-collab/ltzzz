name: Qwen dispatch consumer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ops/dispatch/queue/*.json']
permissions: {contents: write}
concurrency: {group: qwen-dispatch, cancel-in-progress: false}
jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/tests/qwen-dispatch.test.mjs
      - name: Process at most one pending Qwen card (native DashScope, existing Secret)
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY || secrets.QWEN_API_KEY }}
          DASHSCOPE_MODEL: ${{ vars.DASHSCOPE_MODEL || vars.QWEN_MODEL || 'qwen-plus' }}
          DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL || vars.QWEN_BASE_URL }}
        run: node scripts/run-qwen-dispatch.mjs
      - name: Commit actual receipt
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/qwen-dispatch/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Qwen dispatch receipt (draft, not accepted)'
          node tools/push-receipt-commit.mjs
