name: Qwen dispatch consumer
on:
  pull_request:
    paths: ['scripts/run-qwen-dispatch.mjs','scripts/call-qwen.mjs','scripts/delivery-integrity.mjs','scripts/run-daily-tasks.mjs','scripts/lib/daily-task-board.mjs','scripts/tests/qwen-dispatch.test.mjs','scripts/tests/qwen-native.test.mjs','scripts/tests/delivery-integrity.test.mjs','scripts/tests/daily-task-board.test.mjs','scripts/tests/daily-independent-review.test.mjs','scripts/tests/ans-final-review-revalidation.test.mjs','scripts/tests/ans-final-review-recovery.injection.mjs','.github/workflows/qwen-dispatch.yml']
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ops/dispatch/queue/*.json']
permissions: {contents: write}
concurrency: {group: qwen-dispatch, cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check scripts/run-daily-tasks.mjs && node --check scripts/lib/daily-task-board.mjs && node --check scripts/tests/ans-final-review-recovery.injection.mjs && node --test scripts/tests/qwen-dispatch.test.mjs scripts/tests/qwen-native.test.mjs scripts/tests/delivery-integrity.test.mjs scripts/tests/seat-delivery.test.mjs scripts/tests/daily-task-board.test.mjs scripts/tests/daily-independent-review.test.mjs scripts/tests/ans-final-review-revalidation.test.mjs && node scripts/tests/ans-final-review-recovery.injection.mjs
  consume:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/tests/qwen-dispatch.test.mjs
      - name: Process at most one pending Qwen card (native DashScope, existing Secret)
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY || secrets.QWEN_API_KEY }}
          DASHSCOPE_MODEL: ${{ vars.DASHSCOPE_MODEL || vars.QWEN_MODEL || 'qwen-max' }}
          DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL || vars.QWEN_BASE_URL }}
        run: node scripts/run-qwen-dispatch.mjs
      - name: Commit actual receipt
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/qwen-dispatch/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Qwen dispatch receipt (draft, not accepted)'
          node tools/push-receipt-commit.mjs
