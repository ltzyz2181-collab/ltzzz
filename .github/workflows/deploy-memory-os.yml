name: Deploy Memory OS (R2 + Daily cron + Engine)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ltzzz-daily-automation-worker.js', '.github/workflows/deploy-memory-os.yml', 'scripts/tests/daily-resilience.test.mjs']

permissions:
  contents: write

jobs:
  deploy-daily-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test daily invocation and failure boundaries without model calls
        run: node --test scripts/tests/daily-resilience.test.mjs
      - name: Deploy Daily Scheduler with existing cron triggers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.daily.toml
      - name: Configure daily worker secrets (model keys stay in CF Secrets, never in repo)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY || secrets.DOUBAO_API_KEY }}
          LTZZZ_AGENT_TOKEN: ${{ secrets.LTZZZ_AGENT_TOKEN }}
          DOUBAO_MODEL: ${{ secrets.DOUBAO_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: |
          test -n "$LTZZZ_AGENT_TOKEN"
          printf '%s' "$LTZZZ_AGENT_TOKEN" | npx --yes wrangler@4 secret put LTZZZ_AGENT_TOKEN -c wrangler.daily.toml
          printf '%s' "$ARK_API_KEY" | npx --yes wrangler@4 secret put ARK_API_KEY -c wrangler.daily.toml
          if [ -n "$DOUBAO_MODEL" ]; then printf '%s' "$DOUBAO_MODEL" | npx --yes wrangler@4 secret put DOUBAO_MODEL -c wrangler.daily.toml; fi
          printf '%s' "$DEEPSEEK_API_KEY" | npx --yes wrangler@4 secret put DEEPSEEK_API_KEY -c wrangler.daily.toml
          if [ -n "$DEEPSEEK_MODEL" ]; then printf '%s' "$DEEPSEEK_MODEL" | npx --yes wrangler@4 secret put DEEPSEEK_MODEL -c wrangler.daily.toml; fi

      - name: Verify canonical service without generating content
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const base='https://ltzzz-daily-automation.ltzyz2181.workers.dev';let health;
          for(let attempt=0;attempt<12;attempt++){
            try{const r=await fetch(base+'/health',{signal:AbortSignal.timeout(10000)});health=await r.json();if(r.ok&&health.revision==='daily-resilience-v1')break;}catch{}
            if(attempt<11)await new Promise(resolve=>setTimeout(resolve,3000));
          }
          const get=await fetch(base+'/run?task=deepseek-daily',{signal:AbortSignal.timeout(10000)});
          const anonymous=await fetch(base+'/run?task=deepseek-daily',{method:'POST',signal:AbortSignal.timeout(10000)});
          const report={at:new Date().toISOString(),execution_id:process.env.GITHUB_RUN_ID,source_commit:process.env.GITHUB_SHA,canonical:base,revision:health?.revision||null,get_run_http:get.status,anonymous_post_http:anonymous.status,model_calls:0,generation_verified:false};
          report.ok=report.revision==='daily-resilience-v1'&&get.status===405&&anonymous.status===401;
          fs.mkdirSync('knowledge/results/daily-automation',{recursive:true});fs.writeFileSync('knowledge/results/daily-automation/deploy-'+process.env.GITHUB_RUN_ID+'.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report));if(!report.ok)process.exitCode=1;
          JS
      - name: Preserve deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-automation-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: knowledge/results/daily-automation/
          if-no-files-found: warn
      - name: Commit deployment receipt
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/daily-automation/
          git diff --staged --quiet && exit 0
          git commit -m "Daily automation canonical service acceptance; zero generation calls"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

  deploy-r2-workers:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create R2 bucket ltzzz-memory
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 bucket create ltzzz-memory
      - name: Deploy Memory Gateway (needs R2 bucket + token Workers R2 Write)
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.memory-gateway.toml
      - name: Deploy Memory Engine
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.memory-engine.toml
