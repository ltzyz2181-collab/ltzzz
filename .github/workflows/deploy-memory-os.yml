name: Deploy Memory OS (R2 + Daily cron + Engine)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-daily-cron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Daily Scheduler with cron triggers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.daily.toml
      - name: Configure daily worker secrets (model keys stay in CF Secrets, never in repo)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          DOUBAO_MODEL: ${{ secrets.DOUBAO_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: |
          printf '%s' "$ARK_API_KEY" | npx --yes wrangler@4 secret put ARK_API_KEY -c wrangler.daily.toml
          if [ -n "$DOUBAO_MODEL" ]; then printf '%s' "$DOUBAO_MODEL" | npx --yes wrangler@4 secret put DOUBAO_MODEL -c wrangler.daily.toml; fi
          printf '%s' "$DEEPSEEK_API_KEY" | npx --yes wrangler@4 secret put DEEPSEEK_API_KEY -c wrangler.daily.toml
          if [ -n "$DEEPSEEK_MODEL" ]; then printf '%s' "$DEEPSEEK_MODEL" | npx --yes wrangler@4 secret put DEEPSEEK_MODEL -c wrangler.daily.toml; fi

  deploy-r2-workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create R2 bucket ltzzz-memory
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 bucket create ltzzz-memory
      - name: Deploy Memory Gateway (needs R2 bucket + token Workers R2 Write)
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.memory-gateway.toml
      - name: Deploy Memory Engine
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.memory-engine.toml
