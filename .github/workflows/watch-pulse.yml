name: Pulse independent external watcher
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: pulse-external-watch, cancel-in-progress: false}
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check freshness, recover stopped alarm and synchronize verified scores (zero LLM)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PULSE_ROLE: qianwen
        run: node scripts/watch-pulse.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse-watch-${{ github.run_id }}-${{ github.run_attempt }}
          path: knowledge/results/pulse/
          retention-days: 30
      - name: Save independent evidence
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          node tools/persist-pulse-receipts.mjs
