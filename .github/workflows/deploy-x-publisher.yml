name: Deploy LTZZZ X Publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'x-publisher-worker.js'
      - 'wrangler.x-publisher.toml'
      - '.github/workflows/deploy-x-publisher.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.x-publisher.toml
