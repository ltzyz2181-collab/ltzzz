name: Deploy YouTube uploader retaining OAuth
on:
  workflow_dispatch:
  pull_request:
    paths: ['youtube-upload-worker.js', 'wrangler.youtube-upload.toml', 'scripts/tests/youtube-auth-status.test.mjs', 'scripts/tests/video-scheduler.test.mjs', '.github/workflows/deploy-youtube-uploader.yml']
  push:
    branches: [main]
    paths: ['youtube-upload-worker.js', 'wrangler.youtube-upload.toml', 'scripts/tests/youtube-auth-status.test.mjs', 'scripts/tests/video-scheduler.test.mjs', '.github/workflows/deploy-youtube-uploader.yml']
permissions: {contents: read}
concurrency: {group: youtube-uploader-deploy, cancel-in-progress: false}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check youtube-upload-worker.js
      - run: node --test scripts/tests/youtube-auth-status.test.mjs scripts/tests/video-scheduler.test.mjs scripts/tests/video-queue-client.test.mjs scripts/tests/video-queue-only.test.mjs
  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Deploy the reviewed uploader and preserve existing OAuth secrets and KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy -c wrangler.youtube-upload.toml
      - name: Verify deployed authentication and receipt contracts without uploading
        env:
          LTZZZ_AGENT_TOKEN: ${{ secrets.LTZZZ_AGENT_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const base='https://ltzzz-youtube-upload.ltzyz2181.workers.dev';
          let h;
          for(let n=0;n<24;n++){
            h=await fetch(base+'/health').then(r=>r.json());
            if(h.auth_readiness)break;
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          const denied=await fetch(base+'/youtube/publication?key=configuration-check');
          const authed=await fetch(base+'/youtube/publication?key=configuration-check',{headers:{Authorization:'Bearer '+process.env.LTZZZ_AGENT_TOKEN}});
          const publication=await authed.json();
          const s=await fetch(base+'/youtube/status').then(r=>r.json());
          const receipt={at:new Date().toISOString(),run_id:process.env.GITHUB_RUN_ID,source_commit:process.env.GITHUB_SHA,
            health:h,status:s,anonymous_receipt_http:denied.status,authenticated_receipt_http:authed.status,authentication_ready:s.connected===true,model_calls:0,uploads:0,published:false};
          fs.mkdirSync('results/publishing',{recursive:true});
          fs.writeFileSync('results/publishing/youtube-auth-readiness-'+process.env.GITHUB_RUN_ID+'.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt));
          if(denied.status!==401||!authed.ok||!publication.ok||!h.auth_readiness||typeof s.connected!=='boolean'||(s.credential_present&&typeof s.reauth_required!=='boolean'))process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-auth-readiness-${{ github.run_id }}
          path: results/publishing/youtube-auth-readiness-*.json
          retention-days: 14
      - name: Archive actual authentication readiness
        if: always()
        run: |
          file="results/publishing/youtube-auth-readiness-${{ github.run_id }}.json"
          test -f "$file" || exit 0
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add -- "$file"
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Record actual YouTube OAuth readiness without uploading'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
