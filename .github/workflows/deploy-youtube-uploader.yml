name: Deploy YouTube uploader retaining OAuth
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['youtube-upload-worker.js', 'wrangler.youtube-upload.toml', 'scripts/tests/video-scheduler.test.mjs', '.github/workflows/deploy-youtube-uploader.yml']
concurrency: {group: youtube-uploader-deploy, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/tests/video-scheduler.test.mjs
      - name: Deploy only YouTube preserving the existing OAuth KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LTZZZ_AGENT_TOKEN: ${{ secrets.LTZZZ_AGENT_TOKEN }}
        run: |
          test -n "$LTZZZ_AGENT_TOKEN"
          npx --yes wrangler@4 deploy -c wrangler.youtube-upload.toml
          printf '%s' "$LTZZZ_AGENT_TOKEN" | npx --yes wrangler@4 secret put LTZZZ_AGENT_TOKEN -c wrangler.youtube-upload.toml
      - name: Verify the receipt route without uploading
        run: |
          node --input-type=module <<'JS'
          const base='https://ltzzz-youtube-upload.ltzyz2181.workers.dev';
          const r=await fetch(base+'/health'),health=await r.json();
          const denied=await fetch(base+'/youtube/publication?key=configuration-check');
          console.log(JSON.stringify({health,anonymous_receipt_http:denied.status,uploads:0}));
          if(!r.ok||!health.publication_receipts||denied.status!==401)process.exitCode=1;
          JS
