name: Owner Aave funding 100 per tx 200 per day
on:
  push:
    branches: [main]
    paths: ['invest-channel/contracts/OwnerAaveFunding.sol', 'scripts/provision-funding-executor.mjs', 'scripts/funding-plan.mjs', 'scripts/tests/funding-plan.test.mjs', 'scripts/aave-owner-funding.mjs', '.github/workflows/aave-owner-funding.yml']
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: ltzzz-owner-aave-funding
  cancel-in-progress: false
jobs:
  funding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Test bounded first funding and refill amounts
        run: node --test scripts/tests/funding-plan.test.mjs
      - name: Funding readiness before installing dependencies
        id: readiness
        env:
          FUNDING_OWNER: ${{ vars.FUNDING_OWNER }}
          FUNDING_TREASURY: ${{ vars.FUNDING_TREASURY }}
          FUNDING_EXECUTOR_KEY: ${{ secrets.FUNDING_EXECUTOR_KEY }}
        run: |
          node - <<'JS'
          const fs=require('fs');const missing=['FUNDING_OWNER','FUNDING_TREASURY','FUNDING_EXECUTOR_KEY'].filter(k=>!process.env[k]);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'ready='+String(!missing.length)+'\n');
          if(missing.length){fs.mkdirSync('knowledge/results/funding',{recursive:true});fs.writeFileSync('knowledge/results/funding/'+process.env.GITHUB_RUN_ID+'.json',JSON.stringify({at:new Date().toISOString(),chainId:8453,status:'blocked_configuration',missing,compiled:false,deployed:false,tx_hash:null},null,2));console.log('Funding blocked: '+missing.join(', '));}
          JS
      - run: npm install --no-save ethers@6.17.0 solc@0.8.30 ganache@7.9.2
        if: steps.readiness.outputs.ready == 'true' || github.event_name == 'push'
      - name: Verify financial invariants
        if: steps.readiness.outputs.ready == 'true' || github.event_name == 'push'
        run: node invest-channel/tests/funding.test.cjs
      - name: Compile, deploy if configured, refill verified shortage
        if: steps.readiness.outputs.ready == 'true'
        env:
          FUNDING_OWNER: ${{ vars.FUNDING_OWNER }}
          FUNDING_TREASURY: ${{ vars.FUNDING_TREASURY }}
          FUNDING_ROUTER_ADDRESS: ${{ vars.FUNDING_ROUTER_ADDRESS }}
          FUNDING_EXECUTOR_KEY: ${{ secrets.FUNDING_EXECUTOR_KEY }}
          LTZZZ_BASE_RPC: ${{ vars.LTZZZ_BASE_RPC }}
        run: node scripts/aave-owner-funding.mjs
      - name: Persist actual receipt or blocking reason
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/funding/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "owner Aave funding status receipt (inspect JSON for execution)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
