name: Owner Aave funding legacy guard (offline only)
on:
  pull_request:
    paths: ['invest-channel/contracts/OwnerAaveFunding.sol', 'scripts/provision-funding-executor.mjs', 'scripts/funding-plan.mjs', 'scripts/tests/funding-plan.test.mjs', 'scripts/tests/legacy-aave-funding-retirement.test.mjs', 'scripts/aave-owner-funding.mjs', '.github/workflows/aave-owner-funding.yml']
  push:
    branches: [main]
    paths: ['invest-channel/contracts/OwnerAaveFunding.sol', 'scripts/provision-funding-executor.mjs', 'scripts/funding-plan.mjs', 'scripts/tests/funding-plan.test.mjs', 'scripts/tests/legacy-aave-funding-retirement.test.mjs', 'scripts/aave-owner-funding.mjs', '.github/workflows/aave-owner-funding.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ltzzz-owner-aave-funding-offline
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify retired entrypoint and no legacy financial workflow path
        run: node --check scripts/aave-owner-funding.mjs && node --test scripts/tests/legacy-aave-funding-retirement.test.mjs
      - name: Verify bounded funding plan (no network, no payment)
        run: node --test scripts/tests/funding-plan.test.mjs
      - name: Install local-chain test dependencies only
        run: npm install --no-save ethers@6.17.0 solc@0.8.30 ganache@7.9.2
      - name: Verify financial invariants on local simulated chain
        run: node invest-channel/tests/funding.test.cjs
