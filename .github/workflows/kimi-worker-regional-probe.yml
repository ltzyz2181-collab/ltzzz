name: Diagnose existing Worker Kimi key region without exporting key
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kimi-worker-regional-probe.yml']
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: ltzzz-kimi-worker-regional-probe
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save wrangler@4
      - name: Deploy protected diagnostic preserving existing KIMI_API_KEY Secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('fs'),{randomBytes}=require('crypto');const t=randomBytes(32).toString('hex');console.log('::add-mask::'+t);fs.appendFileSync(process.env.GITHUB_ENV,'KIMI_DIAGNOSTIC_TOKEN='+t+'\n');fs.writeFileSync('/tmp/kimi-diag.json',JSON.stringify({KIMI_DIAGNOSTIC_TOKEN:t}));
          JS
          npx wrangler deploy -c wrangler.kimi.toml
          npx wrangler secret bulk /tmp/kimi-diag.json -c wrangler.kimi.toml
          rm -f /tmp/kimi-diag.json
      - name: Diagnose using retained Worker Secret, never export it
        run: |
          node - <<'JS'
          const fs=require('fs');(async()=>{const base='https://api-kimi.ltzzz.com';const r=await fetch(base+'/diagnose-regions',{method:'POST',headers:{Authorization:'Bearer '+process.env.KIMI_DIAGNOSTIC_TOKEN},signal:AbortSignal.timeout(90000)});const body=await r.json();fs.mkdirSync('knowledge/results/kimi',{recursive:true});fs.writeFileSync('knowledge/results/kimi/worker-'+process.env.GITHUB_RUN_ID+'.json',JSON.stringify({http:r.status,...body},null,2));if(!r.ok)process.exitCode=1;})();
          JS
      - name: Persist result
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/kimi/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Kimi retained Worker key domestic international diagnosis'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
