name: Daily Pulse lineage regression
on:
  pull_request:
    paths:
      - 'scripts/lib/daily-task-board.mjs'
      - 'scripts/lib/daily-board-lineage.mjs'
      - 'scripts/lib/daily-independent-review.mjs'
      - 'scripts/lib/daily-assignment.mjs'
      - 'scripts/daily-task-board.mjs'
      - 'scripts/run-daily-tasks.mjs'
      - 'scripts/tests/daily-*.test.mjs'
      - 'workers/pulse-worker/tasks.js'
      - '.github/workflows/daily-pulse-lineage-check.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/lib/daily-task-board.mjs'
      - 'scripts/lib/daily-board-lineage.mjs'
      - 'scripts/lib/daily-independent-review.mjs'
      - 'scripts/lib/daily-assignment.mjs'
      - 'scripts/daily-task-board.mjs'
      - 'scripts/run-daily-tasks.mjs'
      - 'scripts/tests/daily-*.test.mjs'
      - 'workers/pulse-worker/tasks.js'
      - '.github/workflows/daily-pulse-lineage-check.yml'
permissions:
  contents: read
jobs:
  zero-model-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify daily chain without provider calls or production writes
        run: |
          node --check scripts/run-daily-tasks.mjs
          node --check scripts/daily-task-board.mjs
          node --test scripts/tests/daily-task-board.test.mjs scripts/tests/daily-independent-review.test.mjs scripts/tests/daily-board-lineage.test.mjs scripts/tests/daily-assignment.test.mjs scripts/tests/daily-assignment-handover.test.mjs scripts/tests/pulse-tasks.test.mjs scripts/tests/ans-task-review.test.mjs workers/pulse-worker/test.mjs
