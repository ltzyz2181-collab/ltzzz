name: Deploy professional LTZZZ channel bots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['telegram-bot-worker.js','ltzzz-wechat-publisher-worker.js','channels/bot-content.mjs','.github/workflows/deploy-channel-bots.yml']
permissions: {contents: write}
concurrency: {group: channel-bots-deploy, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/tests/bot-navigation.test.mjs
      - run: npm install --no-save wrangler@4
      - name: Deploy preserving platform keys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node - <<'JS'
          const fs=require('fs'),c=require('crypto');const a=c.randomBytes(32).toString('hex'),b=c.randomBytes(32).toString('hex');console.log('::add-mask::'+a);console.log('::add-mask::'+b);fs.appendFileSync(process.env.GITHUB_ENV,'BOT_ADMIN_TOKEN='+a+'\n');fs.writeFileSync('/tmp/tg-bot.json',JSON.stringify({BOT_ADMIN_TOKEN:a,TELEGRAM_SECRET:b}));fs.writeFileSync('/tmp/wx-bot.json',JSON.stringify({BOT_ADMIN_TOKEN:a}));
          JS
          npx wrangler deploy -c wrangler.telegram.toml
          npx wrangler secret bulk /tmp/tg-bot.json -c wrangler.telegram.toml
          npx wrangler deploy -c wrangler.wechat.toml
          npx wrangler secret bulk /tmp/wx-bot.json -c wrangler.wechat.toml
          rm /tmp/tg-bot.json /tmp/wx-bot.json
      - name: Verify live keys and register Telegram commands and webhook
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const tg='https://ltzzz-telegram-bot.ltzyz2181.workers.dev',wx='https://ltzzz-wechat-publisher.ltzyz2181.workers.dev';
          const read=async url=>{const r=await fetch(url,{signal:AbortSignal.timeout(20000)});return {http:r.status,body:await r.json()};};
          const health=await read(tg+'/health');const wechat=await read(wx+'/health');const preview=await read(tg+'/preview?command=start');
          const r=await fetch(tg+'/configure',{method:'POST',headers:{Authorization:'Bearer '+process.env.BOT_ADMIN_TOKEN},signal:AbortSignal.timeout(90000)});const setup={http:r.status,body:await r.json()};
          const result={at:new Date().toISOString(),source_commit:process.env.GITHUB_SHA,run_id:process.env.GITHUB_RUN_ID,telegram:health,telegram_setup:setup,wechat,welcome_verified:preview.body.text?.includes('AI发布任务'),wallet_connected:false,wechat_fan_callback_verified:false,model_calls:0};
          fs.mkdirSync('knowledge/results/bots',{recursive:true});fs.writeFileSync('knowledge/results/bots/'+process.env.GITHUB_RUN_ID+'.json',JSON.stringify(result,null,2));
          if(!health.body.has_token||!setup.body.ok||!result.welcome_verified)process.exitCode=1;
          JS
      - name: Save evidence
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/bots/ || true
          git diff --staged --quiet && exit 0
          git commit -m 'Channel bot deployment and retained key actual verification'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
