name: Autonomous coordinator daily receipt review
on:
  schedule:
    - cron: '20 8 * * *'
  push:
    branches: [main]
    paths: ['scripts/run-autonomous-control.mjs', 'scripts/lib/external-return-dispatch.mjs', 'tools/push-receipt-commit.mjs', '.github/workflows/autonomous-control.yml']
  workflow_run:
    workflows: ['Daily DeepSeek Doubao hire and investment data', 'DeFi pilot automated chain data']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: ltzzz-autonomous-control, cancel-in-progress: false}
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify daily policy and external return provenance
        run: node --test scripts/tests/external-return-dispatch.test.mjs scripts/tests/pulse-tasks.test.mjs scripts/tests/daily-assignment-handover.test.mjs scripts/tests/receipt-persistence.test.mjs
      - name: Read real receipts and dispatch next daily tasks
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY || secrets.ARK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DOUBAO_BASE_URL: ${{ vars.DOUBAO_BASE_URL || secrets.DOUBAO_BASE_URL }}
          DOUBAO_MODEL: ${{ vars.DOUBAO_MODEL }}
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: node scripts/run-autonomous-control.mjs
      - name: Preserve coordinator evidence even if commit fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coordinator-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            knowledge/results/control/
            knowledge/results/dispatch/qianwen-return-*.json
            ops/dispatch/DAILY-*-qianwen.md
          retention-days: 14
      - name: Persist coordinator decisions
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/control/ ltzzz-memory/tasks/control/
          if [ -d knowledge/results/dispatch ]; then git add knowledge/results/dispatch/; fi
          shopt -s nullglob
          deputy_files=(ops/dispatch/DAILY-*-qianwen.md)
          if [ "${#deputy_files[@]}" -gt 0 ]; then git add -- "${deputy_files[@]}"; fi
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'autonomous coordinator daily real receipt review and dispatch'
          node tools/push-receipt-commit.mjs
