name: Deep Superagent queue and GPT decision bridge
on:
  pull_request:
    paths:
      - 'scripts/run-deep-superagent-queue.mjs'
      - 'scripts/deep-autonomy.mjs'
      - 'scripts/tests/deep-superagent-autonomy.test.mjs'
      - 'scripts/dispatch-seat-policy.mjs'
      - 'scripts/dispatch-daily-card.mjs'
      - 'scripts/tests/deep-superagent-queue.test.mjs'
      - 'scripts/tests/dispatch-seat-policy.test.mjs'
      - 'scripts/tests/dispatch-daily-card.test.mjs'
      - 'scripts/dispatch-issue-card.mjs'
      - 'scripts/tests/dispatch-issue-card.test.mjs'
      - '.github/workflows/deep-issue-dispatch.yml'
      - 'config/dispatch-seat-policy-20261117.json'
      - '.github/workflows/deep-superagent-daily.yml'
      - '.github/workflows/deep-superagent-queue.yml'
      - '.github/workflows/deep-dispatch-daily.yml'
  # 只补「每日调度 / Issue 桥用 GITHUB_TOKEN 推卡、GitHub 抑制其 push 事件」这一条路径。
  # 脚本会校验 card_commit 在 main 上，且该提交只新增一张卡（DAILY 或 ISSUE 形态）。
  workflow_dispatch:
    inputs:
      card_commit:
        description: '每日卡提交 SHA（main 上、只新增一张 DAILY 卡）'
        required: true
  push:
    branches: [main]
    paths:
      - 'ops/deep-superagent/tasks/*.json'
      - 'ops/deep-superagent/decisions/*.json'
      - 'scripts/run-deep-superagent-queue.mjs'
      - 'scripts/deep-autonomy.mjs'
      - 'scripts/tests/deep-superagent-autonomy.test.mjs'
      - 'scripts/dispatch-seat-policy.mjs'
      - 'scripts/dispatch-daily-card.mjs'
      - 'scripts/tests/deep-superagent-queue.test.mjs'
      - 'scripts/tests/dispatch-seat-policy.test.mjs'
      - 'scripts/tests/dispatch-daily-card.test.mjs'
      - 'scripts/dispatch-issue-card.mjs'
      - 'scripts/tests/dispatch-issue-card.test.mjs'
      - '.github/workflows/deep-issue-dispatch.yml'
      - 'config/dispatch-seat-policy-20261117.json'
      - '.github/workflows/deep-superagent-daily.yml'
      - '.github/workflows/deep-superagent-queue.yml'
      - '.github/workflows/deep-dispatch-daily.yml'
permissions: {contents: read}
concurrency: {group: deep-superagent-queue, cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax check
        run: |
          node --check scripts/run-deep-superagent-queue.mjs
          node --check scripts/deep-autonomy.mjs
          node --check scripts/dispatch-seat-policy.mjs
          node --check scripts/dispatch-daily-card.mjs
      - name: Queue and policy tests
        run: >-
          node --test
          scripts/tests/deep-superagent-queue.test.mjs
          scripts/tests/deep-superagent-autonomy.test.mjs
          scripts/tests/dispatch-seat-policy.test.mjs
          scripts/tests/dispatch-daily-card.test.mjs
      - name: Dispatch seat policy gate (fail-closed before any POST)
        run: node scripts/dispatch-seat-policy.mjs check

  consume:
    needs: verify
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' && github.repository == 'ltzyz2181-collab/ltzzz'
    runs-on: ubuntu-latest
    # 2026-11-17/18 owner 放开「一次一张卡」后，一批最多 6 张卡要在同一次 run 内跑完。
    timeout-minutes: 25
    # owner 2026-11-19：Deep 可以改代码、开/合并 PR、触发部署工作流并发信。
    # 资金/签名/退款/凭据仍在 deep-autonomy.mjs 内 fail-closed，不等同于放开钱包。
    permissions: {contents: write, pull-requests: write, actions: write}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.event_name == ''workflow_dispatch'' && inputs.card_commit || github.sha }}'
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reserve durable attempt, enqueue or reconcile, and record bound AI decisions
        env:
          LTZZZ_AGENT_TOKEN: ${{ secrets.LTZZZ_AGENT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          AUTOLOOP_MAIL_TO: ${{ vars.AUTOLOOP_MAIL_TO }}
          AUTOLOOP_SEND_MAIL: ${{ vars.AUTOLOOP_SEND_MAIL }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST }}
          MAIL_SMTP_USER: ${{ secrets.MAIL_SMTP_USER }}
          MAIL_SMTP_AUTH_CODE: ${{ secrets.MAIL_SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_SMTP_USER }}
          GMAIL_IMAP_USER: ${{ secrets.GMAIL_IMAP_USER }}
          GMAIL_IMAP_APP_PASSWORD: ${{ secrets.GMAIL_IMAP_APP_PASSWORD }}
        run: node scripts/run-deep-superagent-queue.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-superagent-queue-${{ github.run_id }}-${{ github.run_attempt }}
          path: knowledge/results/deep-superagent/queue-${{ github.run_id }}-attempt-${{ github.run_attempt }}.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve exact public queue receipt without rerunning model requests
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const file='knowledge/results/deep-superagent/queue-'+process.env.GITHUB_RUN_ID+'-attempt-'+process.env.GITHUB_RUN_ATTEMPT+'.json';
          if(!fs.existsSync(file))process.exit(0);
          const receipt=JSON.parse(fs.readFileSync(file,'utf8'));
          if(!/^queue_(blocked|pending_reconciliation|results_verified)$|^no_new_queue_cards$/.test(receipt.status))throw Error('invalid_queue_receipt_status');
          execFileSync('git',['config','user.name','ltzzz-bot']);
          execFileSync('git',['config','user.email','bot@ltzzz.com']);
          execFileSync('git',['add','--',file]);
          // autonomy 回执（code_change/deploy/mail）也要公开留痕；目录不存在时跳过。
          if(fs.existsSync('knowledge/results/deep-superagent/autonomy'))execFileSync('git',['add','--','knowledge/results/deep-superagent/autonomy']);
          try{execFileSync('git',['diff','--staged','--quiet']);process.exit(0);}catch{}
          execFileSync('git',['commit','-m','Deep Superagent queue: '+receipt.status],{stdio:'inherit'});
          JS
          node tools/push-receipt-commit.mjs
