name: WEP3 atomic repair maintenance (no payments)
on:
  workflow_dispatch:
  pull_request:
    paths: ['wep3-worker.js', 'wep3-signer-proof.js', 'scripts/tests/wep3-signer-proof.test.mjs', 'wep3-ledger.js', 'wep3-swarm.js', 'wep3.html', 'scripts/tests/wep3-swarm-atomic.test.mjs', 'scripts/verify-wep3-maintenance.mjs', '.github/workflows/wep3-atomic-maintenance.yml']
  push:
    branches: [main]
    paths: ['wep3-worker.js', 'wep3-signer-proof.js', 'scripts/tests/wep3-signer-proof.test.mjs', 'wep3-ledger.js', 'wep3-swarm.js', 'wep3.html', 'scripts/tests/wep3-swarm-atomic.test.mjs', 'scripts/verify-wep3-maintenance.mjs', '.github/workflows/wep3-atomic-maintenance.yml']
permissions: {contents: read}
concurrency: {group: wep3-deploy-and-accept, cancel-in-progress: false}
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - run: node --check wep3-worker.js && node --check wep3-swarm.js && node --check scripts/verify-wep3-maintenance.mjs
      - run: node --test scripts/tests/wep3-signer-proof.test.mjs scripts/tests/wep3-swarm-atomic.test.mjs scripts/tests/wep3-swarm.test.mjs scripts/tests/wep3.test.mjs scripts/tests/wep3-receipt-render.test.mjs scripts/tests/audit-provenance.test.mjs scripts/tests/wep3-market.test.mjs scripts/tests/wep3-base-payment.test.mjs scripts/tests/wep3-autonomous.test.mjs scripts/tests/wep3-aave.test.mjs scripts/tests/wep3-external-orders.test.mjs scripts/tests/wep3-runtime-readiness.test.mjs scripts/tests/wep3-procurement.test.mjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-wep3-maintenance-browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: wep3-atomic-browser-${{ github.run_id }}
          path: knowledge/results/wep3/swarm-atomic-browser-${{ github.run_id }}.json
          retention-days: 30
  deploy:
    needs: validate
    if: github.repository == 'ltzyz2181-collab/ltzzz' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[wep3-maintenance]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - run: npm install --no-save wrangler@4
      - name: Reserve maintenance and snapshot existing financial book
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/verify-wep3-maintenance.mjs before
      - name: Deploy guarded repair without modifying secrets or enabling legacy writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Omit repository default vars so existing live caps/settings remain intact.
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const source=fs.readFileSync('wrangler.wep3.toml','utf8');
          const config=source.replace(/^\[vars\]\r?\n[\s\S]*?(?=^\[)/m,'');
          if(config===source||/^\[vars\]/m.test(config))throw Error('maintenance_config_vars_not_removed');
          fs.writeFileSync('.wrangler.wep3.maintenance.toml',config);
          JS
          npx wrangler deploy -c .wrangler.wep3.maintenance.toml --keep-vars --var WEP3_SOURCE_COMMIT:${GITHUB_SHA} --var LEGACY_KV_FROZEN:0
      - name: Verify deployed source, guarded routes and preserved financial book
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LAB_PIN: ${{ secrets.LAB_PIN }}
        run: node scripts/verify-wep3-maintenance.mjs after
      - name: Retain actual maintenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wep3-atomic-maintenance-${{ github.run_id }}
          path: knowledge/results/wep3/atomic-maintenance-${{ github.run_id }}.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Save metadata-only maintenance receipt
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/wep3/atomic-maintenance-${GITHUB_RUN_ID}.json
          git diff --staged --quiet && exit 0
          git commit -m 'Record guarded WEP3 maintenance deployment evidence'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
