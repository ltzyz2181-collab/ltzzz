name: Controller fixed workflow command
on:
  push:
    branches: [main]
    paths: ['ops/controller-command.json']
  issue_comment:
    types: [created]
  pull_request:
    paths: ['scripts/controller-workflow-command.mjs','scripts/lib/controller-workflow-command.mjs','scripts/tests/controller-workflow-command.test.mjs','.github/workflows/controller-workflow-command.yml']
permissions: {contents: read}
concurrency: {group: controller-workflow-command, cancel-in-progress: false}
jobs:
  verify:
    if: github.event_name != 'issue_comment' || (github.event.comment.user.id == 261544579 && startsWith(github.event.comment.body, 'LTZZZ_CONTROLLER_COMMAND'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/tests/controller-workflow-command.test.mjs
  dispatch:
    needs: verify
    if: github.repository == 'ltzyz2181-collab/ltzzz' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'issue_comment' && github.event.comment.user.id == 261544579 && startsWith(github.event.comment.body, 'LTZZZ_CONTROLLER_COMMAND'))) 
    permissions: {contents: write, actions: write}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Claim once and dispatch fixed trusted-main workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/controller-workflow-command.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controller-command-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/controller-command.json
          retention-days: 7
