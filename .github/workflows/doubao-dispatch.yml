name: Doubao dispatch consumer
on:
  pull_request:
    paths: ['scripts/run-doubao-dispatch.mjs','scripts/call-doubao.mjs','scripts/tests/doubao-dispatch.test.mjs','.github/workflows/doubao-dispatch.yml']
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ops/dispatch/queue-doubao/*.json']
permissions: {contents: write}
concurrency: {group: doubao-dispatch, cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check scripts/run-doubao-dispatch.mjs && node --test scripts/tests/doubao-dispatch.test.mjs scripts/tests/delivery-integrity.test.mjs
  consume:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/tests/doubao-dispatch.test.mjs
      - name: Process up to 3 pending Doubao cards (existing proxy only, no key fallback)
        env:
          DISPATCH_MAX_CARDS: ${{ vars.DISPATCH_MAX_CARDS || '3' }}
          DOUBAO_USE_PROXY: 'true'
          LTZZZ_AGENT_TOKEN: ${{ secrets.LTZZZ_AGENT_TOKEN }}
          DOUBAO_MODEL: ${{ vars.DOUBAO_MODEL }}
          DOUBAO_BASE_URL: ${{ vars.DOUBAO_BASE_URL || secrets.DOUBAO_BASE_URL }}
        run: node scripts/run-doubao-dispatch.mjs
      - name: Commit actual receipt
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/doubao-dispatch/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Doubao dispatch receipt (draft, not accepted)'
          node tools/push-receipt-commit.mjs