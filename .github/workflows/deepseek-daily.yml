name: DeepSeek daily (GH Actions)

on:
  # Additional paid cron retired. Existing Daily Agent Tasks consumes dispatches.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ltzzz-deepseek-daily
  cancel-in-progress: false

jobs:
  deepseek-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run DeepSeek daily entry
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: node scripts/run-deepseek-daily.mjs
      - name: Retain the receipt even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-daily-${{ github.run_id }}-${{ github.run_attempt }}
          path: knowledge/daily/deepseek/
      - name: Commit and push the daily entry
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/daily/deepseek/
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "content: DeepSeek daily entry $(date -u +%F)"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
