name: Deploy webhooks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hooks/**'
      - 'paypal-proxy-worker.mjs'
      - 'telegram-bot-worker.js'
      - 'wrangler.webhook.toml'
      - 'wrangler.paypal.toml'
      - 'wrangler.telegram.toml'
      - '.github/workflows/deploy-webhooks.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.webhook.toml
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.paypal.toml
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.telegram.toml
