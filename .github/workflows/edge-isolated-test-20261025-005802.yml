name: Edge isolated test 20261025-005802
on:
  push:
    branches: [test/edge-write-deploy-20261025-005802]
    paths: ['.github/workflows/edge-isolated-test-20261025-005802.yml']
permissions:
  contents: read
jobs:
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy isolated test Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          date -u +%FT%TZ
          echo "SOURCE_COMMIT=$GITHUB_SHA"
          npx --yes wrangler@4 deploy -c tests/edge-deploy-20261025-005802/wrangler.toml --var SOURCE_COMMIT:$GITHUB_SHA
          date -u +%FT%TZ
      - name: Verify live page exact version
        run: |
          curl --fail --retry 5 --retry-delay 3 --max-time 30 -sS https://ltzzz-edge-test-20261025-005802.ltzyz2181.workers.dev > /tmp/edge-test.html
          grep -F 'EDGE-WRITE-DEPLOY-20261025-005802-V1' /tmp/edge-test.html
          grep -F "$GITHUB_SHA" /tmp/edge-test.html
          date -u +%FT%TZ
