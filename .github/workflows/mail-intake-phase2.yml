name: Mail intake phase 2
# 两个独立 job：
# - contract：仅仓库内契约测试，不连邮箱、不读 secrets、不写仓库；PR 与手动默认跑这个。
# - intake：每日只读采集，覆盖 Gmail 全箱（GMAIL_IMAP_USER / GMAIL_IMAP_APP_PASSWORD）
#   与 QQ 共享项目信箱 306122054@qq.com（QQ_IMAP_USER / QQ_IMAP_PASSWORD），
#   把脱敏后的 latest.json 等结果提交回 main。Gmail 缺 secrets 时 fail-closed；
#   QQ 缺 secrets 只记 not_configured 并 warn，不阻断其他通道。
# 依据：GPT-LTZZZ-AUTONOMY-RULING-20261117-01 §二、§六（部署席负责定时触发/并发锁/失败告警）。
# 最小证据集与回退方案：docs/2026-11-18-gmail-intake-定时启用-最小证据与回退.md
on:
  pull_request:
    paths:
      - 'scripts/mail/**'
      - 'scripts/run-mail-intake.mjs'
      - 'scripts/track-gpt-rulings.mjs'
      - 'scripts/check-gpt-ruling-mail.mjs'
      - 'scripts/check-gmail-credentials.mjs'
      - 'scripts/record-task-state-correction.mjs'
      - 'scripts/collect-gmail-imap.py'
      - 'scripts/tests/mail-*.test.mjs'
      - 'scripts/tests/gmail-*.test.mjs'
      - 'scripts/tests/ruling-tracker.test.mjs'
      - 'scripts/tests/task-state-correction.test.mjs'
      - 'scripts/tests/test_gmail_imap_body.py'
      - 'scripts/tests/mail-workflow-policy.test.mjs'
      - 'ops/deep-superagent/corrections/**'
      - 'knowledge/results/deep-superagent/daily-2026-11-17.json'
      - '.github/workflows/mail-intake-phase2.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'contract = 契约测试；read-only-intake = 立刻跑一次只读采集'
        type: choice
        options: [contract, read-only-intake]
        default: contract
  schedule:
    # 每天 00:23 UTC（北京时间 08:23）跑一次只读采集。
    - cron: '23 0 * * *'

permissions: {contents: read}
concurrency: {group: 'mail-intake-phase2-${{ github.ref }}', cancel-in-progress: true}

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'read-only-intake') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Unit tests (dedupe / intake / tracker / corrections / credentials)
        run: |
          node --test \
            scripts/tests/mail-dedupe.test.mjs \
            scripts/tests/mail-intake-pipeline.test.mjs \
            scripts/tests/mail-intake.test.mjs \
            scripts/tests/ruling-tracker.test.mjs \
            scripts/tests/gpt-ruling-mail.test.mjs \
            scripts/tests/task-state-correction.test.mjs \
            scripts/tests/gmail-redact.test.mjs \
            scripts/tests/gmail-body-peek.test.mjs \
            scripts/tests/gmail-credentials.test.mjs \
            scripts/tests/mail-workflow-policy.test.mjs

      - name: Python BODY.PEEK tests
        run: python3 scripts/tests/test_gmail_imap_body.py

      - name: Correction ledger hash chain and source records
        run: node scripts/record-task-state-correction.mjs --verify

      - name: Credential check fails closed when nothing is configured
        run: |
          set +e
          node scripts/check-gmail-credentials.mjs --credentials-file "$RUNNER_TEMP/absent.env" --json
          code=$?
          set -e
          test "$code" = 2 || { echo "expected exit 2 (blocked), got $code"; exit 1; }

  intake:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'read-only-intake') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: write}
    concurrency: {group: 'mail-intake-daily', cancel-in-progress: false}
    env:
      GMAIL_IMAP_USER: ${{ secrets.GMAIL_IMAP_USER }}
      GMAIL_IMAP_APP_PASSWORD: ${{ secrets.GMAIL_IMAP_APP_PASSWORD }}
      QQ_IMAP_USER: ${{ secrets.QQ_IMAP_USER }}
      QQ_IMAP_PASSWORD: ${{ secrets.QQ_IMAP_PASSWORD }}
      LTZZZ_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: 'main', fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Fail closed when the Gmail secrets are absent
        run: |
          if [ -z "${GMAIL_IMAP_USER:-}" ] || [ -z "${GMAIL_IMAP_APP_PASSWORD:-}" ]; then
            echo "::error::GMAIL_IMAP_USER / GMAIL_IMAP_APP_PASSWORD secrets are absent; no mailbox read attempted."
            exit 1
          fi
          node scripts/check-gmail-credentials.mjs --json

      - name: QQ channel is optional (warn when secrets are absent)
        run: |
          if [ -z "${QQ_IMAP_USER:-}" ] || [ -z "${QQ_IMAP_PASSWORD:-}" ]; then
            echo "::warning::QQ_IMAP_USER / QQ_IMAP_PASSWORD absent; QQ recorded as not_configured, other channels continue."
          else
            echo "QQ IMAP configured (read-only)."
          fi

      - name: Read-only intake (Gmail + QQ IMAP + existing channels)
        run: |
          set +e
          node scripts/run-mail-intake.mjs
          code=$?
          set -e
          echo "INTAKE_EXIT=$code" >> "$GITHUB_ENV"
          # 退出码 0=ok，2=partial，3=failed，4=并发被拒；先不在这里中断，留证据再判。
          exit 0

      - name: Redacted summary (status and counts only)
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file = 'knowledge/results/deep-superagent/mail-intake/latest.json';
          const out = process.env.GITHUB_STEP_SUMMARY;
          const rows = [];
          try {
            const p = JSON.parse(fs.readFileSync(file, 'utf8'));
            rows.push(`status=${p.status}`);
            rows.push(`gmail=${p.gmail_fullbox?.status ?? 'unknown'}`);
            rows.push(`qq=${p.qq_fullbox?.status ?? 'unknown'} qq_count=${p.qq_fullbox?.count ?? 0} qq_skipped=${p.qq_fullbox?.skipped ?? 'n/a'}`);
            rows.push(`agent_mail=${p.agent_mail?.status ?? 'unknown'}${p.agent_mail?.deferred_to ? ` (deferred_to=${p.agent_mail.deferred_to})` : ''}`);
            rows.push(`ruling_tracker=${p.ruling_tracker?.status ?? 'unknown'}${p.ruling_tracker?.deferred_to ? ` (deferred_to=${p.ruling_tracker.deferred_to})` : ''}`);
            rows.push(`coverage=${p.coverage ? JSON.stringify(p.coverage) : 'n/a'}`);
            rows.push(`counts=${JSON.stringify(p.counts ?? {})}`);
            rows.push(`window=${p.gmail_fullbox?.window_since ?? 'n/a'} truncated=${p.gmail_fullbox?.window_truncated ?? 'n/a'}`);
            rows.push(`read_only=${p.read_only ?? 'n/a'} bodies_persisted=${p.bodies_persisted ?? 'n/a'}`);
          } catch (error) {
            rows.push(`latest.json unreadable: ${error.message}`);
          }
          const text = '### Mail intake (redacted)\n\n```\n' + rows.join('\n') + '\n```\n';
          console.log(text);
          if (out) fs.appendFileSync(out, text);
          JS

      - name: Commit redacted result (ok/partial/ok_deferred_channels only)
        if: always()
        run: |
          status=$(node -p "JSON.parse(require('fs').readFileSync('knowledge/results/deep-superagent/mail-intake/latest.json','utf8')).status" 2>/dev/null || echo missing)
          case "$status" in
            ok|partial|ok_deferred_channels) ;;
            *) echo "status=$status; result not committed"; exit 0 ;;
          esac
          git config user.name 'ltzzz-mail-bot'
          git config user.email 'bot@ltzzz.com'
          # 只 add 真实存在的文件：last-ok.json 首次运行不存在，单条 git add 会因
          # 一个缺失 pathspec 整体失败（2026-11-24 实测 no result change）。
          for file in \
            knowledge/results/deep-superagent/mail-intake/latest.json \
            knowledge/results/deep-superagent/mail-intake/runs.jsonl \
            knowledge/results/deep-superagent/mail-fullbox/latest.json \
            knowledge/results/deep-superagent/mail-fullbox/last-ok.json \
            knowledge/results/deep-superagent/mail-fullbox-qq/latest.json \
            knowledge/results/deep-superagent/mail-fullbox-qq/last-ok.json \
            knowledge/results/deep-superagent/mail-backlog/latest.json \
            knowledge/results/deep-superagent/ruling-tracker/latest.json; do
            if [ -e "$file" ]; then git add "$file"; fi
          done
          if git diff --cached --quiet; then
            echo 'no result change'
            exit 0
          fi
          git commit -m "chore(mail): daily read-only intake $(date -u +%F) [skip ci]"
          node tools/push-receipt-commit.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mail-intake-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            knowledge/results/deep-superagent/mail-intake/
            knowledge/results/deep-superagent/mail-fullbox/
            knowledge/results/deep-superagent/mail-fullbox-qq/
            knowledge/results/deep-superagent/mail-backlog/latest.json
            knowledge/results/deep-superagent/ruling-tracker/latest.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Warn when a channel failed (partial)
        if: env.INTAKE_EXIT == '2'
        run: |
          echo "::warning::Mail intake partial: at least one channel failed; Gmail and QQ statuses are recorded in latest.json."

      - name: Alarm when the run failed
        if: env.INTAKE_EXIT != '0' && env.INTAKE_EXIT != '2'
        run: |
          echo "::error::Mail intake exited ${INTAKE_EXIT}; see latest.json and the artifact."
          exit 1
