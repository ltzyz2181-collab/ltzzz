name: Deploy LTZZZ Treasury

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'treasury-queue-worker.js'
      - 'treasury-engine-worker.js'
      - 'wrangler.treasury.toml'
      - 'wrangler.treasury-engine.toml'
      - '.github/workflows/deploy-treasury.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy queue
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.treasury.toml
        continue-on-error: true
      - name: Deploy engine v1
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.treasury-engine.toml
