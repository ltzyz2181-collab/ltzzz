name: Workpool deterministic checks and claims
on:
  pull_request:
    paths: ['CORE-VIEW.md','config/workpool.json','config/autonomy-authority.json','scripts/*workpool*','scripts/lib/workpool-*','scripts/tests/workpool*','.github/workflows/workpool.yml','.github/ISSUE_TEMPLATE/work-pool.yml','protocol/workpool*']
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  issues:
    types: [opened, labeled, edited, reopened]
permissions: {contents: read}
jobs:
  test:
    if: github.event_name == 'pull_request'
    timeout-minutes: 8
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/tests/workpool*.test.mjs
  preflight:
    if: github.event_name == 'pull_request_target' && contains(github.event.pull_request.body, '<!-- LTZZZ_WORKPOOL_PREFLIGHT -->')
    timeout-minutes: 8
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/check-workpool-preflight.mjs
  claim:
    if: github.event_name == 'issues' && github.actor == 'ltzyz2181-collab' && contains(github.event.issue.labels.*.name, 'work:open')
    timeout-minutes: 8
    runs-on: ubuntu-latest
    permissions: {contents: write, issues: read}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Claim and submit repository hashes to an isolated lease branch
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: node scripts/run-workpool.mjs claim-event
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workpool-${{ github.run_id }}-${{ github.run_attempt }}
          path: knowledge/results/workpool/latest.json
          if-no-files-found: ignore
