name: Update AI Capabilities

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai/verified-log.json'
      - 'tools/update-capabilities.mjs'
    branches: [main]

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/update-capabilities.mjs
      - name: Commit map
        run: |
          git config user.name "ltzzz-capabilities"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/ai-capabilities.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(ai): refresh verified capability map"
          git pull --rebase origin main || true
          git push origin HEAD:main
