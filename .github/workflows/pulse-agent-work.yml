name: Pulse AI self-service task discovery
on:
  workflow_dispatch:
    inputs:
      agent:
        type: choice
        options: [deepseek, doubao, qianwen, kimi, grok, gpt]
        default: deepseek
      action:
        type: choice
        options: [discover, claim, submit, review]
        default: discover
      task_id:
        default: ''
        description: 'Blank claim selects an available task; submit/review require the exact task ID'
      evidence_path:
        default: ''
        description: 'Existing artifact path in knowledge/, results/ or ops/; no credentials'
      worker_provider:
        default: 'deepseek'
        description: 'review only: the seat that produced the reviewed artifact'
      reviewer_provider:
        default: 'gpt'
        description: 'review only: the seat whose metadata review is being recorded'
permissions: {contents: write}
concurrency: {group: pulse-agent-work, cancel-in-progress: false}
jobs:
  task:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Discover, claim, submit or record a bound review (no model purchase)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AGENT_NAME: ${{ inputs.agent }}
          AGENT_ACTION: ${{ inputs.action }}
          AGENT_TASK_ID: ${{ inputs.task_id }}
          AGENT_EVIDENCE_PATH: ${{ inputs.evidence_path }}
          AGENT_WORKER: ${{ inputs.worker_provider }}
          AGENT_REVIEWER: ${{ inputs.reviewer_provider }}
        run: node scripts/pulse-agent.mjs
      - name: Save actual operation result
        if: always()
        run: |
          git config user.name pulse-executor
          git config user.email bot@ltzzz.com
          git pull --rebase --autostash origin main || true
          git add knowledge/results/pulse || true
          git commit -m "pulse: ${{ inputs.action }} result for ${{ inputs.agent }}" || true
          git push origin main || true
