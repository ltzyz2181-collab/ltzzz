name: Deploy and control LTZZZ Pulse
on:
  push:
    branches: [main]
    paths: ['workers/pulse-worker/**','scripts/deploy-pulse.mjs','scripts/pulse-credentials.mjs','.github/workflows/deploy-pulse.yml']
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [deploy, control]
        default: deploy
      role:
        type: choice
        options: [qianwen, gpt]
        default: qianwen
      command_json:
        description: 'Structured control JSON, e.g. {"action":"probe","reason":"deputy check"}; no secrets'
        default: '{"action":"probe"}'
permissions: {contents: write}
concurrency: {group: pulse-deploy-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test workers/pulse-worker/test.mjs scripts/tests/agi-econ-action.test.mjs scripts/tests/pulse-integration.test.mjs
      - name: Deploy and bootstrap autonomous monitor, no model generation
        if: github.event_name == 'push' || inputs.action == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-pulse.mjs
      - name: Independent observation and verified incentive synchronization
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PULSE_ACTION: ${{ inputs.action }}
          PULSE_ROLE: ${{ inputs.role || 'qianwen' }}
          PULSE_CONTROL_JSON: ${{ inputs.command_json }}
        run: node scripts/watch-pulse.mjs
      - name: Preserve actual deployment, observations and blockers
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/pulse/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Pulse actual autonomous monitor deployment and control receipt'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
