name: Deploy and control LTZZZ Pulse
on:
  push:
    branches: [main]
    paths: ['workers/pulse-worker/**','scripts/deploy-pulse.mjs','scripts/pulse-credentials.mjs','tools/persist-pulse-receipts.mjs','.github/workflows/deploy-pulse.yml']
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [deploy, control]
        default: deploy
      role:
        type: choice
        options: [qianwen, gpt]
        default: qianwen
      command_json:
        description: 'Structured control JSON, e.g. {"action":"probe","reason":"deputy check"}; no secrets'
        default: '{"action":"probe"}'
permissions: {contents: write}
concurrency: {group: pulse-deploy-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/tests/pulse-receipt-persistence.test.mjs scripts/tests/receipt-persistence.test.mjs scripts/tests/pulse-feedback.test.mjs workers/pulse-worker/test.mjs scripts/tests/agi-econ-action.test.mjs scripts/tests/pulse-integration.test.mjs scripts/tests/pulse-tasks.test.mjs scripts/tests/daily-assignment.test.mjs scripts/tests/ans-task-review.test.mjs
      - name: Deploy and bootstrap autonomous monitor, no model generation
        if: github.event_name == 'push' || inputs.action == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for deploy_pass in 1 2; do
            if PULSE_DEPLOY_PASS="$deploy_pass" node scripts/deploy-pulse.mjs; then exit 0; fi
            if [ "$deploy_pass" = "1" ]; then
              echo 'Waiting for propagation before one bounded infrastructure retry; no models or payments'
              node -e 'setTimeout(() => {}, 30000)'
            fi
          done
          exit 1
      - name: Independent observation and verified incentive synchronization
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PULSE_ACTION: ${{ inputs.action }}
          PULSE_ROLE: ${{ inputs.role || 'qianwen' }}
          PULSE_CONTROL_JSON: ${{ inputs.command_json }}
        run: node scripts/watch-pulse.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: knowledge/results/pulse/
          retention-days: 30
      - name: Preserve actual deployment, observations and blockers
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          node tools/persist-pulse-receipts.mjs
