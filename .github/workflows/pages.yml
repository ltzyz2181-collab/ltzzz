name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Kimi Global Weekly AI Hire & Investment", "Kimi Global Weekly no API key task packet", "Execute LTZZZ AI task queue", "Control handover Meta Kimi and DeFi verification", "LTZZZ Wallet Operations", "IG Daily Card (render + commit)", "Daily Agent Tasks", "Daily DeepSeek Doubao hire and investment data", "Weekly innovation rotating AI seats", "Autonomous coordinator daily receipt review", "DeFi pilot automated chain data", "Verify AI seat endpoints and cards (zero model calls)"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  # 读本 run 的 artifact 列表，供 artifact 唯一性守卫使用（只读）。
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Treasury display escaping and progress boundaries
        run: node --test scripts/tests/treasury-dashboard-render.test.mjs
      - name: Build daily-data
        run: |
          node scripts/build-daily-data.js
          node scripts/build-site-status.mjs
          node scripts/build-seat-registry.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 契约：一个 run 内 github-pages 只能有一份。
      # 失败 run 42765758716 的成因是 job 被重跑（attempt 2）后 attempt 1 的
      # artifact 未被清理，run 内累计两份，deploy-pages 报 count is 2。
      # 这里在上传前判定：没有则上传，已有一份则复用（同 commit 同一份构建），
      # 多于一份立即失败并诊断 —— 不靠删除 artifact 让报错消失。
      - name: Guard pages artifact uniqueness before upload
        id: artifact_guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-pages-artifact-contract.mjs --mode=pre-upload

      - name: Upload artifact
        if: steps.artifact_guard.outputs.action == 'upload'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Assert exactly one pages artifact before deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-pages-artifact-contract.mjs --mode=pre-deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
