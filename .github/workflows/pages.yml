name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Kimi Global Weekly AI Hire & Investment", "Kimi Global Weekly no API key task packet", "Execute LTZZZ AI task queue", "Control handover Meta Kimi and DeFi verification", "LTZZZ Wallet Operations", "IG Daily Card (render + commit)", "Daily Agent Tasks", "Daily DeepSeek Doubao hire and investment data", "Weekly innovation rotating AI seats", "Autonomous coordinator daily receipt review", "DeFi pilot automated chain data"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build daily-data
        run: |
          node scripts/build-daily-data.js
          node scripts/build-site-status.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
