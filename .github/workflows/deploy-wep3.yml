name: Deploy LTZZZ WEP3
on:
  schedule:
    - cron: '35 22 * * *'
  workflow_dispatch:
    inputs:
      deployment_closeout:
        description: 'Run one 0.01 internal-credit deposit and independently audited hire (no cash or chain transfer)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['wep3-worker.js', 'wep3-audit-proof.js', 'scripts/lib/provided-contract.mjs', 'scripts/tests/audit-provenance.test.mjs', 'wep3-market.js', 'wep3-base-payment.js', 'wep3-x402.js', 'wep3-external-entry.js', 'wep3-order-contract.js', 'scripts/lib/market-fulfillment.mjs', 'scripts/tests/wep3-external-orders.test.mjs', 'scripts/accept-external-orders.mjs', 'wep3-economy.js', 'wep3-forecast.js', 'wep3-agents.js', 'wep3-anchor.js', 'wep3-aave.js', 'scripts/run-treasury-aave.mjs', 'scripts/tests/wep3-aave.test.mjs', 'package.json', 'package-lock.json', 'scripts/tests/wep3-autonomous.test.mjs', 'scripts/tests/wep3-market.test.mjs', 'scripts/fulfill-market-orders.mjs', 'wrangler.wep3.toml', '.github/workflows/deploy-wep3.yml', 'scripts/accept-real-hire.mjs', 'scripts/provision-wep3-treasury.mjs']
permissions: {contents: write}
concurrency: {group: wep3-deploy-and-accept, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - run: node --check wep3-worker.js && node --test scripts/tests/wep3-market.test.mjs scripts/tests/wep3-base-payment.test.mjs scripts/tests/wep3-autonomous.test.mjs scripts/tests/wep3-aave.test.mjs scripts/tests/wep3-external-orders.test.mjs scripts/tests/domestic-model-router.test.mjs scripts/tests/audit-provenance.test.mjs
      - run: npm install --no-save wrangler@4
      - name: Deploy and retain service authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LAB_PIN: ${{ secrets.LAB_PIN }}
          X402_RECEIVE_ADDRESS: ${{ secrets.X402_RECEIVE_ADDRESS }}
          X402_LIVE: ${{ secrets.X402_LIVE }}
        run: |
          npx wrangler deploy -c wrangler.wep3.toml
          node - <<'JS'
          const fs=require('fs'),c=require('crypto');const token=c.createHmac('sha256',process.env.CLOUDFLARE_API_TOKEN).update('ltzzz-runner-v2').digest('hex');console.log('::add-mask::'+token);fs.appendFileSync(process.env.GITHUB_ENV,'WEP3_RUNNER_TOKEN='+token+'\n');fs.writeFileSync('/tmp/hire-token.json',JSON.stringify({WEP3_RUNNER_TOKEN:token}));
          JS
          npx wrangler secret bulk /tmp/hire-token.json -c wrangler.wep3.toml
          rm /tmp/hire-token.json
          if [ -n "$LAB_PIN" ]; then
            printf '%s' "$LAB_PIN" | npx wrangler secret put LAB_PIN -c wrangler.wep3.toml
          fi
          # Base USDC / x402 live rail (optional until secrets exist)
          if [ -n "$X402_RECEIVE_ADDRESS" ]; then
            printf '%s' "$X402_RECEIVE_ADDRESS" | npx wrangler secret put X402_RECEIVE_ADDRESS -c wrangler.wep3.toml
            echo 'X402_RECEIVE_ADDRESS configured'
          else
            echo 'X402_RECEIVE_ADDRESS not set — challenge uses simulated treasury address'
          fi
          if [ -n "$X402_LIVE" ]; then
            printf '%s' "$X402_LIVE" | npx wrangler secret put X402_LIVE -c wrangler.wep3.toml
            echo 'X402_LIVE configured'
          else
            echo 'X402_LIVE not set — 0x proofs stay simulated until enabled'
          fi
      - name: Provision once and verify controlled treasury (no funds moved)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision-wep3-treasury.mjs
      - name: Verify public health, x402, and anonymous write rejection
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const base='https://ltzzz-wep3.ltzyz2181.workers.dev';
          let authReady;for(let attempt=0;attempt<12;attempt++){authReady=await fetch(base+'/market/runner/readiness',{headers:{'X-Lab-Pin':process.env.WEP3_RUNNER_TOKEN}}).then(r=>r.json());if(authReady.authenticated)break;await new Promise(resolve=>setTimeout(resolve,3000));}
          const h=await fetch(base+'/health');const health=await h.json();
          const w=await fetch(base+'/hire',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
          const machine=await fetch(base+'/market/skill/audit',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':'acceptance-'+process.env.GITHUB_RUN_ID,'X-Order-Token':crypto.randomUUID().replaceAll('-','')+crypto.randomUUID().replaceAll('-','')},body:JSON.stringify({brief:'Deployment capability check, no payment signature supplied'})});const machineData=await machine.json();
          const catalogResponse=await fetch(base+'/market/catalog');const catalog=await catalogResponse.json();
          const blocked=await fetch(base+'/market/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
          const chRes=await fetch(base+'/market/x402/challenge',{method:'POST',headers:{'Content-Type':'application/json','X-Lab-Pin':process.env.WEP3_RUNNER_TOKEN},body:JSON.stringify({skill:'audit',brief:'deploy verify brief for x402 challenge path'})});
          const ch=await chRes.json();
          let verify={ok:false};let verifyHttp=0;
          if(ch.challenge_id){
            const vRes=await fetch(base+'/market/x402/verify',{method:'POST',headers:{'Content-Type':'application/json','X-Lab-Pin':process.env.WEP3_RUNNER_TOKEN},body:JSON.stringify({challenge_id:ch.challenge_id,proof:'sim_deploy_'+Date.now()})});
            verifyHttp=vRes.status;verify=await vRes.json();
          }
          const report={runner_auth:authReady,standard_x402_http:machine.status,standard_x402_payment_required:!!machine.headers.get('PAYMENT-REQUIRED'),standard_x402_blocker:machineData.error||null,market_http:catalogResponse.status,market:catalog,anonymous_market_complete_http:blocked.status,at:new Date().toISOString(),execution_id:process.env.GITHUB_RUN_ID,source_commit:process.env.GITHUB_SHA,health_http:h.status,pin_configured:health.pin,anonymous_write_http:w.status,x402_challenge_http:chRes.status,x402_challenge_ok:!!ch.challenge_id,x402_verify_http:verifyHttp,x402_verify_error:verify.error||null,x402_verify_ok:!!verify.ok,x402_verified_payment_live:!!verify.live,x402_simulation_only:!!verify.simulated,x402_order_id:verify.order_id||null,real_hire_verified:false,tx_hash:null};
          fs.mkdirSync('knowledge/results/wep3',{recursive:true});fs.writeFileSync('knowledge/results/wep3/'+process.env.GITHUB_RUN_ID+'.json',JSON.stringify(report,null,2));
          if(!h.ok||!health.pin||w.status!==401||!catalogResponse.ok||!catalog.ok||blocked.status!==401||!ch.challenge_id||!verify.ok)process.exitCode=1;
          JS
      - name: Verify external buyer portal, schema and legacy payment isolation
        run: node scripts/accept-external-orders.mjs
      - name: Prepare requested deployment credit and delivery
        if: github.event_name == 'workflow_dispatch' && inputs.deployment_closeout
        env:
          LAB_PIN: ${{ secrets.LAB_PIN }}
        run: node scripts/prepare-deploy-closeout.mjs
      - name: Audit actual provider delivery with domestic or XAI independent provider
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-hire-closeout]')
        env:
          MOONSHOT_API_KEY_CN: ${{ secrets.MOONSHOT_API_KEY_CN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY || secrets.ARK_API_KEY }}
          DOUBAO_MODEL: ${{ vars.DOUBAO_MODEL }}
          DOUBAO_BASE_URL: ${{ vars.DOUBAO_BASE_URL || secrets.DOUBAO_BASE_URL }}
        run: node scripts/accept-real-hire.mjs
      - name: Verify requested deployment ledger and reputation closeout
        if: github.event_name == 'workflow_dispatch' && inputs.deployment_closeout
        run: node scripts/finalize-deploy-closeout.mjs
      - name: Verify Aave balances without signing
        env:
          AAVE_ACTION: status
        run: node scripts/run-treasury-aave.mjs
      - name: Diagnose stored Aave intent and retry automatic planning without signing
        run: |
          AAVE_ACTION=diagnose node scripts/run-treasury-aave.mjs
          AAVE_ACTION=auto-preview node scripts/run-treasury-aave.mjs
      - name: Capital AI actual execution review
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-hire-closeout]')
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: node scripts/review-aave-investment.mjs
      - name: Fulfill at most one paid customer order
        if: github.event_name != 'workflow_dispatch' || !inputs.deployment_closeout
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY || secrets.ARK_API_KEY }}
          DOUBAO_MODEL: ${{ vars.DOUBAO_MODEL }}
          DOUBAO_BASE_URL: ${{ vars.DOUBAO_BASE_URL || secrets.DOUBAO_BASE_URL }}
        run: node scripts/fulfill-market-orders.mjs
      - name: Alert failed deployment
        if: failure()
        run: echo '::error::WEP3 deployment or acceptance failed. Inspect the receipt before claiming completion.'
      - name: Save acceptance evidence
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/wep3/ data/model-routing/ || true
          git diff --staged --quiet && exit 0
          git commit -m 'WEP3 actual deployment acceptance'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
