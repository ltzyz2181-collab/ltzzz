name: Deploy LTZZZ WEP3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wep3-worker.js'
      - 'wrangler.wep3.toml'
      - '.github/workflows/deploy-wep3.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.wep3.toml
