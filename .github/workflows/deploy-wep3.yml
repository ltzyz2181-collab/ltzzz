name: Deploy LTZZZ WEP3
on:
  schedule:
    - cron: '35 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['wep3-worker.js', 'wep3-market.js', 'scripts/tests/wep3-market.test.mjs', 'scripts/fulfill-market-orders.mjs', 'wrangler.wep3.toml', '.github/workflows/deploy-wep3.yml', 'scripts/accept-real-hire.mjs']
permissions: {contents: write}
concurrency: {group: wep3-deploy-and-accept, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check wep3-worker.js && node --test scripts/tests/wep3-market.test.mjs
      - run: npm install --no-save wrangler@4
      - name: Deploy and retain service authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LAB_PIN: ${{ secrets.LAB_PIN }}
          X402_RECEIVE_ADDRESS: ${{ secrets.X402_RECEIVE_ADDRESS }}
          X402_LIVE: ${{ secrets.X402_LIVE }}
        run: |
          npx wrangler deploy -c wrangler.wep3.toml
          node - <<'JS'
          const fs=require('fs'),c=require('crypto');const token=c.randomBytes(32).toString('hex');console.log('::add-mask::'+token);fs.appendFileSync(process.env.GITHUB_ENV,'WEP3_RUNNER_TOKEN='+token+'\n');fs.writeFileSync('/tmp/hire-token.json',JSON.stringify({WEP3_RUNNER_TOKEN:token}));
          JS
          npx wrangler secret bulk /tmp/hire-token.json -c wrangler.wep3.toml
          rm /tmp/hire-token.json
          if [ -n "$LAB_PIN" ]; then
            printf '%s' "$LAB_PIN" | npx wrangler secret put LAB_PIN -c wrangler.wep3.toml
          fi
          # Base USDC / x402 live rail (optional until secrets exist)
          if [ -n "$X402_RECEIVE_ADDRESS" ]; then
            printf '%s' "$X402_RECEIVE_ADDRESS" | npx wrangler secret put X402_RECEIVE_ADDRESS -c wrangler.wep3.toml
            echo 'X402_RECEIVE_ADDRESS configured'
          else
            echo 'X402_RECEIVE_ADDRESS not set — challenge uses simulated treasury address'
          fi
          if [ -n "$X402_LIVE" ]; then
            printf '%s' "$X402_LIVE" | npx wrangler secret put X402_LIVE -c wrangler.wep3.toml
            echo 'X402_LIVE configured'
          else
            echo 'X402_LIVE not set — 0x proofs stay simulated until enabled'
          fi
      - name: Verify public health, x402, and anonymous write rejection
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const base='https://ltzzz-wep3.ltzyz2181.workers.dev';
          const h=await fetch(base+'/health');const health=await h.json();
          const w=await fetch(base+'/hire',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
          const catalogResponse=await fetch(base+'/market/catalog');const catalog=await catalogResponse.json();
          const blocked=await fetch(base+'/market/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
          const chRes=await fetch(base+'/market/x402/challenge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({skill:'audit',brief:'deploy verify brief for x402 challenge path'})});
          const ch=await chRes.json();
          let verify={ok:false};let verifyHttp=0;
          if(ch.challenge_id){
            const vRes=await fetch(base+'/market/x402/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({challenge_id:ch.challenge_id,proof:'sim_deploy_'+Date.now()})});
            verifyHttp=vRes.status;verify=await vRes.json();
          }
          const report={market_http:catalogResponse.status,market:catalog,anonymous_market_complete_http:blocked.status,at:new Date().toISOString(),execution_id:process.env.GITHUB_RUN_ID,source_commit:process.env.GITHUB_SHA,health_http:h.status,pin_configured:health.pin,anonymous_write_http:w.status,x402_challenge_http:chRes.status,x402_challenge_ok:!!ch.challenge_id,x402_verify_http:verifyHttp,x402_verify_ok:!!verify.ok,x402_order_id:verify.order_id||null,real_hire_verified:false,tx_hash:null};
          fs.mkdirSync('knowledge/results/wep3',{recursive:true});fs.writeFileSync('knowledge/results/wep3/'+process.env.GITHUB_RUN_ID+'.json',JSON.stringify(report,null,2));
          if(!h.ok||!health.pin||w.status!==401||!catalogResponse.ok||!catalog.ok||blocked.status!==401||!ch.challenge_id||!verify.ok)process.exitCode=1;
          JS
      - name: Audit actual provider delivery and accept hire once
        if: github.event_name != 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          DOUBAO_MODEL: ${{ secrets.DOUBAO_MODEL }}
          DOUBAO_BASE_URL: https://ark.cn-beijing.volces.com/api/v3
        run: node scripts/accept-real-hire.mjs
      - name: Fulfill at most one paid customer order
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DOUBAO_MODEL: ${{ secrets.DOUBAO_MODEL }}
          DOUBAO_BASE_URL: https://ark.cn-beijing.volces.com/api/v3
        run: node scripts/fulfill-market-orders.mjs
      - name: Alert failed deployment
        if: failure()
        run: echo '::error::WEP3 deployment or acceptance failed. Inspect the receipt before claiming completion.'
      - name: Save acceptance evidence
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/wep3/ || true
          git diff --staged --quiet && exit 0
          git commit -m 'WEP3 actual deployment acceptance'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
