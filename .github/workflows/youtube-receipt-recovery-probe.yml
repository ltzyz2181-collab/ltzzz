name: Recover existing YouTube receipt only (no publication)
on:
  push:
    branches: [codex/youtube-auth-restored-20261025]
    paths: [.github/workflows/youtube-receipt-recovery-probe.yml]
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Download existing attempt-2 artifact without publication credentials
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ltzyz2181-collab/ltzzz
        run: gh api repos/ltzyz2181-collab/ltzzz/actions/artifacts/12624253202/zip > "$RUNNER_TEMP/youtube-receipt.zip"
      - name: Verify artifact and print exact existing receipt for archival repair
        shell: python
        run: |
          import os, pathlib, zipfile, hashlib, json, base64
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'youtube-receipt.zip'
          assert p.stat().st_size<=30*1024*1024
          raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='b1f3ff52f9af8a97d59812ed70800601136d46a74e040387d9d3ea4bc437d1cd'
          with zipfile.ZipFile(p) as z:
              paths=z.namelist()
              names=[n for n in paths if n.endswith('youtube-daily-2026-10-25.json')]
              assert len(names)==1
              ri=z.getinfo(names[0]);assert ri.file_size<=128*1024
              receipt=z.read(names[0]);r=json.loads(receipt)
              assert r['run_id']=='40221002584'
              assert r['day']=='2026-10-25'
              assert r['source_commit']=='af8f14620a201cc4fa9bb5fc7359f050d163cbb8'
              assert r['video_id']=='p4rlU5ahdxM' and r['published'] is True
              v=r['verification']
              assert v['privacyStatus']=='public' and v['uploadStatus']=='processed'
              assert v['channel_id']=='UCnKqseQ7uivSc7FN38ccRUA'
              names=[n for n in paths if n.endswith('youtube-daily.mp4')]
              assert len(names)==1
              vi=z.getinfo(names[0]);assert 0<vi.file_size<=25*1024*1024
              video=z.read(names[0])
              assert hashlib.sha256(video).hexdigest()==r['video_sha256']
              def no_credentials(x):
                  if isinstance(x,dict):
                      assert not any(str(k).lower() in ('access_token','refresh_token','client_secret','authorization','password','api_key','private_key') for k in x)
                      for v in x.values(): no_credentials(v)
                  elif isinstance(x,list):
                      for v in x: no_credentials(v)
              no_credentials(r)
              print('LTZZZ_RECOVERY_SUMMARY='+json.dumps({'artifact_id':12624253202,'artifact_sha256':hashlib.sha256(raw).hexdigest(),'receipt_sha256':hashlib.sha256(receipt).hexdigest(),'video_sha256':r['video_sha256'],'video_bytes':len(video),'video_id':r['video_id'],'published':r['published'],'recovery_uploads':0,'model_calls':0}))
              print('LTZZZ_RECOVERED_RECEIPT_BASE64='+base64.b64encode(receipt).decode())
