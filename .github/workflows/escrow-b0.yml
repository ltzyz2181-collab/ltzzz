name: Escrow B0 local EVM acceptance only
on:
  pull_request:
    paths: ['experiments/testnet-escrow/**','.github/workflows/escrow-b0.yml']
  push:
    branches: [main]
    paths: ['experiments/testnet-escrow/**','.github/workflows/escrow-b0.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  local_evm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: experiments/testnet-escrow
      - run: npm test
        working-directory: experiments/testnet-escrow
