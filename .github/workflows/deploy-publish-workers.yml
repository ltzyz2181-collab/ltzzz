name: Deploy YouTube + TikTok workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'youtube-upload-worker.js'
      - 'tiktok-post-worker.js'
      - 'wrangler.youtube-upload.toml'
      - 'wrangler.tiktok.toml'
      - '.github/workflows/deploy-publish-workers.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.youtube-upload.toml
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.tiktok.toml
