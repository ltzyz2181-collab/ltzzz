name: Memory promotion dual-provider review
on:
  workflow_dispatch:
    inputs:
      limit:
        description: '本次评审条数（1-5）'
        required: false
        default: '1'
      candidate:
        description: '指定候选 ID（留空=自动挑选高影响最新）'
        required: false
        default: ''
      dry_run:
        description: 'true=只评审不落章（演练）'
        required: false
        default: 'false'
permissions:
  contents: write
concurrency:
  group: memory-promotion-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe provider reachability from this runner (no credentials used)
        run: |
          for u in https://api.deepseek.com/v1/models https://api.x.ai/v1/models https://ark.cn-beijing.volces.com/api/v3/models; do
            code=$(curl -sS -m 8 -o /dev/null -w '%{http_code}' "$u" 2>/dev/null || echo TIMEOUT)
            echo "probe $u -> $code"
          done
      - name: Dual-provider review (worker/reviewer are different actual providers)
        env:
          REVIEW_WORKER: deepseek
          REVIEW_REVIEWER: grok
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
        run: |
          set -o pipefail
          ARGS="--limit ${{ inputs.limit }}"
          if [ -n "${{ inputs.candidate }}" ]; then ARGS="$ARGS --candidate ${{ inputs.candidate }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/run-memory-promotion-review.mjs $ARGS | tee review-run.log
      - name: Persist receipt, queue state and promoted memory
        id: persist
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          # 逐个 add：任一 pathspec 不存在会让整条 git add 失败并静默丢全部变更
          for p in knowledge/results/memory-promotion memory/promote/queue.json memory/long-term; do
            if [ -e "$p" ]; then git add -A -- "$p"; fi
          done
          git status --porcelain | head -20
          if git diff --staged --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "memory: dual-provider review run ${{ github.run_id }}"
      - name: Push commit
        if: steps.persist.outputs.changed == 'true'
        run: node tools/push-receipt-commit.mjs
