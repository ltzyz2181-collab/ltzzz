name: External market M1 zero-outflow offline verification
on:
  pull_request:
    paths: ['scripts/lib/external-market-m1.mjs','scripts/tests/external-market-m1*.test.mjs','config/external-market-m1.json','.github/workflows/external-market-m1.yml','docs/EXTERNAL-MARKETS-M1-GPT-DRAFT-20261027.md','knowledge/results/external-markets/m1/*.json']
  push:
    branches: [main]
    paths: ['scripts/lib/external-market-m1.mjs','scripts/tests/external-market-m1*.test.mjs','config/external-market-m1.json','.github/workflows/external-market-m1.yml','docs/EXTERNAL-MARKETS-M1-GPT-DRAFT-20261027.md','knowledge/results/external-markets/m1/*.json']
permissions: {contents: read}
concurrency: {group: 'external-market-m1-offline-${{ github.event.pull_request.number || github.ref }}', cancel-in-progress: false}
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22'}
      - name: No credentials, network enrollment or funding
        run: |
          node --check scripts/lib/external-market-m1.mjs
          node --test scripts/tests/external-market-m1*.test.mjs
