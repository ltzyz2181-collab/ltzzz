name: Webhook Deploy

on:
  repository_dispatch:
    types:
      - deploy-pages
      - patrol
      - record-result
      - ping
  workflow_dispatch:
    inputs:
      action:
        description: "ping | patrol | record-result | deploy-pages"
        default: ping
        required: true

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: webhook-deploy
  cancel-in-progress: false

jobs:
  handle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve action
        id: act
        run: |
          set -euo pipefail
          A="${{ github.event.client_payload.action || github.event.inputs.action || github.event.action || 'ping' }}"
          echo "action=$A" >> "$GITHUB_OUTPUT"
          echo "resolved action=$A"
          case "$A" in
            ping|patrol|record-result|deploy-pages) ;;
            publish|pay|withdraw|transfer)
              echo "forbidden action: $A"
              exit 1
              ;;
            *) echo "unknown action treated as ping: $A"; echo "action=ping" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Write hook log (no secrets)
        run: |
          set -euo pipefail
          DAY=$(date -u +%F)
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p results/hooks
          {
            echo "# hook $TS"
            echo
            echo "- action: ${{ steps.act.outputs.action }}"
            echo "- event: ${{ github.event_name }}"
            echo "- actor: ${{ github.actor }}"
            echo "- sha: ${{ github.sha }}"
            echo "- publish: blocked"
            echo "- payment: blocked"
          } > "results/hooks/${DAY}-${{ github.run_id }}.md"

      - name: Commit hook log
        run: |
          git config user.name "ltzzz-webhook"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/hooks
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(hook): ${{ steps.act.outputs.action }}"
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Trigger patrol if requested
        if: steps.act.outputs.action == 'patrol'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'patrol-memory.yml',
              ref: 'main'
            });

      - name: Note on Pages
        if: steps.act.outputs.action == 'deploy-pages'
        run: |
          echo "Pages already deploys on push to main (pages.yml)."
          echo "This hook only records the request. No extra wrangler."
