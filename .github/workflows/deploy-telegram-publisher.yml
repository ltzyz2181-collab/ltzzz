name: Deploy LTZZZ Telegram Publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'telegram-publisher-worker.js'
      - 'wrangler.telegram-publisher.toml'
      - '.github/workflows/deploy-telegram-publisher.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.telegram-publisher.toml
