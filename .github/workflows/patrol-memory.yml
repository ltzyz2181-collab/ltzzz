name: Patrol Memory Gateway

on:
  schedule:
    - cron: "0 0 * * *"    # UTC 00:00 = 北京 08:00 每日
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patrol-memory
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Probe live endpoints (no AI keys)
        run: |
          set -euo pipefail
          DAY=$(date -u +%F)
          mkdir -p memory/daily
          GW=https://ltzzz-memory-gateway.ltzyz2181.workers.dev
          DB=https://ltzzz-doubao-proxy.ltzyz2181.workers.dev
          HEALTH=$(curl -sS --fail "$GW/health")
          echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('ok') is True, d"
          {
            echo "# Memory patrol · ${DAY}"
            echo
            echo "- mode: dry-run / inspect only"
            echo "- no API keys used"
            echo "- r2 not required"
            echo "- trigger: GitHub Actions schedule (UTC 00:00 / CST 08:00) or workflow_dispatch"
            echo
            echo "## Gateway /health"
            echo
            echo '```json'
            echo "$HEALTH"
            echo '```'
            echo
            echo "## Gateway /manifest (subset)"
            echo
            echo '```json'
            curl -sS --fail "$GW/manifest" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps({k:d.get(k) for k in ('ok','source','generated_at','read_order')},ensure_ascii=False,indent=2))"
            echo '```'
            echo
            echo "## Doubao /health"
            echo
            echo '```json'
            curl -sS --fail "$DB/health" || echo '{"ok":false,"note":"doubao health unreachable"}'
            echo
            echo '```'
          } > "memory/daily/patrol-${DAY}.md"

      - name: Commit patrol log
        run: |
          git config user.name "ltzzz-patrol"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory/daily/patrol-*.md
          if git diff --cached --quiet; then
            echo "no patrol log change"
            exit 0
          fi
          git commit -m "chore(patrol): daily memory inspect"
          git pull --rebase origin main || true
          git push origin HEAD:main
