name: Patrol Memory Gateway

on:
  schedule:
    - cron: "0 0 * * *"    # UTC 00:00 = 北京 08:00 每日
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patrol-memory
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Probe live endpoints + write dry-run summary (no AI keys)
        env:
          DAY: ${{ steps.date.outputs.day }}
        run: |
          set -euo pipefail
          DAY=$(date -u +%F)
          mkdir -p memory/daily
          GW=https://ltzzz-memory-gateway.ltzyz2181.workers.dev
          DB=https://ltzzz-doubao-proxy.ltzyz2181.workers.dev
          DA=https://ltzzz-daily-automation.ltzyz2181.workers.dev
          HEALTH=$(curl -sS --fail "$GW/health")
          MANIFEST=$(curl -sS --fail "$GW/manifest")
          DAILY_HEALTH=$(curl -sS --fail "$DA/health" || echo '{"ok":false}')
          DOUBAO_HEALTH=$(curl -sS --fail "$DB/health" || echo '{"ok":false,"note":"doubao health unreachable"}')
          echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('ok') is True, d"

          # 保存 JSON 到临时文件，避免嵌套引号
          echo "$HEALTH" > /tmp/health.json
          echo "$MANIFEST" > /tmp/manifest.json
          echo "$DAILY_HEALTH" > /tmp/daily.json

          {
            echo "# Memory patrol · ${DAY}"
            echo
            echo "- mode: dry-run / inspect only"
            echo "- no API keys used"
            echo "- r2 not required"
            echo "- trigger: GitHub Actions schedule (UTC 00:00 / CST 08:00) or workflow_dispatch"
            echo
            echo "## Gateway /health"
            echo
            echo '```json'
            echo "$HEALTH"
            echo '```'
            echo
            echo "## Gateway /manifest (subset)"
            echo
            echo '```json'
            echo "$MANIFEST" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps({k:d.get(k) for k in ('ok','source','generated_at','read_order')},ensure_ascii=False,indent=2))"
            echo '```'
            echo
            echo "## Daily Worker /health"
            echo
            echo '```json'
            echo "$DAILY_HEALTH"
            echo '```'
            echo
            echo "## Doubao /health"
            echo
            echo '```json'
            echo "$DOUBAO_HEALTH"
            echo '```'
          } > "memory/daily/patrol-${DAY}.md"

          # 用 python 从文件读取 JSON，生成 summary
          DAY="$DAY" python3 << 'PY'
          import json, pathlib, os
          day = os.environ['DAY']
          health = json.load(open('/tmp/health.json'))
          manifest = json.load(open('/tmp/manifest.json'))
          daily = json.load(open('/tmp/daily.json'))
          files = manifest.get('files') or []
          read_order = manifest.get('read_order') or []
          dry = daily.get('dry_run', True)
          lines = []
          lines.append(f'# Daily summary · {day}')
          lines.append('')
          lines.append('- mode: **dry-run**')
          lines.append('- writer: GitHub Actions patrol (T022)')
          lines.append('- no API keys, no model calls, no R2, no payment')
          lines.append(f'- gateway_ok: {health.get("ok")}')
          lines.append(f'- gateway_source: {health.get("sources") or [manifest.get("source")]}')
          lines.append(f'- r2_bound: {health.get("r2_bound")}')
          lines.append(f'- daily_worker_ok: {daily.get("ok")}')
          lines.append(f'- daily_worker_dry_run: {dry}')
          lines.append('')
          lines.append('## Read order (Gateway)')
          lines.append('')
          for p in read_order:
              lines.append(f'- `{p}`')
          lines.append('')
          lines.append(f'## Manifest files ({len(files)})')
          lines.append('')
          for p in files:
              lines.append(f'- `{p}`')
          lines.append('')
          lines.append('## Note')
          lines.append('')
          lines.append('This file is a mechanical digest of live Gateway + Daily Worker health.')
          lines.append('It is not generated by GPT/Claude/Doubao/DeepSeek/Copilot/XIA.')
          lines.append('Human remains in control of keys, wallet, and Pages.')
          pathlib.Path(f'memory/daily/summary-{day}.md').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print('wrote', f'memory/daily/summary-{day}.md')
          PY

      - name: Commit patrol log + summary
        run: |
          git config user.name "ltzzz-patrol"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory/daily/patrol-*.md memory/daily/summary-*.md
          if git diff --cached --quiet; then
            echo "no patrol log change"
            exit 0
          fi
          git commit -m "chore(patrol): daily memory inspect + dry-run summary"
          git pull --rebase origin main || true
          git push origin HEAD:main
