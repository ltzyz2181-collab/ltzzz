name: Deploy LTZZZ Sell Order

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sell-order-worker.js'
      - 'wrangler.sell.toml'
      - '.github/workflows/deploy-sell.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.sell.toml
