name: Daily YouTube render upload and public verification
on:
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/youtube-daily-publish.yml','tools/render_youtube_daily.py','scripts/publish-youtube-daily.mjs']
permissions: {contents: write}
concurrency: {group: ltzzz-youtube-publish, cancel-in-progress: false}
jobs:
  publish:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-youtube-daily]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Deploy uploader retaining existing OAuth and secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy -c wrangler.youtube-upload.toml
      - name: Prepare video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install Pillow
      - name: Render narrated 30 second video from real evidence
        run: python tools/render_youtube_daily.py
        env:
          VIDEO_DATE: ''
      - name: Prepare directly downloadable Manus Instagram package
        run: node scripts/package-instagram-daily.mjs
      - name: Upload once and verify actual public state
        env:
          LTZZZ_AGENT_TOKEN: ${{ secrets.LTZZZ_AGENT_TOKEN }}
        run: node scripts/publish-youtube-daily.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-video-${{ github.run_id }}
          path: video-output/
          retention-days: 7
      - name: Archive receipt including failure
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add results/publishing/youtube-daily-*.json
          if [ -f videos/instagram/latest.json ]; then git add -f videos/instagram/latest.mp4 videos/instagram/latest.json videos/instagram/latest-caption.txt; fi
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'YouTube daily actual upload and public verification receipt'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
