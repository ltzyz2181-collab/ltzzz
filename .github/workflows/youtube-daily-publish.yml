name: Daily YouTube prepared video or render with public verification
on:
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/youtube-daily-publish.yml','tools/render_youtube_daily.py','scripts/publish-youtube-daily.mjs','scripts/lib/video-queue-client.mjs','scripts/prepare-ready-youtube-video.mjs','scripts/lib/prepared-video-policy.mjs']
permissions: {contents: write}
concurrency: {group: ltzzz-youtube-publish, cancel-in-progress: false}
jobs:
  publish:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-youtube-daily]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test publication and queue safety
        run: node --test scripts/tests/published-video-retention.test.mjs scripts/tests/video-scheduler.test.mjs scripts/tests/video-queue-client.test.mjs
      - name: Prepare media inspection
        run: command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Prefer existing prepared video
        id: prepared
        run: node scripts/prepare-ready-youtube-video.mjs
      - name: Resume shared queue and verify actual public state
        if: steps.prepared.outputs.ready == 'true'
        env:
          LTZZZ_AGENT_TOKEN: ${{ secrets.LTZZZ_AGENT_TOKEN }}
        run: node scripts/publish-youtube-daily.mjs
      - name: Remove repository media already confirmed public and processed
        if: always()
        run: node scripts/prune-published-videos.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-video-${{ github.run_id }}
          path: |
            results/publishing/youtube-daily-*.json
            results/publishing/video-retention-*.json
          retention-days: 7
      - name: Archive receipt including failure
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add results/publishing/youtube-daily-*.json
          git add -u -- videos/
          for receipt in results/publishing/video-retention-*.json; do
            if test -f "$receipt"; then git add -- "$receipt"; fi
          done
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'YouTube daily actual upload and public verification receipt'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
