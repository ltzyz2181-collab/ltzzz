name: Deep autonomy PR verify

# GITHUB_TOKEN 创建的 PR 不会触发 pull_request 工作流（GitHub 抑制递归事件）。
# Deep 自主执行桥在合并前显式 dispatch 这个工作流，跑到 PR 分支上做真实 CI；
# 只有该 run 成功才允许合并。没有 run、run 失败或超时都保持未合并。
on:
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: deep-autonomy-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax check
        run: |
          node --check scripts/deep-autonomy.mjs
          node --check scripts/run-deep-superagent-queue.mjs
          node --check scripts/dispatch-daily-card.mjs
          node --check scripts/build-deep-backlog-triage.mjs
          node --check scripts/dispatch-card-queue.mjs
          node --check scripts/publish-daily-cards.mjs
      - name: Autonomy and queue tests
        run: >-
          node --test
          scripts/tests/check-card-contract.test.mjs
          scripts/tests/dispatch-seat-policy.test.mjs
          scripts/tests/dispatch-daily-card.test.mjs
          scripts/tests/build-deep-backlog-triage.test.mjs
          scripts/tests/dispatch-card-queue.test.mjs
          scripts/tests/publish-daily-cards.test.mjs
          scripts/tests/deep-superagent-queue.test.mjs
          scripts/tests/deep-superagent-autonomy.test.mjs
          scripts/tests/deep-superagent-adjudicator.test.mjs
