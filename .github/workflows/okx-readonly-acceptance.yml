name: OKX current account read-only acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/okx-readonly-acceptance.yml']
permissions: {contents: write}
concurrency: {group: okx-readonly-acceptance, cancel-in-progress: false}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify existing key permissions and balance without orders or account creation
        env:
          OKX_API_KEY: '' # exchange API permissions unverified; no credential injected
          OKX_API_SECRET: '' # exchange API permissions unverified; no credential injected
          OKX_API_PASSPHRASE: '' # exchange API permissions unverified; no credential injected
          VERIFY_KIMI_MODEL_CALLS: '0'
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: node scripts/verify-kimi-okx.mjs
      - name: Preserve read-only permission evidence even if pushing fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: knowledge/results/connectivity/
      - name: Preserve current account evidence
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/connectivity/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Current OKX permission and balance read-only evidence'
          node tools/push-receipt-commit.mjs

