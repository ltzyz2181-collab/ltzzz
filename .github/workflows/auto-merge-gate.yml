name: Auto merge gate (CI 完成即评估)

# 设计要点：不依赖 cron。
# - check_suite completed 事件到达即评估（CI 一跑完就判定）
# - 手动 workflow_dispatch 可对指定 PR 补跑
# 判定逻辑在 scripts/lib/auto-merge-gate.mjs，资金/签名/凭据/部署闸一律拒绝。

on:
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: '要评估的 PR 编号（留空则只看事件）'
        required: false
  pull_request:
    paths:
      - 'scripts/lib/auto-merge-gate.mjs'
      - 'scripts/auto-merge-gate.mjs'
      - 'scripts/tests/auto-merge-gate.test.mjs'
      - '.github/workflows/auto-merge-gate.yml'

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

concurrency:
  group: auto-merge-gate
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check scripts/lib/auto-merge-gate.mjs
          node --check scripts/auto-merge-gate.mjs
      - name: Unit tests (pure logic, no network)
        run: node --test scripts/tests/auto-merge-gate.test.mjs

  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'check_suite' &&
       github.event.check_suite.pull_requests[0] != null)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests (pure logic, no network)
        run: node --test scripts/tests/auto-merge-gate.test.mjs
      - name: Evaluate and merge
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          TARGET_PR: ${{ inputs.pr }}
          MAX_MERGES: '3'
        run: node scripts/auto-merge-gate.mjs
      - name: Upload decision receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-merge-receipts
          path: knowledge/results/automation/auto-merge/*.json
          if-no-files-found: ignore
          retention-days: 14
