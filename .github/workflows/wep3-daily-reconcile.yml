name: WEP3 Daily Reconcile

on:
  schedule:
    - cron: "20 15 * * *"
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run reconcile
        run: node scripts/wep3-daily-reconcile.cjs
      - name: Commit report if changed
        run: |
          git config user.name "ltzzz-bot"
          git config user.email "ltzzz-bot@users.noreply.github.com"
          git add results/wep3-reconcile-*.json || true
          if git diff --staged --quiet; then
            echo "no report change"
          else
            git commit -m "chore: wep3 daily reconcile $(date -u +%F)"
            git push
          fi
