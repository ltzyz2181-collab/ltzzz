name: PatchGate A2 candidate tests only
on:
  pull_request:
    paths: ['config/patch*.json', 'scripts/patchgate*.mjs', 'scripts/lib/patchgate*.mjs', 'scripts/tests/patchgate*.test.mjs', 'scripts/lib/controller-decision.mjs', 'scripts/tests/controller-decision.test.mjs', '.github/workflows/patchgate-a2-verify.yml']
  push:
    branches: [main, codex/patchgate-a2-20261025]
    paths: ['config/patch*.json', 'scripts/patchgate*.mjs', 'scripts/lib/patchgate*.mjs', 'scripts/tests/patchgate*.test.mjs', 'scripts/lib/controller-decision.mjs', 'scripts/tests/controller-decision.test.mjs', '.github/workflows/patchgate-a2-verify.yml']
permissions: {contents: read}
concurrency: {group: 'patchgate-a2-verify-${{ github.event.pull_request.number || github.ref }}', cancel-in-progress: false}
jobs:
  test_candidate_only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: A0, A1 and A2 adversarial fixtures without secrets or mutation permission
        run: |
          node --check scripts/lib/patchgate-a2.mjs
          node --check scripts/patchgate-a2-preflight.mjs
          node --test scripts/tests/patchgate*.test.mjs scripts/tests/controller-decision.test.mjs
