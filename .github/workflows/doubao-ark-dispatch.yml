name: Doubao Ark API concrete task delivery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/doubao-ark-dispatch.yml','scripts/run-doubao-ark-dispatch.mjs','ops/dispatch/DOUBAO-ARK-EXTERNAL-HIRE-BINANCE-20261014.md']
permissions: {contents: write}
concurrency: {group: doubao-ark-dispatch, cancel-in-progress: false}
jobs:
  deliver:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-doubao-ark]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: One Ark model call with existing Secret
        env:
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY || secrets.ARK_API_KEY }}
          DOUBAO_BASE_URL: ${{ vars.DOUBAO_BASE_URL || secrets.DOUBAO_BASE_URL }}
          DOUBAO_MODEL_OVERRIDE: ${{ vars.DOUBAO_MODEL }}
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: node scripts/run-doubao-ark-dispatch.mjs
      - name: Save real delivery or blocker receipt
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/ark-dispatch/ || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Actual Doubao Ark task delivery receipt'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
