name: CDP wallet control, Kimi regions and OKX read-only verification
on:
  workflow_dispatch:
    inputs:
      include_kimi_generation:
        type: boolean
        default: false
        description: Explicit optional paid model call; regular probe is weekly
  push:
    branches: [main]
    paths: ['scripts/verify-kimi-okx.mjs', 'scripts/coinbase-readiness.mjs', 'scripts/tests/coinbase*.test.mjs', '.github/workflows/verify-kimi-okx.yml']
permissions: {contents: write}
concurrency: {group: connectivity-verification, cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: node --test scripts/tests/coinbase*.test.mjs
      - name: Verify CDP account and bounded control proof (no transfers)
        env:
          CDP_API_KEY_ID: ${{ secrets.CDP_API_KEY_ID || secrets.CDP_API_KEY_NAME || secrets.COINBASE_API_KEY_ID }}
          CDP_API_KEY_SECRET: ${{ secrets.CDP_API_KEY_SECRET || secrets.COINBASE_API_KEY_SECRET }}
          CDP_WALLET_SECRET: ${{ secrets.CDP_WALLET_SECRET || secrets.COINBASE_WALLET_SECRET }}
          CDP_EVM_ACCOUNT_NAME: ${{ vars.CDP_EVM_ACCOUNT_NAME || 'ltzzz-ops-v1' }}
          CDP_CREATE_ACCOUNT: '1'
          CDP_VERIFY_ETHEREUM_AAVE: '1'
          DISABLE_CDP_ERROR_REPORTING: 'true'
          DISABLE_CDP_USAGE_TRACKING: 'true'
        run: node scripts/coinbase-readiness.mjs
      - run: node scripts/verify-kimi-okx.mjs
        if: always()
        env:
          MOONSHOT_API_KEY_CN: ${{ secrets.MOONSHOT_API_KEY_CN }}
          MOONSHOT_API_KEY_INTL: ${{ secrets.MOONSHOT_API_KEY_INTL }}
          MOONSHOT_API_KEY_: ${{ secrets.MOONSHOT_API_KEY_ }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET || secrets.OKX_SECRET_KEY }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE || secrets.OKX_PASSPHRASE }}
          VERIFY_KIMI_MODEL_CALLS: ${{ inputs.include_kimi_generation && '1' || '0' }}
      - name: Save actual receipts
        if: always()
        run: |
          mkdir -p knowledge/results/connectivity knowledge/results/wallet
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/connectivity/ knowledge/results/wallet/
          git diff --staged --quiet && exit 0
          git commit -m 'Kimi two-region and OKX read-only actual verification'
          git pull --rebase origin main
          git push origin HEAD:main
