name: UI browser and read-only Treasury evidence
on:
  pull_request:
    paths: ['wep3.html', 'scripts/tests/wep3-receipt-render.test.mjs', 'treasury-dashboard.html', 'scripts/verify-ui-browser.mjs', 'scripts/lib/ui-source-comparison.mjs', 'scripts/tests/ui-source-comparison.test.mjs', '.github/workflows/ui-treasury-verification.yml']
  push:
    branches: [main]
    paths: ['wep3.html', 'scripts/tests/wep3-receipt-render.test.mjs', 'treasury-dashboard.html', 'scripts/verify-ui-browser.mjs', 'scripts/lib/ui-source-comparison.mjs', 'scripts/tests/ui-source-comparison.test.mjs', 'scripts/read-treasury-evidence.mjs', 'scripts/review-ui-deepseek.mjs', '.github/workflows/ui-treasury-verification.yml']
permissions: {contents: read}
concurrency: {group: 'ui-treasury-verification-${{ github.sha }}', cancel-in-progress: false}
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/tests/ui-source-comparison.test.mjs
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/ui-browser" --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          node "$RUNNER_TEMP/ui-browser/node_modules/playwright-core/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/ui-browser/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
      - name: Pinned premerge candidates, Node and actual Chromium regression
        env:
          UI_EVIDENCE_DIR: ${{ runner.temp }}/ui-evidence/candidate
        run: |
          git fetch origin 48d07b2025f3815c9e06374bf925346c19e7b4a7 226523eab82c5dcf85ba2fbf4d902d695bf4d3ac
          mkdir -p "$RUNNER_TEMP/ui-candidate/scripts/tests"
          for file in wep3.html scripts/tests/wep3-receipt-render.test.mjs; do
            git show "48d07b2025f3815c9e06374bf925346c19e7b4a7:$file" > "$RUNNER_TEMP/ui-candidate/$file"
          done
          for file in treasury-dashboard.html scripts/tests/treasury-dashboard-render.test.mjs; do
            git show "226523eab82c5dcf85ba2fbf4d902d695bf4d3ac:$file" > "$RUNNER_TEMP/ui-candidate/$file"
          done
          node --test "$RUNNER_TEMP/ui-candidate/scripts/tests/wep3-receipt-render.test.mjs" "$RUNNER_TEMP/ui-candidate/scripts/tests/treasury-dashboard-render.test.mjs"
          UI_SOURCE_DIR="$RUNNER_TEMP/ui-candidate" node scripts/verify-ui-browser.mjs
      - name: Verify the current pull-request UI candidate
        if: github.event_name == 'pull_request'
        env:
          UI_EVIDENCE_DIR: ${{ runner.temp }}/ui-evidence/current-pr
        run: |
          node --test scripts/tests/wep3-receipt-render.test.mjs scripts/tests/treasury-dashboard-render.test.mjs
          UI_SOURCE_DIR=. node scripts/verify-ui-browser.mjs
      - name: Check whether both reviewed UIs are on this main commit
        id: scope
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import {createHash} from 'node:crypto';
          const expected={'wep3.html':'dc3d96f6fe27323739e4090b53e45bb60dfc2d03963e3f5be6200a9134ff9b1b','treasury-dashboard.html':'7b9d6b06232ab09ec5fd5c42c3e09ca462bb44fad136c1b580c6a8abe5cd50bd'};
          const ready=Object.entries(expected).every(([file,hash])=>createHash('sha256').update(fs.readFileSync(file)).digest('hex')===hash);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'ready='+ready+'\n');
          console.log(ready?'Both reviewed UIs are present; verify production':'Production acceptance pending both UI merges');
          JS
      - name: Verify deployed pages in actual Chromium
        if: steps.scope.outputs.ready == 'true'
        env:
          UI_EVIDENCE_DIR: ${{ runner.temp }}/ui-evidence/production
        run: node scripts/verify-ui-browser.mjs --production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/ui-evidence/
          retention-days: 14
  treasury-readonly:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[treasury-readonly]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read versions, binding names, public state and Safe configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UI_EVIDENCE_DIR: ${{ runner.temp }}/treasury-evidence
        run: node scripts/read-treasury-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treasury-readonly-${{ github.run_id }}
          path: ${{ runner.temp }}/treasury-evidence/
          retention-days: 14
  native-review:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ui-native-review]')
    permissions: {contents: write}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: One hash-bound supplemental review, with durable exclusive claim
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          UI_EVIDENCE_DIR: ${{ runner.temp }}/native-ui-review
        run: node scripts/review-ui-deepseek.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-independent-review-${{ github.run_id }}
          path: ${{ runner.temp }}/native-ui-review/
          retention-days: 14
