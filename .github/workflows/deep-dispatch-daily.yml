name: Deep dispatch daily card
# 每日生成一张 Deep 主办卡，并在同一并发锁内直接消费队列。
# 背景（2026-11-18 核对）：队列只监听 ops/deep-superagent/tasks/ 的 push，
# 没有任何定时卡生成器，所以「通道已部署」但每天触发数为 0。
# 本工作流补三件事：
#   1) 按 dispatch-seat-policy 模板生成每日卡（importance=medium，仅 Deep 主办）；
#   2) 卡入队前先跑 `dispatch-seat-policy.mjs check`，不合规即 fail-closed；
#   3) 生成后直接运行队列消费者，不依赖 push 触发（GITHUB_TOKEN 推送不会触发下游工作流）。
on:
  schedule:
    # 每天 00:17 UTC（北京时间 08:17）。刻意避开 :00/:30，降低 GitHub 定时拥堵。
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '日期 YYYY-MM-DD；留空取当天 UTC'
        required: false
        default: ''
      suffix:
        description: '同日重试序号 1-9；留空为 1'
        required: false
        default: '1'
  pull_request:
    paths:
      - 'scripts/dispatch-daily-card.mjs'
      - 'scripts/dispatch-seat-policy.mjs'
      - 'scripts/run-deep-superagent-queue.mjs'
      - 'scripts/tests/dispatch-daily-card.test.mjs'
      - 'scripts/tests/dispatch-seat-policy.test.mjs'
      - 'scripts/tests/deep-superagent-queue.test.mjs'
      - 'config/dispatch-seat-policy-20261117.json'
      - '.github/workflows/deep-dispatch-daily.yml'
permissions: {contents: read}
concurrency: {group: deep-dispatch-daily, cancel-in-progress: false}

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax check
        run: |
          node --check scripts/dispatch-daily-card.mjs
          node --check scripts/dispatch-seat-policy.mjs
          node --check scripts/run-deep-superagent-queue.mjs
      - name: Policy, card contract and queue tests
        run: >-
          node --test
          scripts/tests/dispatch-daily-card.test.mjs
          scripts/tests/dispatch-seat-policy.test.mjs
          scripts/tests/deep-superagent-queue.test.mjs
      - name: Policy check (fail-closed)
        run: node scripts/dispatch-seat-policy.mjs check

  dispatch:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'ltzyz2181-collab/ltzzz'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: 'main', fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Generate daily card and run the policy gate
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_SUFFIX: ${{ inputs.suffix }}
        run: |
          DATE="${INPUT_DATE:-}"
          if [ -z "$DATE" ]; then DATE=$(date -u +%F); fi
          SUFFIX="${INPUT_SUFFIX:-1}"
          echo "CARD_DATE=$DATE" >> "$GITHUB_ENV"
          echo "CARD_SUFFIX=$SUFFIX" >> "$GITHUB_ENV"
          node scripts/dispatch-daily-card.mjs --date "$DATE" --suffix "$SUFFIX"
          node scripts/dispatch-seat-policy.mjs check

      - name: Commit the card with a PAT push so the queue push trigger is not suppressed
        env:
          LTZZZ_AGENT_TOKEN: ${{ secrets.LTZZZ_AGENT_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const card = 'ops/deep-superagent/tasks/DEEP-SUPERAGENT-' + process.env.CARD_DATE.replaceAll('-', '') + '-DAILY-' + (process.env.CARD_SUFFIX || '1') + '.json';
          if (!fs.existsSync(card)) throw Error('daily_card_missing:' + card);
          execFileSync('git', ['config', 'user.name', 'ltzzz-bot']);
          execFileSync('git', ['config', 'user.email', 'bot@ltzzz.com']);
          execFileSync('git', ['add', '--', card]);
          try { execFileSync('git', ['diff', '--staged', '--quiet']); process.exit(0); } catch {}
          execFileSync('git', ['commit', '-m', 'Deep dispatch daily card ' + process.env.CARD_DATE], {stdio: 'inherit'});
          JS
          if git diff --quiet HEAD~1 -- "ops/deep-superagent/tasks/DEEP-SUPERAGENT-${CARD_DATE//-/}-DAILY-${CARD_SUFFIX}.json" 2>/dev/null; then
            echo "PUSHED=0" >> "$GITHUB_ENV"
            echo "::notice::Daily card already exists unchanged; no push, no new queue trigger."
            exit 0
          fi
          if [ -z "${LTZZZ_AGENT_TOKEN:-}" ]; then
            echo "::error::LTZZZ_AGENT_TOKEN is absent; a GITHUB_TOKEN push would suppress the queue workflow."
            exit 1
          fi
          # 用 PAT 推送：GitHub 会抑制 GITHUB_TOKEN 推送产生的下游工作流，
          # 而队列的信任模型要求真实 push 的 before..after diff。
          # actions/checkout 会把 GITHUB_TOKEN 写进 http.extraheader，它会压过 URL 里的 PAT；
          # 必须先清掉，否则推送仍以 github-actions 身份发出，queue 工作流不会触发。
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          git config --local --unset-all credential.helper || true
          git remote set-url origin "https://x-access-token:${LTZZZ_AGENT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # 内联 fetch/rebase/push：失败时输出脱敏 stderr，否则只能看到
          # receipt_push_failed_not_a_concurrent_update，无法区分 403、分支保护或网络。
          sanitize() { sed -E 's#x-access-token:[^@]*@#x-access-token:***@#g; s#https://[^@[:space:]]*@#https://***@#g' "$1" | tail -20; }
          if ! git fetch origin main 2>push.err; then sanitize push.err; echo "::error::pat_fetch_failed"; exit 1; fi
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::card_rebase_conflict"
            exit 1
          fi
          if ! git push origin HEAD:main 2>push.err; then
            sanitize push.err
            echo "::error::pat_push_failed"
            exit 1
          fi
          rm -f push.err
          echo "NEW_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PUSHED=1" >> "$GITHUB_ENV"

      - name: Confirm the queue push trigger was created
        if: env.PUSHED == '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/deep-superagent-queue.yml/runs?head_sha=${process.env.NEW_SHA}&per_page=5`;
          for (let i = 0; i < 18; i += 1) {
            const response = await fetch(url, {headers: {Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json'}});
            const data = await response.json();
            const runs = Array.isArray(data.workflow_runs) ? data.workflow_runs : [];
            if (runs.length) {
              const run = runs[0];
              console.log(JSON.stringify({triggered: true, run_id: run.id, status: run.status, url: run.html_url}));
              process.exit(0);
            }
            await new Promise((resolve) => setTimeout(resolve, 10000));
          }
          throw Error('queue_run_not_triggered_for_card_commit');
          JS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-dispatch-daily-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/deep-superagent/tasks/DEEP-SUPERAGENT-*-DAILY-*.json
          if-no-files-found: warn
          retention-days: 30
