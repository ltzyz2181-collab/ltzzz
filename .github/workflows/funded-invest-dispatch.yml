name: Funded invest dispatch
on:
  workflow_dispatch:
    inputs:
      venue:
        description: 'all / web3 (Aave Base USDC) / cex (OKX cash BTC-USDT)'
        type: choice
        default: all
        options: [all, web3, cex]
      agent:
        description: 'all or gpt/grok/doubao/deepseek'
        default: all
      arm:
        description: 'One fixed owner-authorized round; no repeat cash schedule'
        type: boolean
        default: false
  pull_request:
    paths: ['scripts/lib/resume-existing-aave.mjs','scripts/tests/resume-existing-aave.test.mjs','scripts/tests/wep3-swarm.test.mjs','wep3-owner-child-allocation.js','scripts/tests/owner-child-allocation.test.mjs','scripts/resume-confirmed-cex-round.mjs','scripts/lib/confirmed-cex-resume.mjs','scripts/tests/confirmed-cex-resume.test.mjs','wep3-okx-funding.js','scripts/fund-okx-owner-round.mjs','scripts/lib/okx-capital-funding.mjs','scripts/tests/okx-capital-funding.test.mjs','wep3-worker.js','wep3-market.js','scripts/lib/wep3-runtime-readiness.mjs','scripts/tests/wep3-runtime-readiness.test.mjs','.github/workflows/deploy-wep3.yml','scripts/funded-invest-executor.mjs','scripts/lib/funded-invest-runtime.mjs','scripts/lib/okx-funded-spot.mjs','wep3-procurement.js','wep3-cash-liabilities.js','policy/funded-owner-round-20261017.json','scripts/tests/funded-invest.test.mjs','scripts/tests/wep3-procurement.test.mjs','.github/workflows/funded-invest-dispatch.yml']
  push:
    branches: [main]
    paths: ['policy/funded-owner-round-20261017.json','ops/dispatch/funded-round-resume-20261017.json']
  schedule:
    # New investment proposals remain dry-run. Only the previously confirmed fixed20U
    # capital may resume its original CEX claims; no new funding or model request.
    - cron: '0 4 * * *'
permissions: {contents: read}
concurrency:
  # PR validation must not wait behind a live execution waiting for its rollout.
  # All real main-branch executions still share the original serial lock.
  group: ${{ github.event_name == 'pull_request' && format('ltzzz-funded-invest-pr-{0}', github.event.pull_request.number) || 'ltzzz-funded-invest' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - run: node --check scripts/funded-invest-executor.mjs && node --check wep3-procurement.js
      - run: node --test scripts/tests/resume-existing-aave.test.mjs scripts/tests/wep3-swarm.test.mjs scripts/tests/owner-child-allocation.test.mjs scripts/tests/confirmed-cex-resume.test.mjs scripts/tests/aave-receipt-sensor.test.mjs scripts/tests/okx-capital-funding.test.mjs scripts/tests/funded-relay.test.mjs scripts/tests/funded-invest.test.mjs scripts/tests/wep3-procurement.test.mjs scripts/tests/wep3-aave.test.mjs scripts/tests/wep3-market.test.mjs scripts/tests/external-procurement-preflight.test.mjs scripts/tests/wep3-runtime-readiness.test.mjs
  dispatch:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {contents: write}
    env:
      ARM_REAL_ORDERS: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.arm)) && '1' || '0' }}
      WEP3_RUNNER_TOKEN: ''
      SELECTED_VENUE: ${{ inputs.venue || 'all' }}
      SELECTED_AGENT: ${{ inputs.agent || 'all' }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - name: Reuse runner identity without exporting any wallet key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import {runnerToken} from './scripts/lib/funded-invest-runtime.mjs';
          const token=runnerToken();if(!token)throw Error('runner_authentication_missing');console.log('::add-mask::'+token);
          const day=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          fs.appendFileSync(process.env.GITHUB_ENV,'WEP3_RUNNER_TOKEN='+token+'\nARM_ACK='+day+'\n');
          if(process.env.GITHUB_EVENT_NAME==='push'){
            const marker=JSON.parse(fs.readFileSync('ops/dispatch/funded-round-resume-20261017.json'));
            if(marker.venue==='cex'&&marker.order_id==='OWNER-FUNDED-20261017-01'&&marker.new_round_budget==='0')fs.appendFileSync(process.env.GITHUB_ENV,'SELECTED_VENUE=cex\nEXTERNAL_RECONCILE_ONLY=1\n');
            if(marker.permission_recovery==='owner-confirmed-20261017')fs.appendFileSync(process.env.GITHUB_ENV,'OKX_PERMISSION_RECOVERY=owner-confirmed-20261017\n');
            if(marker.price_band_recovery==='owner-fixed-price-band-v1')fs.appendFileSync(process.env.GITHUB_ENV,'REPRICE_REJECTED_OKX=owner-fixed-price-band-v1\n');
          }
          JS
      - name: Wait for restricted external-purchase executor deployment, no payment
        run: |
          node --input-type=module <<'JS'
          import {wep3Request} from './scripts/lib/funded-invest-runtime.mjs';
          const until=Date.now()+600000;let ready=false;
          while(Date.now()<until){try{const r=await wep3Request('/market/procurement/order',{token:process.env.WEP3_RUNNER_TOKEN});if(r.revision==='external-purchase-v5'){ready=true;break;}}catch{}await new Promise(r=>setTimeout(r,5000));}
          if(!ready)throw Error('restricted_purchase_executor_not_deployed');
          JS
      - name: Fund only the fixed verified OKX account within the original 20U budget
        if: env.ARM_REAL_ORDERS == '1' && env.SELECTED_VENUE != 'web3'
        env:
          RECONCILE_CONFIRMED_DEPOSIT_ONLY: '1'
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET || secrets.OKX_SECRET_KEY }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE || secrets.OKX_PASSPHRASE }}
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          node --input-type=module <<'JS'
          import {wep3Request} from './scripts/lib/funded-invest-runtime.mjs';
          const until=Date.now()+600000;let ready=false;
          while(Date.now()<until){try{const r=await wep3Request('/market/okx/funding',{token:process.env.WEP3_RUNNER_TOKEN});if(r.revision==='okx-funding-v1'){ready=true;break;}}catch{}await new Promise(r=>setTimeout(r,5000));}
          if(!ready)throw Error('restricted_OKX_funding_executor_not_deployed');
          JS
          node scripts/fund-okx-owner-round.mjs
      - name: Prepare live reputation allocations and fixed exchange client IDs
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET || secrets.OKX_SECRET_KEY }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE || secrets.OKX_PASSPHRASE }}
        run: node scripts/funded-invest-executor.mjs --phase prepare --venue "$SELECTED_VENUE" --agent "$SELECTED_AGENT"
      - name: Resume only already-confirmed original capital after credit or permission recovers
        if: github.event_name == 'schedule'
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET || secrets.OKX_SECRET_KEY }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE || secrets.OKX_PASSPHRASE }}
        run: node scripts/resume-confirmed-cex-round.mjs
      - name: Persist claims before any order submission
        if: env.ARM_REAL_ORDERS == '1'
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/funded-invest/
          if ! git diff --staged --quiet; then
            git commit -m 'Reserve fixed owner-authorized investment round before submissions'
            node tools/push-receipt-commit.mjs
          fi
          echo 'FUNDED_CLAIMS_PERSISTED=1' >> "$GITHUB_ENV"
      - name: Execute one external AI purchase and bounded per-seat investment orders
        if: env.ARM_REAL_ORDERS == '1'
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET || secrets.OKX_SECRET_KEY }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE || secrets.OKX_PASSPHRASE }}
        run: node scripts/funded-invest-executor.mjs --phase execute --venue "$SELECTED_VENUE" --agent "$SELECTED_AGENT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: funded-invest-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: knowledge/results/funded-invest/
          retention-days: 30
      - name: Preserve actual per-order outcomes including blockers
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          mkdir -p knowledge/results/funded-invest
          node --input-type=module <<'JS'
          import fs from 'node:fs';const p='knowledge/results/funded-invest/run-'+process.env.GITHUB_RUN_ID+'-attempt-'+process.env.GITHUB_RUN_ATTEMPT+'.json';
          if(!fs.existsSync(p))fs.writeFileSync(p,JSON.stringify({at:new Date().toISOString(),status:'workflow_blocked_before_executor_receipt',execution_outcome:'not_observed',paid:false,tx_hash:null,owner_no_vpn_verified:false,run_id:process.env.GITHUB_RUN_ID},null,2)+'\n');
          JS
          git add knowledge/results/funded-invest/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Actual funded investment and external AI purchase outcomes'
          node tools/push-receipt-commit.mjs
