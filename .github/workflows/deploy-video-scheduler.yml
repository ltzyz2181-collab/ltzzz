name: Deploy authenticated video scheduler
on:
  workflow_dispatch:
  pull_request:
    paths: ['video-scheduler-worker.js','workbuddy-existing-queue.mjs','scripts/admit-existing-workbuddy-video.mjs','wrangler.video-scheduler.toml','scripts/tests/video-scheduler.test.mjs','scripts/tests/workbuddy-existing-queue.test.mjs','.github/workflows/deploy-video-scheduler.yml']
  push:
    branches: [main]
    paths: ['video-scheduler-worker.js','workbuddy-existing-queue.mjs','scripts/admit-existing-workbuddy-video.mjs','wrangler.video-scheduler.toml','scripts/tests/video-scheduler.test.mjs','scripts/tests/workbuddy-existing-queue.test.mjs','.github/workflows/deploy-video-scheduler.yml']
permissions: {contents: read}
concurrency: {group: video-scheduler-deploy, cancel-in-progress: false}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/tests/video-scheduler.test.mjs scripts/tests/video-queue-client.test.mjs scripts/tests/video-queue-only.test.mjs scripts/tests/workbuddy-existing-queue.test.mjs
  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions: {contents: write}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Deploy and reuse upload authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LTZZZ_AGENT_TOKEN: ${{ secrets.LTZZZ_AGENT_TOKEN }}
        run: |
          test -n "$LTZZZ_AGENT_TOKEN"
          npx --yes wrangler@4 deploy -c wrangler.video-scheduler.toml
          printf '%s' "$LTZZZ_AGENT_TOKEN" | npx --yes wrangler@4 secret put LTZZZ_AGENT_TOKEN -c wrangler.video-scheduler.toml
      - name: Verify deployed health without triggering upload
        run: |
          node --input-type=module <<'JS'
          let j,r;
          for(let n=0;n<20;n++){
            r=await fetch('https://ltzzz-video-scheduler.ltzyz2181.workers.dev/health');j=await r.json();
            if(j.existing_workbuddy_admission)break;
            await new Promise(resolve=>setTimeout(resolve,2000));
          }
          console.log(JSON.stringify(j));
          if(!r.ok||!j.ok||!j.existing_workbuddy_admission||!j.public_requires_verification||!j.cron_configured||!j.platforms?.youtube)process.exitCode=1;
          JS
      - name: Prepare media inspection without rendering
        run: command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Inspect the actual existing WorkBuddy MP4 and repair only missing queue metadata
        env:
          LTZZZ_AGENT_TOKEN: ${{ secrets.LTZZZ_AGENT_TOKEN }}
        run: node scripts/admit-existing-workbuddy-video.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbuddy-existing-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/publishing/workbuddy-existing-admission-*.json
          retention-days: 14
      - name: Preserve actual queue admission or precise blocker
        if: always()
        run: |
          file="results/publishing/workbuddy-existing-admission-${{ github.run_id }}-${{ github.run_attempt }}.json"
          test -f "$file" || exit 0
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add -- "$file"
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Record actual WorkBuddy media probe and existing queue readiness; no publication presumed'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
