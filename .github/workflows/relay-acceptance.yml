name: Relay proxy live acceptance

on:
  workflow_dispatch:
    inputs:
      reason:
        description: why this live probe is being run
        required: false
        default: acceptance gate for the LTZZZ relay seat
      claude_models:
        description: space separated claude-tier candidates, first working one wins (haiku is 503-unavailable and is not a default candidate)
        required: false
        default: claude-sonnet-4-6

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      LTZZZ_RELAY_PROXY_URL: https://ltzzz-relay-proxy.ltzyz2181.workers.dev/v1
      LTZZZ_RELAY_PROXY_TOKEN: ${{ secrets.RELAY_PROXY_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe gpt class through the LTZZZ worker
        run: node scripts/relay-seat.mjs --call --purpose acceptance_probe --model gpt-6.1-sol --requested-agent deepseek --prompt-file fixtures/relay-seat/long-context-probe.txt --max-tokens 64
      - name: Probe claude class through the LTZZZ worker
        run: |
          for m in ${{ inputs.claude_models }}; do
            echo "--- trying $m"
            if node scripts/relay-seat.mjs --call --purpose acceptance_probe --model "$m" --requested-agent deepseek --prompt-file fixtures/relay-seat/long-context-probe.txt --max-tokens 64; then
              echo "CLAUDE_SUCCESS_MODEL=$m"
              break
            fi
            echo "CLAUDE_UNAVAILABLE_MODEL=$m"
          done
      - name: Network failure mode probe
        continue-on-error: true
        env:
          LTZZZ_RELAY_PROXY_URL: https://relay-proxy-unreachable.invalid/v1
        run: |
          node scripts/relay-seat.mjs --call --purpose acceptance_probe --model gpt-6.1-sol --requested-agent deepseek --prompt-file fixtures/relay-seat/long-context-probe.txt --max-tokens 8 || echo "NETWORK_FAILURE_PROBE_RECORDED_AS_FAILURE=true"
      - name: Print sanitized call evidence
        if: always()
        run: |
          for f in knowledge/results/relay-seat/calls/*.json; do
            [ -e "$f" ] || continue
            echo "EVIDENCE_FILE=$f"
            cat "$f"
          done
