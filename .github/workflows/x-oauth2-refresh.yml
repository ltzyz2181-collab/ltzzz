name: X OAuth2 token refresh (rotate into worker secrets)
on: { workflow_dispatch: {} }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          TOKEN: ${{ secrets.LTZZZ_AGENT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -s -m 30 -X POST -H "Authorization: Bearer $TOKEN" https://x.ltzzz.com/refresh > /tmp/r.json
          node -e "const j=require('/tmp/r.json');const d=j.data||{};if(d.access_token){console.log('::add-mask::'+d.access_token)};if(d.refresh_token){console.log('::add-mask::'+d.refresh_token)};console.log('REFRESH',JSON.stringify({http:j.http,ok:j.ok,error:d.error,desc:d.error_description,got_access:!!d.access_token,got_refresh:!!d.refresh_token,scope:d.scope}));if(d.access_token){require('fs').writeFileSync('/tmp/s.json',JSON.stringify(Object.assign({X_USER_TOKEN:d.access_token},d.refresh_token?{X_REFRESH_TOKEN:d.refresh_token}:{})))}"
          if [ -f /tmp/s.json ]; then npx --yes wrangler@4 secret bulk /tmp/s.json -c wrangler.x-poster.toml; rm /tmp/s.json; fi
          rm -f /tmp/r.json
          sleep 5
          curl -s -m 30 -H "Authorization: Bearer $TOKEN" https://x.ltzzz.com/me | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log('ME2',JSON.stringify({o2:j.oauth2&&{http:j.oauth2.http,u:j.oauth2.body?.data?.username}}))})"
