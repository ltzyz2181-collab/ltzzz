name: Treasury migration and 1 USDC pilot
# Completed one-off pilot. This channel now performs read-only follow-up only.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/treasury-migration-and-pilot.yml', 'scripts/record-treasury-inspection.mjs']
permissions:
  contents: write
concurrency:
  group: ltzzz-treasury-migration
  cancel-in-progress: false
jobs:
  inspect-pilot:
    runs-on: ubuntu-latest
    env:
      AAVE_EXPECTED_REVISION: aave-guard-v5
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Derive existing service identity for authenticated read-only endpoints
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import crypto from 'node:crypto';
          if(!process.env.CLOUDFLARE_API_TOKEN)throw Error('service_identity_not_configured');
          const token=crypto.createHmac('sha256',process.env.CLOUDFLARE_API_TOKEN).update('ltzzz-runner-v2').digest('hex');
          console.log('::add-mask::'+token);fs.appendFileSync(process.env.GITHUB_ENV,'WEP3_RUNNER_TOKEN='+token+'\n');
          JS
      - name: Inspect persisted intent without signing or broadcasting
        id: diagnose
        continue-on-error: true
        env: {AAVE_ACTION: diagnose}
        run: node scripts/run-treasury-aave.mjs
      - name: Read current Aave status
        id: snapshot
        continue-on-error: true
        env: {AAVE_ACTION: status}
        run: node scripts/run-treasury-aave.mjs
      - name: Reconcile existing receipts without rebroadcasting
        id: reconcile
        continue-on-error: true
        env: {AAVE_ACTION: reconcile}
        run: node scripts/run-treasury-aave.mjs
      - name: Record inspection outcome even when RPC fails
        if: always()
        env:
          TREASURY_DIAGNOSE_OUTCOME: ${{ steps.diagnose.outcome }}
          TREASURY_SNAPSHOT_OUTCOME: ${{ steps.snapshot.outcome }}
          TREASURY_RECONCILE_OUTCOME: ${{ steps.reconcile.outcome }}
        run: node scripts/record-treasury-inspection.mjs
      - name: Retain evidence independently of git push
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treasury-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            knowledge/results/wep3/aave-*${{ github.run_id }}.json
            knowledge/results/migrations/inspection-${{ github.run_id }}-*.json
          if-no-files-found: error
      - name: Commit all inspection receipts
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/migrations/ knowledge/results/wep3/
          git diff --staged --quiet && exit 0
          git commit -m "Treasury read-only follow-up; preserve failed RPC observations"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Keep failed inspection visible after saving evidence
        if: always() && (steps.diagnose.outcome != 'success' || steps.snapshot.outcome != 'success' || steps.reconcile.outcome != 'success')
        run: exit 1
