name: Dispatch Sentinel (派单哨兵 · 每小时)

# WorkBuddy 职责的自动化落地（owner 2026-10-08 指令）：
#   「Workbuddy 负责派单跟踪、超时和阻塞汇总。…每小时扫描若未配置请明说。」
# 特性：
#   - 无 AI key 依赖（纯 node + git）
#   - 状态一律以仓库交付/运行证据为准
#   - 任一检查项证据缺失 → 记 UNKNOWN 并明说，不假装通过
#   - 有超时/阻塞/未配置 → 工作流红灯 + Step Summary 汇总

on:
  push:
    branches: [main]
    paths: ['scripts/dispatch-sentinel.mjs', '.github/workflows/dispatch-sentinel.yml']
  pull_request:
    paths: ['scripts/dispatch-sentinel.mjs','scripts/tests/dispatch-sentinel.test.mjs','.github/workflows/dispatch-sentinel.yml']
  schedule:
    - cron: '0 * * * *'   # 每小时
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ltzzz-dispatch-sentinel
  cancel-in-progress: false

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify exact task and nested receipt matching
        run: node --test scripts/tests/dispatch-sentinel.test.mjs

      - name: 运行派单哨兵
        if: github.event_name != 'pull_request'
        id: scan
        run: |
          set +e
          node scripts/dispatch-sentinel.mjs > /tmp/sentinel.out 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/sentinel.out
          # 汇总到 Step Summary
          {
            echo "## 派单哨兵"
            echo ""
            cat /tmp/sentinel.out
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 落盘
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "ltzzz-sentinel"
          git config user.email "bot@ltzzz.local"
          git add memory/sentinel/ knowledge/results/dispatch/sentinel-latest.json
          if git diff --staged --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "sentinel: 派单哨兵 $(TZ=Asia/Shanghai date +%F' '%H:00)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: 报警（有超时/阻塞/未配置时）
        if: github.event_name != 'pull_request'
        run: |
          OUT=$(cat /tmp/sentinel.out)
          if echo "$OUT" | grep -qE 'alert-items\] .*(MISSING|BLOCKED|UNCONFIGURED|UNKNOWN)'; then
            echo "::error::派单哨兵发现需处理项：$(echo "$OUT" | grep 'alert-items')"
            exit 1
          fi
          echo "::notice::派单哨兵本轮全部正常"
