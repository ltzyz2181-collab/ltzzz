name: Dispatch Sentinel (派单哨兵 · 每小时)

# WorkBuddy 职责的自动化落地（owner 2026-10-08 指令）：
#   「Workbuddy 负责派单跟踪、超时和阻塞汇总。…每小时扫描若未配置请明说。」
# 唯一监督状态写入者；外部派单器只生成卡片，避免并发改写同一latest/warnings。
# 特性：
#   - 无 AI key 依赖（纯 node + git）
#   - 状态一律以仓库交付/运行证据为准
#   - 任一检查项证据缺失 → 记 UNKNOWN 并明说，不假装通过
#   - 有超时/阻塞/未配置 → 工作流红灯 + Step Summary 汇总

on:
  push:
    branches: [main]
    paths: ['scripts/dispatch-sentinel.mjs','scripts/generate-external-daily.mjs','scripts/lib/dispatch-oversight.mjs','scripts/lib/seat-delivery.mjs','scripts/watchdog-summary.mjs','identity/seat-registry.json','scripts/record-sentinel-coverage.mjs','scripts/lib/sentinel-coverage.mjs','.github/workflows/dispatch-sentinel.yml']
  pull_request:
    paths: ['scripts/dispatch-sentinel.mjs','scripts/generate-external-daily.mjs','scripts/lib/dispatch-oversight.mjs','scripts/lib/seat-delivery.mjs','scripts/watchdog-summary.mjs','identity/seat-registry.json','scripts/record-sentinel-coverage.mjs','scripts/lib/sentinel-coverage.mjs','scripts/tests/audit-evidence.test.mjs','scripts/tests/dispatch-sentinel.test.mjs','scripts/tests/dispatch-oversight.test.mjs','scripts/tests/seat-delivery.test.mjs','.github/workflows/dispatch-sentinel.yml']
  schedule:
    - cron: '0 * * * *'   # 每小时
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ltzzz-dispatch-sentinel
  cancel-in-progress: false

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify exact task and nested receipt matching
        run: node --test scripts/tests/dispatch-sentinel.test.mjs scripts/tests/audit-evidence.test.mjs scripts/tests/dispatch-oversight.test.mjs scripts/tests/seat-delivery.test.mjs

      - name: 运行派单哨兵
        if: github.event_name != 'pull_request'
        id: scan
        run: |
          node scripts/dispatch-sentinel.mjs > /tmp/sentinel.out 2>&1
          cat /tmp/sentinel.out
          # 汇总到 Step Summary
          {
            echo "## 派单哨兵"
            echo ""
            cat /tmp/sentinel.out
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read observed Actions runs and persistence steps, no model calls
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/record-sentinel-coverage.mjs

      - name: 落盘
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "ltzzz-sentinel"
          git config user.email "bot@ltzzz.local"
          git add memory/sentinel/ knowledge/results/dispatch/sentinel-latest.json knowledge/results/dispatch/sentinel-runs/ knowledge/results/dispatch/sentinel-coverage/ knowledge/results/dispatch/oversight/ ops/dispatch/oversight/
          if git diff --staged --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "sentinel: 派单哨兵 $(TZ=Asia/Shanghai date +%F' '%H:00)"
          node tools/push-receipt-commit.mjs

      - name: 报警（有超时/阻塞/未配置时）
        if: github.event_name != 'pull_request'
        run: |
          OUT=$(cat /tmp/sentinel.out)
          if echo "$OUT" | grep -qE 'alert-items\] .*(MISSING|BLOCKED|UNCONFIGURED|UNKNOWN)'; then
            echo "::warning::扫描及落盘已完成，业务待处理项：$(echo "$OUT" | grep 'alert-items')"
            exit 0
          fi
          echo "::notice::派单哨兵本轮全部正常"

      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request'
        with:
          name: sentinel-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            knowledge/results/dispatch/oversight/
            ops/dispatch/oversight/
            knowledge/results/dispatch/sentinel-runs/
            knowledge/results/dispatch/sentinel-coverage/
          retention-days: 30
