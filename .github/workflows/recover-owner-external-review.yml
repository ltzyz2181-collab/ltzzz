name: Recover one failed owner delivery review (no purchase)
on:
  workflow_dispatch:
  pull_request:
    paths: ['wep3-procurement-review.js','scripts/lib/daily-external-hire.mjs','scripts/call-doubao.mjs','scripts/recover-owner-external-review.mjs','scripts/tests/daily-external-hire.test.mjs','.github/workflows/recover-owner-external-review.yml']
permissions: {contents: read}
concurrency: {group: wep3-deploy-and-accept, cancel-in-progress: false}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check scripts/recover-owner-external-review.mjs
      - run: node --test scripts/tests/daily-external-hire.test.mjs scripts/tests/owner-external-hire.test.mjs scripts/tests/funded-relay.test.mjs scripts/tests/wep3-procurement.test.mjs scripts/tests/claude-review.test.mjs
  review:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'ltzyz2181-collab' && github.repository == 'ltzyz2181-collab/ltzzz'
    needs: tests
    permissions: {contents: write}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/recover-owner-external-review.mjs prepare
      - name: Commit bounded recovery before calling model
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/owner-external/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'One review-only recovery claim for existing paid delivery'
          node tools/push-receipt-commit.mjs
      - name: One native Doubao recovery, no external purchase call
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: node scripts/recover-owner-external-review.mjs execute
      - name: Preserve recovery result and original failure
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/owner-external/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Actual independent review recovery without another purchase'
          node tools/push-receipt-commit.mjs
