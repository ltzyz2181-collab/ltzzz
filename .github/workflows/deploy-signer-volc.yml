name: Deploy LTZZZ Signer (Volcengine)

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'list | deploy | challenge'
        required: true
        default: 'list'

permissions:
  contents: read

jobs:
  signer:
    runs-on: ubuntu-latest
    env:
      VOLC_ACCESS_KEY: ${{ secrets.VOLC_ACCESS_KEY }}
      VOLC_SECRET_KEY: ${{ secrets.VOLC_SECRET_KEY }}
      ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
      SIGNER_EXECUTOR_ID: doubao-vefaas
      SIGNER_CLOUD_ACCOUNT_BINDING: volcengine:ltzyz2181-collab
      SIGNER_DEFAULT_MODEL: doubao-seed-1-6-250615
      SIGNER_DAILY_LIMIT: '20'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate credentials (ListFunctions)
        if: ${{ inputs.stage == 'list' }}
        run: node scripts/signer-volc-deploy.mjs list

      - name: Deploy signer function
        if: ${{ inputs.stage == 'deploy' }}
        run: |
          set -euo pipefail
          cd cloud/signer-volc-attest
          python3 - <<'PY'
          import glob, hashlib, json, zipfile
          files = sorted(f for f in glob.glob('*') if f != 'function.zip')
          with zipfile.ZipFile('function.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for f in files:
                  z.write(f)
          parts = [{'path': f, 'sha256': hashlib.sha256(open(f, 'rb').read()).hexdigest()} for f in files]
          src_sha = hashlib.sha256(json.dumps(parts, sort_keys=True).encode()).hexdigest()
          ev = {'function': 'ltzzz-signer-volc-attest', 'source_sha256': src_sha,
                'deployed_at_utc': __import__('datetime').datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
                'cloud_account_binding': 'volcengine:ltzyz2181-collab'}
          ev_sha = hashlib.sha256(json.dumps(ev, sort_keys=True).encode()).hexdigest()
          with open('env.json', 'w') as f:
              json.dump({'SOURCE_SHA': src_sha, 'EVIDENCE_SHA': ev_sha}, f)
          print('SOURCE_SHA256=' + src_sha)
          print('EVIDENCE_SHA256=' + ev_sha)
          PY
          cd ../..
          export SIGNER_SOURCE_SHA256=$(python3 -c "import json;print(json.load(open('cloud/signer-volc-attest/env.json'))['SOURCE_SHA'])")
          export SIGNER_EVIDENCE_SHA256=$(python3 -c "import json;print(json.load(open('cloud/signer-volc-attest/env.json'))['EVIDENCE_SHA'])")
          node scripts/signer-volc-deploy.mjs deploy cloud/signer-volc-attest/function.zip

      - name: Get deployed function
        if: ${{ inputs.stage == 'challenge' }}
        run: node scripts/signer-volc-deploy.mjs get
