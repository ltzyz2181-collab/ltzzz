name: Volc signer readiness (default off, no deployment)
on:
  pull_request:
    paths: ['cloud/signer-volc-attest/**','scripts/lib/volc-openapi.mjs','scripts/signer-volc-deploy.mjs','scripts/build-volc-signer-release.mjs','scripts/tests/volc-signer-closeout.test.mjs','.github/workflows/deploy-signer-volc.yml']
  workflow_dispatch:
    inputs:
      stage:
        description: 'Read-only list/function/detail probe; neither deploys nor proves a restart challenge'
        type: choice
        required: true
        default: list
        options: [list, get, detail]
      function_id:
        description: 'Actual VeFaaS Id returned by list (required for get/detail)'
        type: string
        required: false
permissions: {contents: read}
concurrency:
  group: volc-signer-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Synthetic tests only, no provider/model credentials
        run: node --test scripts/tests/volc-signer-closeout.test.mjs scripts/tests/patchgate-model-attestation.test.mjs scripts/tests/patchgate-oidc.test.mjs scripts/tests/patchgate-signer-source.test.mjs scripts/tests/patchgate-attestation-evidence.test.mjs
      - name: Build fixed Git source closure without generating a private key
        run: node scripts/build-volc-signer-release.mjs /tmp/ltzzz-volc-candidate
  credential_readback:
    needs: offline
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Read-only VeFaaS probe; no IAM user enumeration or credential output
        env:
          VOLC_ACCESS_KEY: ${{ secrets.VOLC_ACCESS_KEY }}
          VOLC_SECRET_KEY: ${{ secrets.VOLC_SECRET_KEY }}
          PROBE_STAGE: ${{ inputs.stage }}
          SIGNER_FUNCTION_ID: ${{ inputs.function_id }}
        run: node scripts/signer-volc-deploy.mjs "$PROBE_STAGE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: volc-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/volc-signer/preflight.json
          if-no-files-found: error
          retention-days: 30
