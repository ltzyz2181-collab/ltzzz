name: Kimi Global Weekly no API key task packet
on:
  schedule:
    - cron: '0 1 * * 1' # UTC 周一01:00 = Asia/Shanghai 周一09:00
  push:
    branches: [main]
    paths: ['scripts/kimi-global-no-key.mjs', '.github/workflows/kimi-global-weekly.yml']
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: ltzzz-kimi-global-no-key
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read actual memory and issue an external agent task without any model API
        run: node scripts/kimi-global-no-key.mjs
      - name: Commit task packet, never claim model delivery
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add ltzzz-memory/kimi-weekly/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'dispatch no-key kimi-global weekly task packet'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
