name: Verified models and six-memory discussion
on:
  workflow_dispatch:
  schedule:
    - cron: '20 11 * * 1-4'
  push:
    branches: [main]
    paths: ['.github/workflows/model-memory-discussion.yml','scripts/run-model-memory-discussion.mjs','scripts/model-routing.mjs']
permissions: {contents: write}
concurrency: {group: ltzzz-model-memory-discussion, cancel-in-progress: false}
jobs:
  discussion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/tests/model-routing.test.mjs
      - name: Real model execution (explicit push marker; staggered weekly seats)
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-memory-review]')
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY || secrets.ARK_API_KEY }}
          DOUBAO_BASE_URL: ${{ vars.DOUBAO_BASE_URL || secrets.DOUBAO_BASE_URL }}
          DEEPSEEK_MODEL_OVERRIDE: ${{ vars.DEEPSEEK_MODEL }}
          DOUBAO_MODEL_OVERRIDE: ${{ vars.DOUBAO_MODEL }}
          ANTHROPIC_MODEL_OVERRIDE: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOONSHOT_API_KEY_CN: ${{ secrets.MOONSHOT_API_KEY_CN }}
          LTZZZ_AGENT_TOKEN: ${{ secrets.LTZZZ_AGENT_TOKEN }}
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$(date -u +%u)" in
              1) export DISCUSSION_SEATS=deepseek ;;
              2) export DISCUSSION_SEATS=doubao ;;
              3) export DISCUSSION_SEATS=kimi_cn ;;
              4) export DISCUSSION_SEATS=claude ;;
            esac
          fi
          node scripts/run-model-memory-discussion.mjs
      - name: Save real outputs and verified routing
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/model-discussion/ data/model-routing/ || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Actual model selection and six-memory discussion receipts'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
