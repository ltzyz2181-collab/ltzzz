name: Daily DeepSeek Doubao hire and investment data
on:
  push:
    branches: [main]
    paths: ['scripts/run-daily-economy.mjs', '.github/workflows/daily-economy.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ltzzz-daily-economy
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: DeepSeek dispatch and Doubao delivery
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          DOUBAO_MODEL: ${{ secrets.DOUBAO_MODEL }}
          DOUBAO_BASE_URL: ${{ vars.DOUBAO_BASE_URL }}
        run: node scripts/run-daily-economy.mjs
      - name: Preserve all actual receipts
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/economy/ knowledge/results/hire/ knowledge/results/invest/ ltzzz-memory/tasks/ knowledge/assets/economy/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'daily DeepSeek Doubao actual delegation and investment proposals'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
