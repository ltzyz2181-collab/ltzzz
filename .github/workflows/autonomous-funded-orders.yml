name: Autonomous funded LTZZZ orders
on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['scripts/lib/signer-readiness.mjs','scripts/preflight-signer.mjs','scripts/run-treasury-aave.mjs','scripts/anchor-market-snapshot.mjs','scripts/tests/signer-readiness.test.mjs','.github/workflows/autonomous-funded-orders.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/autonomous-funded-orders.yml','scripts/lib/signer-readiness.mjs','scripts/preflight-signer.mjs','scripts/run-treasury-aave.mjs','scripts/anchor-market-snapshot.mjs']
permissions: {contents: write}
concurrency: {group: wep3-deploy-and-accept, cancel-in-progress: false}
jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Offline signer-gate regression (no network, no funds)
        run: node --test scripts/tests/signer-readiness.test.mjs
  execute:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - name: Install short-lived runner authentication without manual Secret handling
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node - <<'JS'
          const fs=require('fs'),crypto=require('crypto');const token=crypto.createHmac('sha256',process.env.CLOUDFLARE_API_TOKEN).update('ltzzz-runner-v2').digest('hex');console.log('::add-mask::'+token);fs.appendFileSync(process.env.GITHUB_ENV,'WEP3_RUNNER_TOKEN='+token+'\n');fs.writeFileSync('/tmp/ltzzz-runner-secret.json',JSON.stringify({WEP3_RUNNER_TOKEN:token}),{mode:0o600});
          JS
          npx wrangler@4 secret bulk /tmp/ltzzz-runner-secret.json -c wrangler.wep3.toml
          node -e "require('fs').unlinkSync('/tmp/ltzzz-runner-secret.json')"
      - name: Execute at most one funded order
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY || secrets.ARK_API_KEY }}
          DOUBAO_MODEL: ${{ vars.DOUBAO_MODEL }}
          DOUBAO_BASE_URL: ${{ vars.DOUBAO_BASE_URL || secrets.DOUBAO_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          NODE_OPTIONS: --dns-result-order=ipv4first
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: node scripts/fulfill-market-orders.mjs
      - name: Preflight treasury signer capability (read-only, no funding attempt)
        id: signer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/preflight-signer.mjs
      - name: Bounded Aave cycle (skipped unless signer capability is proven)
        if: steps.signer.outputs.state == 'ready'
        run: node scripts/run-treasury-aave.mjs
      - name: Weekly public snapshot anchoring with Worker treasury signer
        if: steps.signer.outputs.state == 'ready'
        run: node scripts/anchor-market-snapshot.mjs
      - name: Report funding-step outcome without masking order fulfilment
        if: always()
        run: |
          state="${{ steps.signer.outputs.state }}"
          blocked="${{ steps.signer.outputs.blocked_status }}"
          echo "signer_state=${state:-missing-output} blocked_status=${blocked:-unknown}"
          if [ "$state" != "ready" ]; then
            echo "::error::Funding steps skipped (${blocked:-blocked_signer_unverified}); signer capability not proven. Order fulfilment receipt is preserved separately and is not a green funding result."
            exit 1
          fi
      - name: Save actual receipts
        if: always()
        run: |
          git config user.name ltzzz-bot
          git config user.email bot@ltzzz.com
          git add knowledge/results/wep3/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Autonomous funded-order and snapshot evidence'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
