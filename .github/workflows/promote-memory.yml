name: Promote Memory Candidates

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/promote-memory.mjs
      - name: Commit queue
        run: |
          git config user.name "ltzzz-promote"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory/promote
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(memory): refresh promotion candidates"
          git pull --rebase origin main || true
          git push origin HEAD:main
