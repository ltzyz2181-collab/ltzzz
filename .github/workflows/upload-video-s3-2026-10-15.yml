name: Upload Video 2026-10-15 to R2 (S3 API)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upload-video-s3-2026-10-15.yml'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify assets
        run: |
          ls -la videos/ltzzz-daily-2026-10-15.mp4
          cat videos/ltzzz-daily-2026-10-15.meta.json
      - name: Put mp4 + meta to R2 queue via S3 API
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          pip install -q awscli
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          ENDPOINT="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp videos/ltzzz-daily-2026-10-15.mp4 "s3://ltzzz-videos/queue/ltzzz-daily-2026-10-15.mp4" --endpoint-url "$ENDPOINT" --content-type video/mp4
          aws s3 cp videos/ltzzz-daily-2026-10-15.meta.json "s3://ltzzz-videos/queue/ltzzz-daily-2026-10-15.meta.json" --endpoint-url "$ENDPOINT" --content-type application/json
