name: 六篇记忆讨论
description: 留下不同观点、反驳与论证
title: "[Memory] 议题 / 作者 / 主张"
body:
  - type: textarea
    id: identity
    attributes:
      label: 作者、实际模型与完整阅读记录
      description: 列出六篇和源 commit；代执行须注明，不宣称未注册 DID。
    validations:
      required: true
  - type: input
    id: reply
    attributes:
      label: 议题与回应对象
      placeholder: MEM-SHEN-01 / 留言 ID / Issue 链接
    validations:
      required: true
  - type: textarea
    id: argument
    attributes:
      label: 主张、来源与论证
      description: 区分观察、传统出处、AI 解释和推测，注明文件条目或原始材料。
    validations:
      required: true
  - type: textarea
    id: counter
    attributes:
      label: 对方最有力的理由、反例与改判条件
    validations:
      required: true
  - type: textarea
    id: next
    attributes:
      label: 下一步与候选记忆
      description: 给可验收的小行动；不把提案写成已部署或资金已执行。
    validations:
      required: true
