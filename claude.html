<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude AI 对话 · LTZZZ</title>
<link rel="stylesheet" href="style.css">
<style>
.wrap{max-width:800px;margin:0 auto;padding:88px 5vw 60px}
.banner{background:#1a1025;border:1px solid #4a2a6a;color:#e0c8ff;border-radius:12px;padding:12px 16px;font-size:13px;margin-bottom:20px;line-height:1.6}
.panel{background:#fff;border:1px solid #ddd8ce;border-radius:16px;padding:20px}
label{display:block;font-size:13px;color:#666;margin:10px 0 6px}
input,textarea{width:100%;padding:10px 12px;border:1px solid #ddd8ce;border-radius:10px;font-size:14px;box-sizing:border-box}
textarea{min-height:90px;resize:vertical}
.chat{height:320px;overflow:auto;background:#faf9f6;border:1px solid #eee;border-radius:12px;padding:12px;margin:12px 0;font-size:14px}
.msg{margin:0 0 10px;padding:8px 10px;border-radius:8px;line-height:1.5;white-space:pre-wrap}
.msg.user{background:#e8f5e9;border-left:3px solid #2e7d32}
.msg.ai{background:#f3e8ff;border-left:3px solid #6d28d9}
.msg.err{background:#ffebee;border-left:3px solid #c62828}
.msg .who{font-weight:700;font-size:12px;margin-bottom:4px}
.back{display:inline-block;margin-bottom:16px;color:#333;text-decoration:none}
code{background:#f0f0f0;padding:2px 6px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<header class="nav">
  <div class="brand">LTZZZ <span>Claude AI</span></div>
  <nav>
    <a href="index.html">首页</a>
    <a href="deepseek.html">DeepSeek</a>
    <a href="agi-lab.html">共同实验室</a>
  </nav>
</header>
<div class="wrap">
  <a class="back" href="index.html">← 返回</a>
  <div class="banner">
    本页通过<strong>你自己的 Cloudflare Worker 代理</strong>调用 Claude（Anthropic Messages API，对应 Python 示例中的 <code>client.messages.create</code>）。
    API Key 只放在 Worker 的 Secret 里，不要写进网站代码。
    代理脚本见仓库根目录 <code>claude-proxy-worker.js</code>。
  </div>

  <div class="panel">
    <label>你的 Worker 地址（末尾不要斜杠）</label>
    <input id="endpoint" placeholder="https://你的-worker.你的域名.workers.dev">
    <label>模型</label>
    <input id="model" value="claude-sonnet-5">
    <div class="chat" id="chat"></div>
    <label>消息</label>
    <textarea id="input" placeholder="输入问题后点发送"></textarea>
    <button class="button primary" type="button" id="send" style="margin-top:10px">发送</button>
    <button class="button" type="button" id="clear" style="margin-top:10px;margin-left:8px">清空</button>
  </div>
</div>
<footer>© 2026 LTZZZ · Claude 对话需自备 Worker 代理</footer>
<script>
(function () {
  const chat = document.getElementById('chat');
  const history = [];

  function add(cls, who, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.innerHTML = '<div class="who">' + who + '</div>' + String(text).replace(/</g, '&lt;');
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }

  document.getElementById('clear').onclick = function () {
    chat.innerHTML = '';
    history.length = 0;
  };

  document.getElementById('send').onclick = async function () {
    const text = document.getElementById('input').value.trim();
    if (!text) return;
    const base = document.getElementById('endpoint').value.trim().replace(/\/$/, '');
    const model = document.getElementById('model').value.trim() || 'claude-sonnet-5';
    if (!base) { alert('请填写 Worker 地址'); return; }
    add('user', '你', text);
    document.getElementById('input').value = '';
    history.push({ role: 'user', content: text });

    try {
      const res = await fetch(base, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: model,
          messages: history.slice(-12),
          max_tokens: 1024,
          system: '你是 LTZZZ 数字实验室的研究助手。回答要具体、可验证、少空话。'
        })
      });
      const data = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        const errMsg = (data && (data.error && (data.error.message || data.error.type))) || ('HTTP ' + res.status);
        add('err', '错误', errMsg);
        return;
      }
      const blocks = data.content || [];
      const reply = blocks.map(function (b) { return b.text || ''; }).join('').trim();
      if (!reply) { add('err', '错误', '响应无内容'); return; }
      history.push({ role: 'assistant', content: reply });
      add('ai', 'Claude', reply);
    } catch (e) {
      add('err', '错误', '无法连接 Worker：' + (e.message || e) + '。请确认 Worker 已部署且允许跨域（脚本已带 CORS）。');
    }
  };
})();
</script>
</body>
</html>
