<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LTZZZ Treasury REAL</title>
<style>
:root { --bg:#0b0b12; --card:#14141f; --line:#2a2a3d; --ok:#3dffa8; --bad:#ff5c7a; --muted:#8b8ba0; --accent:#6c8cff; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:#eee; }
.wrap { max-width:960px; margin:0 auto; padding:20px 16px 48px; }
h1 { font-size:1.35rem; margin:0 0 6px; }
.muted { color:var(--muted); font-size:.9rem; }
.grid { display:grid; gap:12px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); margin-top:14px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
.card h3 { margin:0 0 6px; font-size:.95rem; }
.big { font-size:1.4rem; font-weight:700; }
.ok { color:var(--ok); } .bad { color:var(--bad); }
.bar { height:8px; background:#222; border-radius:4px; overflow:hidden; margin-top:8px; }
.bar > i { display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--ok)); }
a { color:var(--accent); }
pre { background:#0a0a10; padding:12px; border-radius:8px; overflow:auto; font-size:.78rem; }
</style>
</head>
<body>
<div class="wrap">
  <p class="muted"><a href="/">首页</a> · Safe 不变 · 3/5 多签 · 无 Worker 私钥</p>
  <h1>LTZZZ Treasury</h1>
  <div class="grid" id="stats"></div>
  <div class="grid" id="agents"></div>
  <div class="card" style="margin-top:14px">
    <h3>阶段报告 · 回归 TxHash</h3>
    <pre id="raw">loading…</pre>
  </div>
</div>
<script>
const API = 'https://ltzzz-treasury-v11.ltzyz2181.workers.dev';
async function load() {
  const [d, h, reg] = await Promise.all([
    fetch(API + '/dashboard').then(r => r.json()),
    fetch(API + '/health').then(r => r.json()),
    fetch(API + '/regression').then(r => r.json()),
  ]);
  const c = d.counts || {};
  document.getElementById('stats').innerHTML = [
    ['今日支出', (d.today_spend ?? 0) + ' U'],
    ['今日剩余额度', (d.today_remaining_limit ?? 0) + ' U'],
    ['待执行', c.pending ?? 0],
    ['成功', c.success ?? 0],
    ['失败', c.failed ?? 0],
    ['真实成功笔数', d.real_tx_success_count ?? 0],
  ].map(([t,v]) => '<div class="card"><h3>'+t+'</h3><div class="big">'+v+'</div></div>').join('');

  const g = document.getElementById('agents');
  g.innerHTML = Object.entries(d.agents || {}).map(([name, u]) => {
    const pct = Math.min(100, Math.round((u.used / (u.daily_limit || 1)) * 100));
    return '<div class="card"><h3>'+name+'</h3><div>已用 <b>'+u.used+'</b> / '+u.daily_limit+
      '</div><div class="muted">单笔≤'+u.single_limit+' · 剩 '+u.remaining+
      '</div><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  }).join('');

  document.getElementById('raw').textContent = JSON.stringify({
    report: h.report,
    regression_tx: d.regression_tx,
    regression: reg,
    safe: d.safe,
  }, null, 2);
}
load().catch(e => { document.getElementById('raw').textContent = String(e); });
</script>
</body>
</html>
