name = "ltzzz-memory-engine"
main = "memory-engine-worker.js"
compatibility_date = "2026-09-21"

# No CF cron here — free-plan quota. Snapshot via GitHub Actions Memory OS State.
[vars]
GATEWAY_URL = "https://ltzzz-memory-gateway.ltzyz2181.workers.dev"

[[r2_buckets]]
binding = "MEMORY_BUCKET"
bucket_name = "ltzzz-memory"
