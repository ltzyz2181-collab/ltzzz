<link rel="stylesheet" href="style.css">

body{background:#020817;color:#eef8ff}
.agi-wrap{max-width:1100px;margin:auto;padding:24px}

.agi-hero img{display:block;width:100%;height:auto}
.agi-copy{padding:36px 4px}

.agi-card{padding:22px;border:1px solid #164a70;border-radius:18px;background:linear-gradient(145deg,#071a31,#07101f)}

.button{display:inline-block;padding:10px 16px;border-radius:999px;border:1px solid #2a6688;color:#eef8ff;text-decoration:none;margin-top:10px;font-size:14px}
