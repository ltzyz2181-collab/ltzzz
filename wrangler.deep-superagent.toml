name = "ltzzz-deep-superagent"
main = "workers/deep-superagent/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Third-party relay execution seats (gpt / claude). This Worker holds only the
# scoped proxy token (secret RELAY_PROXY_TOKEN) and calls the LTZZZ relay proxy;
# the station key lives solely in that proxy's server secret. A direct station
# key here is refused as relay_direct_station_key_forbidden.
# Every relayed call declares x-ltzzz-batch: 1 (batch items, not interactive).
[vars]
RELAY_PROXY_URL = "https://ltzzz-relay-proxy.ltzyz2181.workers.dev/v1"
RELAY_ACCEPTANCE_VERIFIED = "1"
RELAY_MODEL_GPT = "gpt-6.1-sol"
RELAY_MODEL_CLAUDE = "claude-sonnet-4-6"

# No model keys, financial bindings, cron or access to either existing ledger.
# SUPERAGENT_SOURCE_COMMIT is injected by the trusted-main deployment executor.
[[services]]
binding = "DEEPSEEK"
service = "ltzzz-deepseek-proxy"

[[services]]
binding = "DOUBAO"
service = "ltzzz-doubao-proxy"

[[services]]
binding = "QIANWEN"
service = "ltzzz-qianwen-proxy"

[[services]]
binding = "KIMI"
service = "ltzzz-kimi-proxy"

[[services]]
binding = "GROK"
service = "ltzzz-xai-proxy"

[[durable_objects.bindings]]
name = "TASKS"
class_name = "DeepTask"

[[migrations]]
tag = "deep-task-v1"
new_sqlite_classes = ["DeepTask"]
