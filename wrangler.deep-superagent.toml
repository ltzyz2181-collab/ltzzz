name = "ltzzz-deep-superagent"
main = "workers/deep-superagent/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Third-party relay execution seats (gpt / claude) stay CLOSED by default.
# Order of activation: inject RELAY_API_KEY (secret) -> run the acceptance probe
# -> set RELAY_MODEL_GPT / RELAY_MODEL_CLAUDE -> flip RELAY_ACCEPTANCE_VERIFIED to "1".
# Any missing piece reports its own state in /health and /v1/status instead of
# silently falling back to a native provider channel.
[vars]
RELAY_BASE_URL = "https://api.apisrouter.com/v1"
RELAY_ACCEPTANCE_VERIFIED = "0"
RELAY_MODEL_GPT = ""
RELAY_MODEL_CLAUDE = ""

# No model keys, financial bindings, cron or access to either existing ledger.
# SUPERAGENT_SOURCE_COMMIT is injected by the trusted-main deployment executor.
[[services]]
binding = "DEEPSEEK"
service = "ltzzz-deepseek-proxy"

[[services]]
binding = "DOUBAO"
service = "ltzzz-doubao-proxy"

[[services]]
binding = "QIANWEN"
service = "ltzzz-qianwen-proxy"

[[services]]
binding = "KIMI"
service = "ltzzz-kimi-proxy"

[[services]]
binding = "GROK"
service = "ltzzz-xai-proxy"

[[durable_objects.bindings]]
name = "TASKS"
class_name = "DeepTask"

[[migrations]]
tag = "deep-task-v1"
new_sqlite_classes = ["DeepTask"]
