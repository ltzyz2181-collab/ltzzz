<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LTZZZ 数字产品商店</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0a0f; color: #fff; line-height: 1.6; }
.nav { max-width: 1200px; margin: 0 auto; padding: 16px 20px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.nav a { color: #00f0ff; text-decoration: none; font-size: .95rem; }
.container { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }
h1 { text-align: center; font-size: clamp(1.6rem, 4vw, 2.5rem); margin-bottom: 10px; background: linear-gradient(90deg, #00f0ff, #ff00e5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.subtitle { text-align: center; color: #888; margin-bottom: 36px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 20px; }
.card { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 10px; }
.card:hover { border-color: #00f0ff; }
.category { font-size: 0.8rem; color: #00f0ff; letter-spacing: 1px; }
.name { font-size: 1.2rem; font-weight: 600; }
.price-row { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.price { font-size: 1.6rem; font-weight: 700; color: #ff00e5; }
.usd { color: #888; font-size: .95rem; }
.desc { color: #aaa; font-size: 0.95rem; flex: 1; }
.btn { display: inline-block; text-align: center; background: linear-gradient(90deg,#00f0ff,#7c5cff); color: #000; font-weight: 700; padding: 12px 16px; border-radius: 10px; text-decoration: none; margin-top: 8px; }
.hint { text-align: center; color: #666; font-size: .85rem; margin-top: 28px; }
</style>
</head>
<body>
<div class="nav">
  <a href="/">首页</a>
  <a href="creator-lab.html">创作实验室</a>
  <a href="checkout.html?product=ai-template-pack">快速结账</a>
</div>
<div class="container">
  <h1>LTZZZ 数字产品</h1>
  <p class="subtitle">Landing → 商品 → 结账 → 支付 → 交付 · 标价人民币 · 可付 USD/USDT</p>
  <div class="grid" id="productGrid"><div style="color:#666;padding:40px;text-align:center">加载中…</div></div>
  <p class="hint">PayPal / U卡 走适配层，未审核前不自动发货。人民币人工确认与 USDT 回填 Tx 可完成交付。</p>
</div>
<script>
const fallback = { products: [
  { id:'ai-template-pack', name:'AI 模板包', price:99, price_usd:14, category:'数字产品', description:'100+ 提示词模板，全平台覆盖', delivery:'下单后数字链接交付' },
  { id:'weekly-report', name:'行业周报（月）', price:49, price_usd:7, category:'内容', description:'每周一推送', delivery:'邮箱/TG' },
  { id:'tg-bot-custom', name:'Telegram 机器人定制', price:599, price_usd:85, category:'服务', description:'定制 Bot 含部署', delivery:'服务交付' }
]};
function render(data) {
  const grid = document.getElementById('productGrid');
  grid.innerHTML = '';
  (data.products || []).slice(0, 9).forEach(p => {
    const usd = p.price_usd || Math.max(1, Math.round(p.price / 7));
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = '<div class="category">' + (p.category||'') + '</div>' +
      '<div class="name">' + p.name + '</div>' +
      '<div class="price-row"><span class="price">¥' + p.price + '</span><span class="usd">≈ $' + usd + '</span></div>' +
      '<div class="desc">' + (p.description||'') + '</div>' +
      '<a class="btn" href="checkout.html?product=' + encodeURIComponent(p.id) + '">购买 / Checkout</a>';
    grid.appendChild(el);
  });
}
fetch('products.json').then(r => r.json()).then(render).catch(() => render(fallback));
</script>
</body>
</html>
