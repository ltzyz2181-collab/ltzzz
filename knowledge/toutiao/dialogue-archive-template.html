<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LTZZZ · 头条对话存档</title>
<style>
  :root { --bg:#f7f8fa; --card:#ffffff; --line:#e5e7eb; --ink:#1f2328; --sub:#6b7280; --accent:#e6432e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; padding:24px 16px 60px; }
  .wrap { max-width:820px; margin:0 auto; }
  header { margin-bottom:20px; }
  .brand { display:flex; align-items:center; gap:10px; font-size:20px; font-weight:700; }
  .brand .logo { width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,#e6432e,#ff8a3d); display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; font-weight:800; }
  .meta { margin-top:8px; color:var(--sub); font-size:13px; }
  .meta span { margin-right:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:14px; }
  .title { font-size:17px; font-weight:700; margin-bottom:10px; }
  .msg { display:flex; gap:10px; margin-bottom:12px; }
  .avatar { flex:0 0 34px; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; color:#fff; }
  .avatar.user { background:#4f6ef2; }
  .avatar.ai { background:linear-gradient(135deg,#e6432e,#ff8a3d); }
  .avatar.sys { background:#9ca3af; }
  .bubble { flex:1; background:#f3f4f6; border-radius:4px 14px 14px 14px; padding:10px 14px; font-size:14.5px; line-height:1.7; white-space:pre-wrap; word-break:break-word; }
  .bubble.user { background:#e8eefd; border-radius:14px 4px 14px 14px; }
  .time { color:#9ca3af; font-size:11px; margin-top:4px; }
  footer { color:var(--sub); font-size:12px; text-align:center; margin-top:30px; }
  .tag { display:inline-block; background:#fff2ee; color:var(--accent); font-size:12px; border-radius:999px; padding:2px 10px; margin-left:8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo">LZ</div>LTZZZ · 头条对话存档<span class="tag">来源：今日头条</span></div>
    <div class="meta">
      <span>对话主题：__TOPIC__</span>
      <span>时间范围：__TIME_RANGE__</span>
      <span>归档日期：__ARCHIVE_DATE__</span>
    </div>
  </header>

  <!-- 对话消息区：每一条用 .msg 结构填充，type=user/ai/sys -->
  <div id="messages">
    __MESSAGES__
  </div>

  <footer>LTZZZ 数字实验室 · 对话存档 · 敏感信息已脱敏</footer>
</div>
</body>
</html>
