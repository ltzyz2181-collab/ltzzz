// R2 Bucket: ltzzz-memory, key: products.json

export default {
  async fetch(request, env, ctx) {
    const url = new URL(request.url);
    const cors = {
      "Access-Control-Allow-Origin": "*",
      "Access-Control-Allow-Methods": "GET,POST,OPTIONS",
      "Access-Control-Allow-Headers": "Content-Type, Authorization"
    };
    if (request.method === "OPTIONS") return new Response(null, { headers: cors });

    // 鉴权 - 建议用 env.CLAUDE_CONNECTOR_TOKEN
    // const auth = request.headers.get("Authorization");

      // 1. 读取全部产品 - 给 Muse / ltzzz.com 前端用
      if (url.pathname === "/products") {
        const obj = await env.LTZZZ_MEMORY.get("products.json");
        if (!obj) return json({ error: "products.json not found in R2" }, 404, cors);
        const data = await obj.json();
        return json({ source: "R2:ltzzz-memory/products.json", count: data.length, data }, 200, cors);
      }

      // 2. 每日任务 - 6大AI调度列表
      if (url.pathname === "/daily-task") {
        const tasks = [
          { agent: "content-agent", job: "生成今日3条视频脚本", status: "ready" },
          { agent: "video-agent", job: "合成YouTube Shorts", status: "queued" },
          { agent: "publish-agent", job: "自动发布到 X / TikTok / YouTube", status: "scheduled" },
          { agent: "ecom-agent", job: "同步淘宝/拼多多/抖音小店", status: "presale-waiting-claude" },
          { agent: "cs-agent", job: "客服工单自动回复", status: "ready" },
          { agent: "report-agent", job: "生成行业周报", status: "ready" },
        ];
        // Claude总调度: 在这里调用你的调度逻辑
        return json({ date: new Date().toISOString().slice(0,10), claude_orchestrator: "active", tasks }, 200, cors);
      }

      // 3. 视频自动发布 - 接收豆包/Muse生成的视频
      if (url.pathname === "/publish-video" && request.method === "POST") {
        const body = await request.json();
        const { title, platform, videoUrl, proof } = body;
        // TODO: 写入 D1 / R2 日志, 并调用 YouTube / 抖音 API
        // 预留人工凭证字段 proof: { scriptScreenshot, renderLog }
        await env.LTZZZ_MEMORY.put(
          \`publish-log/\${Date.now()}.json\`,
          JSON.stringify({ title, platform, videoUrl, proof, at: new Date().toISOString() })
        );
        return json({ ok: true, message: "已入队，等待YouTube审核后发布", queueId: Date.now() }, 200, cors);
      }

      return json({ 
        name: "LTZZZ Claude Connector",
        endpoints: ["/products (GET)", "/daily-task (GET)", "/publish-video (POST)"],
        docs: "https://ltzzz.com/docs/connector"
      }, 200, cors);

    } catch (e) {
      return json({ error: String(e) }, 500, cors);
    }
  }
}

function json(data, status = 200, cors = {}) {
  return new Response(JSON.stringify(data, null, 2), {
    status,
    headers: { "Content-Type": "application/json; charset=utf-8", ...cors }
  });
}
