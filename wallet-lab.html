<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>真实钱包实验室 · LTZZZ</title><style>body{margin:0;background:#050914;color:#eaf7ff;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 18px 60px}.panel{background:#0a1422;border:1px solid #21405a;border-radius:18px;padding:20px;margin-top:18px}.muted{color:#8da7bb}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.row{grid-template-columns:1fr}}input{width:100%;box-sizing:border-box;background:#02060d;color:#eaf7ff;border:1px solid #21405a;border-radius:10px;padding:12px;font:inherit}.btn{padding:11px 16px;border-radius:10px;border:1px solid #36d9ee;background:#0a5264;color:white;cursor:pointer}.btn.green{border-color:#49d9a3;background:#0b4d3a}.status{padding:12px;background:#02060d;border-radius:10px;margin-top:12px;word-break:break-all}a{color:#5de7ff}</style></head><body><main class="wrap"><p style="color:#5de7ff;letter-spacing:3px">LTZZZ · WALLET LAB</p><h1>真实钱包实验室</h1><p class="muted">连接浏览器钱包，读取地址与余额；“真实转账”由钱包弹窗交给你本人确认。</p><section class="panel"><button class="btn" id="connect">连接 MetaMask / OKX</button><div class="status" id="status">未连接</div></section><section class="panel"><h2>真实 ETH 转账</h2><div class="row"><div><label>收款地址</label><input id="to" placeholder="0x..."></div><div><label>金额（ETH）</label><input id="amount" type="number" min="0" step="0.000001" placeholder="0.001"></div></div><br><button class="btn green" id="send">打开钱包确认转账</button><div class="status" id="tx">尚未发起交易</div></section><section class="panel"><h2>模拟捐赠</h2><p class="muted">只记录在本机浏览器，不产生链上交易。</p><input id="simAmount" type="number" min="0" step="1" placeholder="例如 1 元"><br><br><button class="btn" id="sim">记录模拟捐赠</button><div class="status" id="simOut">暂无记录</div></section><p class="muted"><a href="agi-lab.html">← 返回 AGI 共同实验室</a></p></main><script>let provider=null,account=null;const $=id=>document.getElementById(id);function ethHex(v){return '0x'+BigInt(Math.round(Number(v)*1e18)).toString(16)}function detect(){provider=window.ethereum||window.okxwallet||null;return provider}async function connect(){if(!detect()){$('status').textContent='没有检测到浏览器钱包。手机请用 MetaMask/OKX App 的内置浏览器打开。';return}try{const a=await provider.request({method:'eth_requestAccounts'});account=a[0];$('status').textContent='已连接：'+account; }catch(e){$('status').textContent='连接取消或失败：'+e.message}}$('connect').onclick=connect;$('send').onclick=async()=>{if(!account){await connect();if(!account)return}const to=$('to').value.trim(),amount=$('amount').value.trim();if(!/^0x[a-fA-F0-9]{40}$/.test(to)){ $('tx').textContent='请输入有效的 0x 收款地址。';return}if(!(Number(amount)>0)){ $('tx').textContent='请输入大于 0 的 ETH 金额。';return}try{$('tx').textContent='正在打开钱包确认…';const hash=await provider.request({method:'eth_sendTransaction',params:[{from:account,to,value:ethHex(amount)}]});$('tx').textContent='交易已提交：'+hash}catch(e){$('tx').textContent='交易未完成：'+e.message}};$('sim').onclick=()=>{const n=Number($('simAmount').value);if(!(n>=0))return;$('simOut').textContent='本机已记录模拟捐赠：¥'+n.toFixed(2)+' · '+new Date().toLocaleString('zh-CN')};</script></body></html>
