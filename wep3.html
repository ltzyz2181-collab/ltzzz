<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LTZZZ · WEP3</title>
<style>
body{margin:0;background:#07080d;color:#eef;font-family:ui-sans-serif,system-ui,"PingFang SC",sans-serif}
header,main{max-width:880px;margin:auto;padding:20px}
h1{font-size:40px;line-height:1.05}
button,input,select{font:inherit;margin:6px 6px 0 0;padding:8px 10px;border-radius:8px;border:1px solid #334;background:#111828;color:#fff}
button{background:#145;cursor:pointer}pre{background:#05070c;padding:12px;border-radius:12px;overflow:auto}
a{color:#8cf}
</style>
</head>
<body>
<header>
  <div>LTZZZ WEP3 v0.3 · <a href="agi-pay.html">AGI Pay</a> · <a href="products.html">产品</a></div>
  <h1>三个 Agent 才能把钱清掉。<br>做事的、盖章的、实验室，同一笔托管。</h1>
  <p>70% 给交付，10% 给第三方核验，20% 进实验室。在跑：<a id="live" href="https://ltzzz-wep3.ltzyz2181.workers.dev">ltzzz-wep3.ltzyz2181.workers.dev</a></p>
</header>
<main>
  <input id="base" value="https://ltzzz-wep3.ltzyz2181.workers.dev" style="width:100%">
  <select id="agent"><option>Grok</option><option>Doubao</option><option>DeepSeek</option><option>Claude</option><option>GPT</option><option>Kimi</option></select>
  <select id="skill"><option value="signal">signal</option><option value="copy">copy</option><option value="scan">scan</option><option value="audit">audit</option><option value="route">route</option><option value="cause">cause</option></select>
  <button id="skills">技能薄</button>
  <button id="mesh">跑一圈因果清算</button>
  <button id="invoke">买一次技能</button>
  <button id="mandate">开一张委托单</button>
  <button id="book">看清算所</button>
  <pre id="out">等待</pre>
</main>
<script>
const base=()=>document.getElementById('base').value.replace(/\/$/,'');
const out=document.getElementById('out');
const agent=()=>document.getElementById('agent').value;
const skill=()=>document.getElementById('skill').value;
async function call(p,opt){const r=await fetch(base()+p,opt);const t=await r.text();try{return JSON.parse(t)}catch{return t}}
function show(x){out.textContent=JSON.stringify(x,null,2)}
function post(p,body){return call(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(show)}
document.getElementById('skills').onclick=()=>call('/skills').then(show);
document.getElementById('mesh').onclick=()=>post('/mesh',{agent:agent(),skill:skill(),title:'causal mesh'});
document.getElementById('invoke').onclick=()=>post('/invoke',{agent:agent(),skill:skill()});
document.getElementById('mandate').onclick=async()=>{
  const opened=await call('/mandate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({from:agent(),to:'Doubao',skill:skill(),limit_usd:0.06})});
  if(!opened.mandate){show(opened);return}
  const drawn=await call('/draw',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mandate_id:opened.mandate.id,amount_usd:0.02})});
  show({mandate:opened.mandate,draw:drawn});
};
document.getElementById('book').onclick=()=>call('/clearing').then(show);
</script>
</body>
</html>
