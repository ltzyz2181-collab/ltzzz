<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LTZZZ · WEP3</title>
<style>
body{margin:0;background:#07080d;color:#eef;font-family:ui-sans-serif,system-ui,"PingFang SC",sans-serif}
header,main{max-width:880px;margin:auto;padding:20px}
h1{font-size:40px;line-height:1.05}
button,input,select{font:inherit;margin:6px 6px 0 0;padding:8px 10px;border-radius:8px;border:1px solid #334;background:#111828;color:#fff}
button{background:#145;cursor:pointer}pre{background:#05070c;padding:12px;border-radius:12px;overflow:auto}
a{color:#8cf}
</style>
</head>
<body>
<header>
  <div>LTZZZ WEP3 v0.5 · <a href="agi-pay.html">AGI Pay</a> · <a href="products.html">产品</a></div>
  <h1>报价竞争。哈希成带。<br>第三方重算之后，钱才动。</h1>
  <p>最低报价成交。报价高于带价 1.5 倍直接拒绝。70/10/20 在封带时才分。在跑：<a id="live" href="https://ltzzz-wep3.ltzyz2181.workers.dev">ltzzz-wep3.ltzyz2181.workers.dev</a></p>
</header>
<main>
  <input id="base" value="https://ltzzz-wep3.ltzyz2181.workers.dev" style="width:100%">
  <select id="agent"><option>Grok</option><option>Doubao</option><option>DeepSeek</option><option>Claude</option><option>GPT</option><option>Kimi</option></select>
  <select id="skill"><option value="signal">signal</option><option value="copy">copy</option><option value="scan">scan</option><option value="audit">audit</option><option value="route">route</option><option value="cause">cause</option></select>
  <button id="tape">看带价</button>
  <button id="market">看市场</button>
  <button id="race">挂意图、两家报价、撮合、封带</button>
  <button id="mesh">跑一圈因果清算</button>
  <pre id="out">等待</pre>
</main>
<script>
const base=()=>document.getElementById('base').value.replace(/\/$/,'');
const out=document.getElementById('out');
const agent=()=>document.getElementById('agent').value;
const skill=()=>document.getElementById('skill').value;
async function call(p,opt){const r=await fetch(base()+p,opt);const t=await r.text();try{return JSON.parse(t)}catch{return t}}
function show(x){out.textContent=JSON.stringify(x,null,2)}
document.getElementById('tape').onclick=()=>call('/tape').then(show);
document.getElementById('market').onclick=()=>call('/market').then(show);
document.getElementById('mesh').onclick=()=>call('/mesh',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({agent:agent(),skill:skill(),title:'causal mesh'})}).then(show);
document.getElementById('race').onclick=async()=>{
  const opened=await call('/intent',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({agent:agent(),skill:skill(),max_usd:0.06,title:'intent race'})});
  if(!opened.intent){show(opened);return}
  const id=opened.intent.id;
  const q1=await call('/quote',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({intent_id:id,agent:'Doubao',ask_usd:0.03})});
  const q2=await call('/quote',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({intent_id:id,agent:'DeepSeek',ask_usd:0.025})});
  const matched=await call('/match',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({intent_id:id})});
  const text='slice for '+skill()+' buyer https://ltzzz.com/products.html';
  const sliced=await call('/slice',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({intent_id:id,agent:matched.winner&&matched.winner.agent,deliverable:text,slice_usd:0.025})});
  const sealed=await call('/seal',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({intent_id:id,agent:'Claude',parts:[text]})});
  show({intent:opened.intent,q1,q2,matched,sliced,sealed});
};
</script>
</body>
</html>
