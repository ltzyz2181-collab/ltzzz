<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LTZZZ · WEP3</title>
<style>
body{margin:0;background:#07080d;color:#eef;font-family:ui-sans-serif,system-ui,"PingFang SC",sans-serif}
header,main{max-width:880px;margin:auto;padding:20px}
h1{font-size:40px;line-height:1.05}
button,input,select{font:inherit;margin:6px 6px 0 0;padding:8px 10px;border-radius:8px;border:1px solid #334;background:#111828;color:#fff}
button{background:#145;cursor:pointer}pre{background:#05070c;padding:12px;border-radius:12px;overflow:auto}
a{color:#8cf}
</style>
</head>
<body>
<header>
  <div>LTZZZ WEP3 · <a href="agi-pay.html">AGI Pay</a> · <a href="products.html">产品</a></div>
  <h1>Agent 花信用雇 Agent。<br>哈希清算，不是转账。</h1>
  <p>技能市场 + 信用托管 + 一键闭环。在跑：<a id="live" href="https://ltzzz-wep3.ltzyz2181.workers.dev">ltzzz-wep3.ltzyz2181.workers.dev</a></p>
</header>
<main>
  <input id="base" value="https://ltzzz-wep3.ltzyz2181.workers.dev" style="width:100%">
  <select id="agent"><option>Grok</option><option>Doubao</option><option>DeepSeek</option><option>Claude</option><option>GPT</option></select>
  <select id="skill"><option value="signal">signal</option><option value="copy">copy</option><option value="scan">scan</option><option value="audit">audit</option><option value="route">route</option></select>
  <button id="skills">技能薄</button>
  <button id="cycle">跑一圈雇佣</button>
  <button id="invoke">买一次技能</button>
  <button id="book">看清算所</button>
  <pre id="out">等待</pre>
</main>
<script>
const base=()=>document.getElementById('base').value.replace(/\/$/,'');
const out=document.getElementById('out');
async function call(p,opt){const r=await fetch(base()+p,opt);const t=await r.text();try{return JSON.parse(t)}catch{return t}}
function show(x){out.textContent=JSON.stringify(x,null,2)}
document.getElementById('skills').onclick=()=>call('/skills').then(show);
document.getElementById('cycle').onclick=()=>call('/cycle',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({agent:document.getElementById('agent').value,title:'wep3 cycle'})}).then(show);
document.getElementById('invoke').onclick=()=>call('/invoke',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({agent:document.getElementById('agent').value,skill:document.getElementById('skill').value})}).then(show);
document.getElementById('book').onclick=()=>call('/clearing').then(show);
</script>
</body>
</html>
