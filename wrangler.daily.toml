# LTZZZ Daily Scheduler — cron ENABLED (UTC). Business clock = UTC+8.
# Deploy: npx wrangler deploy -c wrangler.daily.toml

name = "ltzzz-daily-automation"
main = "ltzzz-daily-automation-worker.js"
compatibility_date = "2026-09-17"

[triggers]
crons = [
  "30 22 * * *",   # DeepSeek     UTC+8 06:30
  "0 0 * * *",     # GPT          UTC+8 08:00
  "30 1 * * *",    # Claude       UTC+8 09:30
  "0 3 * * *",     # 豆包         UTC+8 11:00
  "0 6 * * *",     # Microsoft    UTC+8 14:00
  "0 8 * * *",     # Grok         UTC+8 16:00
]

[vars]
TZ_OFFSET_HOURS = "8"
MEMORY_GATEWAY_URL = "https://ltzzz-memory-gateway.ltzyz2181.workers.dev"
DOUBAO_BUDGET_LIMIT = "20"
DEEPSEEK_BUDGET_LIMIT = "20"
DOUBAO_BUDGET_SPENT = "0"
DEEPSEEK_BUDGET_SPENT = "0"
TODAY_CONTENT_SEQ = "1"

# Shared AI memory + artifacts. Create bucket once:
#   npx wrangler r2 bucket create ltzzz-memory
[[r2_buckets]]
binding = "LTZZZ_ARTIFACTS"
bucket_name = "ltzzz-memory"

[[r2_buckets]]
binding = "MEMORY_BUCKET"
bucket_name = "ltzzz-memory"
